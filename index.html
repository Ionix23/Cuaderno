    'Cortés Yagüe, Aitana',      // 3  ACS (DEA)
    'Dobre, Andrei',             // 4  ACNS (INC)
    'Esteban Roldán, Hugo',      // 5
    'Fernández Gil, Claudia',    // 6  ACA (AACC)
    'García Puyol, Iker',        // 7
    'Haddou, Salma',             // 8
    'Íñiguez Bello, Martina',    // 9  ACS (NEE/TEA)
    'Jiménez Casas, Pablo',      // 10
    'Lorente Vera, Noa',         // 11 ACNS (TDAH)
    'Molina Sanz, Diego',        // 12
    'Navarro Alcalde, Elena',    // 13
    'Ortega Ruiz, Samuel',       // 14
    'Pardo Mediano, Valeria',    // 15
    'Quintana Abad, Nicolás'     // 16
  ];
  names.forEach(n=>c.students.push({id:uid(), name:n}));
  const S = i => c.students[i-1].id;      // acceso 1-indexado, como el número de lista

  const pIni = c.periods.find(p=>p.initial).id;
  const p1   = c.periods.find(p=>!p.initial).id;      // 1.ª evaluación

  /* ================= ATENCIÓN A LA DIVERSIDAD ================= */
  // Medidas generales DUA activas en las dos áreas
  c.dua['ing'] = ['representacion::1','representacion::4','accion::1','accion::2','implicacion::1','implicacion::3'];
  c.dua['nat'] = ['representacion::0','representacion::4','accion::2','accion::3','implicacion::0','implicacion::5'];

  // Perfiles por alumno y área
  const dv = (i, aid, o) => { c.diversity[dvkey(S(i), aid)] = o; };

  // 3 · Cortés Yagüe, Aitana — DEA (dislexia) con ACS en Inglés y ACNS en Naturales
  dv(3,'ing',{cond:['DEA'], med:'ACS', refCycle:2,
    note:'Dislexia con desfase en lectoescritura en lengua extranjera. Se evalúa con criterios de 2.º ciclo.',
    measures:['Textos con tipografía adaptada y mayor interlineado.','Más tiempo en las pruebas escritas.','No penalizar la ortografía en inglés.']});
  dv(3,'nat',{cond:['DEA'], med:'ACNS', refCycle:null,
    note:'Sigue los criterios de su curso; se adaptan los instrumentos, no los criterios.',
    measures:['Pruebas con enunciados leídos en voz alta.','Permitir respuestas orales en lugar de escritas.']});

  // 4 · Dobre, Andrei — incorporación tardía, ACNS en ambas
  dv(4,'ing',{cond:['INC'], med:'ACNS', refCycle:null,
    note:'Incorporación tardía. Comprende mejor de lo que produce; se prima la comprensión.',
    measures:['Apoyo visual y glosario bilingüe.','Valorar la participación oral aunque la producción sea breve.']});
  dv(4,'nat',{cond:['INC'], med:'ACC', refCycle:null,
    note:'Desconocimiento inicial de la lengua vehicular.',
    measures:['Vocabulario clave traducido antes de cada unidad.','Uso de imágenes y esquemas para los contenidos.']});

  // 6 · Fernández Gil, Claudia — altas capacidades, ACA en Naturales
  dv(6,'nat',{cond:['AACC'], med:'ACA', refCycle:3,
    note:'Altas capacidades. Se amplían los criterios con tareas de investigación de mayor profundidad.',
    measures:['Proyectos de ampliación con producto propio.','Rol de tutora entre iguales en el trabajo cooperativo.']});
  dv(6,'ing',{cond:['AACC'], med:'GEN', refCycle:null,
    note:'En Inglés no precisa ampliación formal; se enriquece con lecturas graduadas.',
    measures:['Lecturas graduadas de nivel superior.']});

  // 9 · Íñiguez Bello, Martina — NEE/TEA con ACS en las dos áreas
  dv(9,'ing',{cond:['NEE','TEA'], med:'ACS', refCycle:2,
    note:'TEA con nivel de competencia de 2.º ciclo en lengua extranjera. Evaluación con criterios adaptados.',
    measures:['Anticipación de la tarea con guion visual.','Entorno estructurado y consignas breves.','Evitar cambios imprevistos en la dinámica.']});
  dv(9,'nat',{cond:['NEE','TEA'], med:'ACS', refCycle:2,
    note:'Se prioriza la observación guiada y el vocabulario básico del medio natural.',
    measures:['Rutinas visuales para el trabajo experimental.','Apoyo de la PT dentro del aula dos sesiones semanales.']});

  // 11 · Lorente Vera, Noa — TDAH, ACNS en ambas
  dv(11,'ing',{cond:['TDAH'], med:'ACNS', refCycle:null,
    note:'Dificultad de atención sostenida. Criterios del curso; se fragmentan las tareas.',
    measures:['Tareas divididas en pasos cortos.','Ubicación cercana al docente.','Recordatorio del tiempo restante en las pruebas.']});
  dv(11,'nat',{cond:['TDAH'], med:'APO', refCycle:null,
    note:'Apoyo ordinario en el aula durante el trabajo por proyectos.',
    measures:['Checklist de pasos en las prácticas de laboratorio.']});

  // 15 · Pardo Mediano, Valeria — vulnerabilidad socioeducativa, medidas sin adaptación
  dv(15,'ing',{cond:['VUL'], med:'GEN', refCycle:null,
    note:'Situación socioeducativa vulnerable; sin desfase curricular.',
    measures:['Materiales facilitados por el centro.','Refuerzo en el horario de biblioteca.']});

  /* ================= HELPERS DE CONSTRUCCIÓN ================= */
  const RUB = LEVEL_PRESETS.calif;    // Insuficiente · Suficiente · Bien · Notable · Sobresaliente

  // rúbrica: items = [[nombre, [criterios], [5 descriptores]], ...]
  function rubric(items){
    return {type:'rubric', max:10, levels:RUB.slice(),
      items: items.map(([n,cr,cells])=>{ const it=mkItem(n,cr,cells); return it; })};
  }
  function escala(items, n){
    return {type:'scale', max:10, levels:numericLevels(n||4),
      items: items.map(([nm,cr])=>mkItem(nm,cr,[]))};
  }
  function cotejo(items){
    return {type:'check', max:10, levels:[], items: items.map(([nm,cr])=>mkItem(nm,cr,[]))};
  }
  const numInstr = (max)=>({type:'num', max:max||10, levels:[], items:[]});

  function unit(areaId, periodId, name, desc){
    const u = {id:uid(), areaId:areaId, periodId:periodId, name:name, desc:desc};
    c.units.push(u); return u;
  }
  function task(u, o){
    const t = {id:uid(), areaId:u.areaId, periodId:u.periodId, unitId:u.id,
      name:o.name, skill:o.skill||'', desc:o.desc||'', goals:o.goals||'', activities:o.activities||'',
      criteria:o.criteria||[], weight:o.weight||0, instr:o.instr, adaptations:{}};
    c.tasks.push(t); return t;
  }
  // adaptación de una tarea para un alumno
  function adapt(t, i, refCycle, criteria, instr){
    t.adaptations[S(i)] = {refCycle:refCycle, criteria:criteria, instr:instr||null};
  }

  /* =========================================================
     INGLÉS · 1.ª evaluación · dos unidades
     ========================================================= */
  const u1 = unit('ing', p1, 'Unit 1: Where I live',
    'La localidad, los lugares del barrio y cómo dar indicaciones. Producto final: una guía de nuestro pueblo para un alumno de intercambio.');

  const t1 = task(u1, {
    name:'Speaking: Welcome to my town', skill:'speaking', weight:30,
    desc:'Presentación oral por parejas describiendo el pueblo y tres lugares de interés.',
    goals:'Describir lugares conocidos y dar indicaciones sencillas con el vocabulario de la unidad.',
    activities:'Modelo del maestro · mapa mental de vocabulario · ensayo por parejas · presentación ante el grupo.',
    criteria:['2.1','3.1'],
    instr: rubric([
      ['Contenido e información', ['2.1'], [
        'No transmite la información pedida o lo hace de forma inconexa.',
        'Nombra algún lugar, con omisiones importantes.',
        'Describe los lugares pedidos de forma comprensible.',
        'Describe con detalle y añade información propia.',
        'Descripción rica, con detalles y adaptada a quien escucha.']],
      ['Uso de la lengua', ['2.1'], [
        'El léxico y las estructuras impiden entender el mensaje.',
        'Usa estructuras muy básicas con errores frecuentes.',
        'Usa el vocabulario de la unidad con algún error.',
        'Usa el vocabulario y las estructuras con corrección.',
        'Amplía el léxico más allá de lo trabajado en clase.']],
      ['Pronunciación y fluidez', ['2.1'], [
        'La pronunciación impide seguir el mensaje.',
        'Se entiende con esfuerzo; muchas pausas.',
        'Se entiende bien; ritmo aceptable.',
        'Pronunciación clara y ritmo adecuado.',
        'Pronunciación natural y buena entonación.']],
      ['Interacción con el compañero', ['3.1'], [
        'No participa o interrumpe el turno del otro.',
        'Participa solo si se le pide y con ayuda.',
        'Participa y escucha al compañero.',
        'Participa, escucha y responde a lo que dice.',
        'Ayuda a continuar la conversación y anima al otro.']]
    ])});

  const t2 = task(u1, {
    name:'Writing: A guide of my town', skill:'writing', weight:25,
    desc:'Texto breve con tres lugares del pueblo siguiendo un modelo dado.',
    goals:'Redactar un texto sencillo organizado y con el registro adecuado.',
    activities:'Lectura de modelos · borrador guiado · revisión entre iguales · versión final ilustrada.',
    criteria:['2.2'],
    instr: rubric([
      ['Contenido y adecuación', ['2.2'], [
        'No se ajusta a lo pedido.',
        'Cumple parcialmente lo pedido.',
        'Incluye los tres lugares con información básica.',
        'Información completa y bien elegida.',
        'Información completa, original y bien adaptada al lector.']],
      ['Organización del texto', ['2.2'], [
        'Sin orden reconocible.',
        'Orden confuso en parte del texto.',
        'Texto ordenado siguiendo el modelo.',
        'Buena organización con conectores sencillos.',
        'Texto muy bien cohesionado y con voz propia.']],
      ['Corrección lingüística', ['2.2'], [
        'Los errores impiden la comprensión.',
        'Errores frecuentes que dificultan la lectura.',
        'Errores puntuales que no impiden entender.',
        'Pocos errores; uso correcto de lo trabajado.',
        'Texto correcto y con estructuras variadas.']]
    ])});

  const t3 = task(u1, {
    name:'Listening: Directions', skill:'listening', weight:25,
    desc:'Prueba de comprensión oral: seguir indicaciones en un plano.',
    goals:'Captar información específica en textos orales sencillos.',
    activities:'Audiciones de la unidad, práctica con planos y prueba final.',
    criteria:['1.1','1.2'],
    instr: numInstr(10)});

  const t4 = task(u1, {
    name:'Trabajo diario y participación', skill:'', weight:20,
    desc:'Observación sistemática del trabajo en el aula durante la unidad.',
    goals:'Trabajar con autonomía y usar el inglés como lengua de aula.',
    activities:'Registro semanal en el cuaderno del maestro.',
    criteria:['5.2'],
    instr: escala([
      ['Trae el material y termina las tareas', ['5.2']],
      ['Usa el inglés en clase para lo cotidiano', ['5.2']],
      ['Corrige sus errores a partir del feedback', ['5.2']]
    ], 4)});

  // Adaptaciones de la Unit 1 (criterios de 2.º ciclo)
  adapt(t1, 3, 2, ['2.1'], rubric([
      ['Contenido: dice tres lugares', ['2.1'], [
        'No nombra ningún lugar.','Nombra un lugar con ayuda.','Nombra tres lugares con apoyo visual.',
        'Nombra tres lugares y añade un detalle.','Describe los lugares con una frase cada uno.']],
      ['Frases aprendidas', ['2.1'], [
        'No usa las frases trabajadas.','Repite alguna frase con mucha ayuda.','Usa las frases modelo con apoyo.',
        'Usa las frases modelo por sí sola.','Combina frases para ampliar la idea.']]
    ]));
  adapt(t1, 9, 2, ['2.1'], rubric([
      ['Presenta con guion visual', ['2.1'], [

  adapt(t2, 3, 2, ['2.2'], rubric([

        'No completa el modelo.','Completa alguna parte con ayuda.','Completa el modelo dado.',

      ['Escribe palabras clave', ['2.2'], [
        'No escribe las palabras.','Copia alguna palabra.','Escribe las palabras clave con modelo.',
        'Escribe las palabras y una frase corta.','Escribe dos o tres frases con apoyo.']]

/* arrastre de mesas y elementos, con ajuste a la casilla del grid */
function bindAulaDrag(){
  const stage = document.getElementById('aulaStage');
  if(!stage) return;
  let drag = null;

  stage.addEventListener('pointerdown', e=>{
    const item = e.target.closest('.aula-item');
    if(!item) return;
    if(e.target.closest('.el-del') || e.target.closest('.el-rot')) return;
    const c = course(); const L = layoutOf(c);
    const it = L.items.find(x=>x.id===item.dataset.id); if(!it) return;
    const rect = stage.getBoundingClientRect();
    drag = { it, item, rect, cellW: rect.width/GRID_COLS, cellH: rect.height/GRID_ROWS,
             offX: e.clientX - item.getBoundingClientRect().left,
             offY: e.clientY - item.getBoundingClientRect().top };
    item.classList.add('dragging');
    item.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  stage.addEventListener('pointermove', e=>{
    if(!drag) return;
    // posición del elemento en px dentro del stage, quitando el offset de agarre
    const px = e.clientX - drag.rect.left - drag.offX;
    const py = e.clientY - drag.rect.top - drag.offY;
    // preview libre mientras se arrastra
    drag.item.style.left = Math.max(0, Math.min(drag.rect.width-drag.item.offsetWidth, px))+'px';
    drag.item.style.top  = Math.max(0, Math.min(drag.rect.height-drag.item.offsetHeight, py))+'px';
    // celda destino (snap)
    drag._cx = Math.round(px / drag.cellW);
    drag._cy = Math.round(py / drag.cellH);
  });
  const end = ()=>{
    if(!drag) return;
    const d = elemDims(drag.it);
    let cx = drag._cx==null ? drag.it.x : drag._cx;
    let cy = drag._cy==null ? drag.it.y : drag._cy;
    cx = Math.max(0, Math.min(GRID_COLS-d.cw, cx));
    cy = Math.max(0, Math.min(GRID_ROWS-d.ch, cy));
    drag.it.x = cx; drag.it.y = cy;
    drag.item.classList.remove('dragging');
    drag = null;
    save(); render();   // redibuja ya ajustado a la celda
  };
  stage.addEventListener('pointerup', end);
  stage.addEventListener('pointercancel', end);
}

function openModal(html, onOk, okLabel, opts){
  opts = opts || {};
  const wrap = document.createElement('div');
  wrap.className = 'backdrop';
  wrap.innerHTML = `<div class="modal${opts.wide?' wide':''}${opts.xl?' xl':''}" role="dialog" aria-modal="true">${html}
    <div class="row" style="margin-top:14px"><div class="spacer"></div>
      <button class="btn ghost" data-close>Cancelar</button>
      ${onOk?`<button class="btn" data-ok>${esc(okLabel||'Guardar')}</button>`:''}</div></div>`;
  document.body.appendChild(wrap);
  /* en pantallas táctiles no se enfoca nada al abrir: evitaría ver la ventana y sacaría el teclado */
  const touch = window.matchMedia && window.matchMedia('(pointer:coarse)').matches;
  const f = wrap.querySelector('.inp:not([data-cmt])'); if(f && !touch) f.focus();
  const close = ()=>wrap.remove();
  wrap.addEventListener('click', e=>{
    if(e.target===wrap || e.target.hasAttribute('data-close')) return close();
    if(e.target.hasAttribute('data-ok')){ close(); onOk(vals(wrap), wrap); save(); render(); }
  });
  wrap.addEventListener('keydown', e=>{ if(e.key==='Escape') close(); });
  return wrap;
}
function vals(wrap){
  const v = {};
  wrap.querySelectorAll('[name]').forEach(i=>{ v[i.name] = i.type==='checkbox' ? i.checked : i.value.trim(); });
  return v;
}
function field(label, name, opts){
  opts = opts || {};
  const t = opts.type || 'text';
  if(t==='textarea') return `<label class="field"><span>${esc(label)}</span><textarea class="inp" name="${name}" placeholder="${esc(opts.placeholder||'')}" ${opts.rows?`style="min-height:${opts.rows*22}px"`:''}>${esc(opts.value||'')}</textarea></label>`;
  if(t==='select') return `<label class="field"><span>${esc(label)}</span><select class="inp" name="${name}">${opts.options.map(o=>`<option value="${esc(o.value)}" ${o.value===opts.value?'selected':''}>${esc(o.label)}</option>`).join('')}</select></label>`;
  return `<label class="field"><span>${esc(label)}</span><input class="inp" name="${name}" type="${t}" value="${esc(opts.value==null?'':opts.value)}" placeholder="${esc(opts.placeholder||'')}"></label>`;
}
function confirmDo(msg, sub, fn){
  openModal(`<h3>${esc(msg)}</h3>${sub?`<p class="sub">${esc(sub)}</p>`:''}`, ()=>fn(), 'Eliminar');
}

/* ---------- calificar una tarea ---------- */
function openCell(studentId, taskId){
  const c = course();
  const task = taskById(c, taskId);
  const ins = effInstr(c, task, studentId);
  const adaptedHere = isAdaptedFor(c, task, studentId);
  const adTag = adaptedHere? ' <span class="tag warn">adaptada</span>' : '';
  const s = c.students.find(x=>x.id===studentId);
  const key = gkey(studentId, taskId);
  if(!ins || ins.type==='num') return;

  const items = ins.items||[], levels = ins.levels||[];
  let raw = c.grades[key];
  const mkBlock = commentBlock(c, studentId, taskId) + marksPicker(c, studentId, taskId);
  const withMarks = w=>{ bindMarks(w, c, studentId, taskId); bindComment(w, c, studentId, taskId);
    w.addEventListener('click', e=>{ if(e.target.hasAttribute('data-close') || e.target===w) render(); });
    return w; };

  if(ins.type==='points'){
    if(!Array.isArray(raw) || raw.length!==items.length) raw = items.map(()=>null);
    const mx = ins.max||10;
    const next = c.students[c.students.findIndex(x=>x.id===studentId)+1];
    const inner = `<h3>${esc(task.name)}${adTag}</h3><p class="sub">${esc(s.name)} · una nota por apartado, sobre ${mx}</p>
      <div class="pt-list">${items.map((it,i)=>`<label class="pt-row">
        <span class="pt-name"><strong>${esc(it.name||('Apartado '+(i+1)))}</strong>${itemCrits(it).map(k=>`<span class="chip on">${esc(k)}</span>`).join('')}<span class="tag grey">${itemPct(ins,i)}%</span></span>
        <span class="pt-inp"><input class="inp pt-val" inputmode="decimal" autocomplete="off" data-pt="${i}" value="${num(raw[i])==null?'':esc(String(raw[i]).replace('.',','))}" placeholder="–"><i>/ ${mx}</i></span></label>`).join('')}</div>
      <p class="sub" id="cellPreview" style="margin-top:10px"></p>${mkBlock}`;
    const read = ()=>[...wrap.querySelectorAll('.pt-val')].map(x=>{ const v = num(x.value); return v==null ? null : Math.max(0, Math.min(mx, v)); });
    const store = ()=>{ const out = read(); if(out.some(v=>v!=null)) c.grades[key] = out; else delete c.grades[key]; };
    const wrap = withMarks(openModal(inner, store, 'Guardar'));
    const upd = ()=>{
      const out = read(); let a=0, w=0;
      items.forEach((it,i)=>{ if(out[i]!=null){ const wi = Number(it.weight)||1; a += out[i]/mx*10*wi; w += wi; } });
      const v = w ? a/w : null;
      const adj = isAdjTask(c, studentId, taskId);
      wrap.querySelector('#cellPreview').innerHTML = (v==null ? 'Sin calificar todavía.' : 'Nota de la tarea: <b>'+fmt2(v)+'</b> '+pill(v, c.scale))
        + (adj ? ' <span class="count mid" style="margin-left:6px">ajustada a mano a '+fmt2(num(c.overrides[key]))+'</span>' : '');
      wrap.querySelectorAll('.pt-val').forEach(x=>{ const n = num(x.value); x.classList.toggle('bad', x.value.trim()!=='' && (n==null || n<0 || n>mx)); });
    };
    wrap.addEventListener('input', e=>{ if(e.target.classList.contains('pt-val')) upd(); });
    /* Intro pasa al apartado siguiente; en el último, guarda (y abre al alumno siguiente) */
    wrap.addEventListener('keydown', e=>{
      if(e.key!=='Enter' || !e.target.classList.contains('pt-val')) return;
      e.preventDefault();
      const all = [...wrap.querySelectorAll('.pt-val')], i = all.indexOf(e.target);
      if(all[i+1]){ all[i+1].focus(); all[i+1].select(); }
      else (wrap.querySelector('[data-next]') || wrap.querySelector('[data-ok]')).click();
    });
    if(next){
      const nb = document.createElement('button');
      nb.className = 'btn'; nb.dataset.next = '1'; nb.textContent = 'Guardar y siguiente ▸'; nb.title = 'Guarda y abre a '+next.name;
      nb.addEventListener('click', ev=>{ ev.preventDefault(); ev.stopPropagation(); store(); wrap.remove(); save(); render(); openCell(next.id, taskId); });
      wrap.querySelector('.modal > .row').appendChild(nb);
      wrap.querySelector('[data-ok]').classList.add('ghost');
    }
    upd();
    return;
  }

  if(ins.type==='faces'){
    if(!Array.isArray(raw) || raw.length!==items.length) raw = items.map(()=>null);
    const sel = raw.slice();
    const single = items.length===1;
    const inner = `<h3>${esc(task.name)}${adTag}</h3><p class="sub">${esc(s.name)} · observación${task.informative?' · informativa, no cuenta para la nota':''}</p>
      ${items.map((it,i)=>`<div class="face-item">
        ${single?'':`<strong>${esc(it.name||('Ítem '+(i+1)))}</strong>`}
        ${single && it.name?`<p class="sub" style="margin:0 0 6px">${esc(it.name)}</p>`:''}
        <div class="face-row">${levels.map((l,j)=>`<button type="button" class="face-btn ${sel[i]===j?'on':''}" data-fi="${i}" data-fj="${j}"><span class="face-ic">${levelFace(l)||'•'}</span><span>${esc(l.label)}</span></button>`).join('')}
          <button type="button" class="face-btn none ${sel[i]==null?'on':''}" data-fi="${i}" data-fj="null"><span class="face-ic">–</span><span>Sin valorar</span></button></div>
      </div>`).join('')}
      ${single?'':`<div id="dianaBox"></div><button type="button" class="btn ghost small" data-kid style="margin-top:8px">🧒 Que lo rellene el alumno</button>`}
      ${mkBlock}`;
    const wrap = withMarks(openModal(inner, ()=>{ c.grades[key] = sel.some(x=>x!=null) ? sel : null; if(c.grades[key]==null) delete c.grades[key]; }, 'Guardar'));
    wrap.addEventListener('click', e=>{
      const b = e.target.closest('[data-fj]'); if(!b) return;
      e.preventDefault();
      const i = Number(b.dataset.fi);
      sel[i] = b.dataset.fj==='null' ? null : Number(b.dataset.fj);
      wrap.querySelectorAll('[data-fi="'+i+'"]').forEach(x=>x.classList.toggle('on', (x.dataset.fj==='null' && sel[i]==null) || Number(x.dataset.fj)===sel[i]));
      if(single) wrap.querySelector('[data-ok]').click();   // con un solo ítem, un toque y listo
      else dUpd();
    });
    const dUpd = ()=>{ const b = wrap.querySelector('#dianaBox'); if(b) b.innerHTML = ins.diana ? dianaSvg(ins, sel, 260) : ''; };
    const kb = wrap.querySelector('[data-kid]');
    if(kb) kb.addEventListener('click', e=>{ e.preventDefault(); e.stopPropagation(); wrap.style.display='none';
      studentMode(task.name, s.name, ins, sel, ()=>{ wrap.style.display='';
        wrap.querySelectorAll('[data-fi]').forEach(x=>{ const i=Number(x.dataset.fi); x.classList.toggle('on', (x.dataset.fj==='null' && sel[i]==null) || Number(x.dataset.fj)===sel[i]); }); dUpd(); }); });
    dUpd();
    return;
  }

  if(ins.type==='check'){
    if(!Array.isArray(raw) || raw.length!==items.length) raw = items.map(()=>false);
    let inner = `<h3>${esc(task.name)}${adTag}</h3><p class="sub">${esc(s.name)} · lista de cotejo</p>`;
    inner += items.map((it,i)=>`<label class="check-opt"><input type="checkbox" data-i="${i}" ${raw[i]?'checked':''}><span>${esc(it.name)}</span></label>`).join('');
    inner += `<p class="sub" id="cellPreview" style="margin-top:10px"></p>` + mkBlock;
    const wrap = withMarks(openModal(inner, ()=>{
      c.grades[key] = [...wrap.querySelectorAll('.check-opt input[type="checkbox"]')].map(i=>i.checked);
    }));
    const upd = ()=>{
      const out = [...wrap.querySelectorAll('.check-opt input[type="checkbox"]')].map(i=>i.checked);
      const done = out.filter(Boolean).length;
      wrap.querySelector('#cellPreview').textContent = done+' de '+out.length+' conseguidos → '+fmt2((done/out.length)*10);
    };
    wrap.addEventListener('change', upd); upd();
    return;
  }

  if(!Array.isArray(raw) || raw.length!==items.length) raw = items.map(()=>null);
  const sel = raw.slice();

  // RÚBRICA → matriz grande: filas=ítems, columnas=niveles, celda=descriptor clicable
  if(ins.type==='rubric'){
    const inner = `<h3>${esc(task.name)}${adTag}</h3>
      <p class="sub">${esc(s.name)} · rúbrica${adaptedHere?' · criterios de '+CYCLE_NAMES[effCycle(c,task,studentId)]:''}</p>
      <div class="gm-bar"><div class="gm-score" id="gmScore"></div><div class="gm-dots" id="gmDots"></div><span class="gm-left" id="gmLeft"></span>
        <div class="spacer"></div><button type="button" class="btn ghost small" data-compact></button></div>
      <div class="gm-scroll">
      <table class="grade-matrix${state.rubCompact?' compact':''}">
        <thead><tr><th class="gm-itemhead">Aspecto evaluado</th>
          ${levels.map((l,j)=>`<th class="${tn(l)}"><div class="gm-h">${lvlBars(levels,j)}<b>${esc(l.label)}</b><span class="gm-v">${fmt2(l.value)}</span></div></th>`).join('')}
          <th style="width:70px">—</th></tr></thead>
        <tbody>
        ${items.map((it,i)=>`<tr data-row="${i}">
          <td class="gm-item"><strong>${esc(it.name||'Ítem '+(i+1))}</strong>
            <div class="gm-meta">${itemCrits(it).map(k=>`<span class="chip on">${esc(k)}</span>`).join('')}
            <span class="tag grey">${itemPct(ins,i)}%</span></div>
            <div class="gm-picked" data-pk="${i}"></div></td>
          ${levels.map((l,j)=>`<td class="gm-cell ${tn(l)} ${sel[i]===j?'on':''}" data-i="${i}" data-j="${j}" title="${esc(l.label)} · ${fmt2(l.value)}">
            <div class="gm-inner"><span class="gm-lvl">${lvlBars(levels,j)}<span class="gm-short">${esc(lvlShort(levels,j))}</span><span class="gm-name">${esc(l.label)}</span><span class="gm-v">${fmt2(l.value)}</span></span>
            ${(it.cells||[])[j]? `<span class="gm-desc">${esc(it.cells[j])}</span>`:''}</div></td>`).join('')}
          <td class="gm-skip"><button data-i="${i}" data-j="null">sin valorar</button></td>
        </tr>`).join('')}
        </tbody>
      </table></div>
      <p class="sub" id="cellPreview" style="margin-top:10px"></p>
      <button type="button" class="btn ghost small" data-kid>🧒 Que lo rellene el alumno</button>${mkBlock}`;

    const wrap = withMarks(openModal(inner, ()=>{ c.grades[key] = sel; }, 'Guardar', {xl:true}));
    wrap.querySelector('[data-kid]').addEventListener('click', e=>{ e.preventDefault(); wrap.style.display='none';
      studentMode(task.name, s.name, ins, sel, ()=>{ wrap.style.display=''; wrap.querySelectorAll('.gm-cell').forEach(x=>x.classList.toggle('on', sel[Number(x.dataset.i)]===Number(x.dataset.j))); upd(); }); });
    const upd = ()=>{
      let a=0, w=0;
      items.forEach((it,i)=>{ const j=sel[i]; if(j!=null && levels[j]){ const wi=Number(it.weight)||1; a+=levels[j].value*wi; w+=wi; } });
      const v = w? a/w : null;
      const adj = isAdjTask(c, studentId, taskId);
      const done = sel.filter(x=>x!=null).length;
      const sc = wrap.querySelector('#gmScore');
      sc.className = 'gm-score' + (v==null ? '' : ' tn'+toneOf(v));
      sc.innerHTML = '<b>'+fmt2(v)+'</b>' + (v==null ? '<small>sin valorar</small>' : pill(v, c.scale));
      wrap.querySelector('#gmDots').innerHTML = items.map((it,i)=>`<i class="${sel[i]!=null && levels[sel[i]] ? tn(levels[sel[i]]) : ''}" title="${esc(it.name||'Ítem '+(i+1))}"></i>`).join('');
      wrap.querySelector('#gmLeft').textContent = done+' de '+items.length;
      wrap.querySelector('[data-compact]').textContent = state.rubCompact ? 'Ver descriptores' : 'Solo grados';
      wrap.querySelectorAll('tr[data-row]').forEach(tr=>{
        const i = Number(tr.dataset.row), j = sel[i];
        tr.classList.toggle('has-sel', j!=null);
        tr.querySelector('.gm-picked').textContent = (j!=null && levels[j]) ? levels[j].label + (((items[i].cells||[])[j]) ? ' · '+items[i].cells[j] : '') : '';
      });
      wrap.querySelector('#cellPreview').innerHTML =
        (adj? '<span class="count mid">ajustada a mano a '+fmt2(num(c.overrides[key]))+'</span>'
                +' <button class="btn ghost small" data-drop style="margin-left:6px">quitar ajuste</button>' : '');
    };
    wrap.addEventListener('click', e=>{
      if(e.target.hasAttribute('data-drop')){ delete c.overrides[key]; upd(); save(); render(); return; }
      if(e.target.hasAttribute('data-compact')){ e.preventDefault(); state.rubCompact = !state.rubCompact;
        wrap.querySelector('.grade-matrix').classList.toggle('compact', !!state.rubCompact); upd(); save(); return; }
      const b = e.target.closest('[data-j]');
      if(!b) return;
      e.preventDefault();
      const i = Number(b.dataset.i);
      const j = b.dataset.j==='null' ? null : Number(b.dataset.j);
      sel[i] = (sel[i]===j) ? null : j;   // volver a tocar la misma celda la deselecciona
      wrap.querySelectorAll('.gm-cell[data-i="'+i+'"]').forEach(x=>{
        x.classList.toggle('on', Number(x.dataset.j)===sel[i]);
      });
      upd();
    });
    upd();
    return;
  }

  const sel2 = sel;   // (scale usa el modo compacto de siempre)
  const compact = true;
  let inner = `<h3>${esc(task.name)}${adTag}</h3><p class="sub">${esc(s.name)} · ${TYPE_NAMES[ins.type]}${adaptedHere?' · criterios de '+CYCLE_NAMES[effCycle(c,task,studentId)]:''}</p>`;
  inner += items.map((it,i)=>`<div class="grade-item">
      <div class="grade-item-head">
        <strong>${esc(it.name||'Ítem '+(i+1))}</strong>
        ${itemCrits(it).map(k=>`<span class="chip on">${esc(k)}</span>`).join('')}
        <span class="tag grey">${itemPct(ins,i)}%</span>
      </div>
      <div class="crit-chips">${levels.map((l,j)=>`<button class="lvl-btn ${tn(l)} ${sel[i]===j?'on':''}" data-i="${i}" data-j="${j}">${esc(l.label)}</button>`).join('')}
             <button class="lvl-btn ${sel[i]==null?'on':''}" data-i="${i}" data-j="null">–</button></div>
    </div>`).join('');
  inner += `<div id="dianaBox"></div><p class="sub" id="cellPreview" style="margin-top:6px"></p>
    <button type="button" class="btn ghost small" data-kid>🧒 Que lo rellene el alumno</button>` + mkBlock;

  const wrap = withMarks(openModal(inner, ()=>{ c.grades[key] = sel; }));
  const dianaUpd = ()=>{ const b = wrap.querySelector('#dianaBox'); if(b) b.innerHTML = ins.diana ? dianaSvg(ins, sel, 260) : ''; };
  wrap.addEventListener('click', ()=>setTimeout(dianaUpd, 0));
  wrap.querySelector('[data-kid]').addEventListener('click', e=>{ e.preventDefault(); wrap.style.display='none';
    studentMode(task.name, s.name, ins, sel, ()=>{ wrap.style.display='';
      wrap.querySelectorAll('[data-i][data-j]').forEach(x=>{ const i=Number(x.dataset.i); x.classList.toggle('on', (x.dataset.j==='null' && sel[i]==null) || Number(x.dataset.j)===sel[i]); });
      upd(); dianaUpd(); }); });
  setTimeout(dianaUpd, 0);
  const upd = ()=>{
    let a=0, w=0;
    items.forEach((it,i)=>{ const j=sel[i]; if(j!=null && levels[j]){ const wi=Number(it.weight)||1; a+=levels[j].value*wi; w+=wi; } });
    const v = w? a/w : null;
    const adj = isAdjTask(c, studentId, taskId);
    wrap.querySelector('#cellPreview').innerHTML = (v==null ? 'Sin valorar'
      : 'Nota de la tarea: <b>'+fmt2(v)+'</b> '+pill(v, c.scale))
      + (adj? ' <span class="count mid" style="margin-left:6px">ajustada a mano a '+fmt2(num(c.overrides[key]))+'</span>'
              +' <button class="btn ghost small" data-drop style="margin-left:6px">quitar ajuste</button>' : '');
  };
  wrap.addEventListener('click', e=>{
    if(e.target.hasAttribute('data-drop')){ delete c.overrides[key]; upd(); save(); render(); }
  });
  wrap.addEventListener('click', e=>{
    const b = e.target.closest('[data-j]');
    if(!b) return;
    e.preventDefault();
    const i = Number(b.dataset.i);
    sel[i] = b.dataset.j==='null' ? null : Number(b.dataset.j);
    wrap.querySelectorAll('[data-i="'+i+'"][data-j]').forEach(x=>{
      const on = (x.dataset.j==='null' && sel[i]==null) || Number(x.dataset.j)===sel[i];
      x.classList.toggle('on', on);
      if(x.classList.contains('level-opt')) x.setAttribute('aria-pressed', on);
    });
    upd();
  });
  upd();
}

/* ---------- alta y edición de tareas ---------- */
/* Selector visual: elige día + franja pinchando en una mini-semana.
   Llama onPick({d, t}) por cada casilla elegida. Marca en verde las ya elegidas. */
function pickSlotModal(startIso, chosen, onPick){
  let wkIso = weekStart(startIso || today());
  const slots = classSlots();
  const has = (d,t)=> (chosen||[]).some(e=>e.d===d && e.t===t);

  const grid = ()=>{
    const days = weekDays(wkIso).slice(0,5);
    return `<div class="pick-head">
        <button class="pd-arrow" data-pk="prev" title="Semana anterior">‹</button>
        <strong class="pick-title">${fmtDate(days[0])} – ${fmtDate(days[4])}</strong>
        <button class="pd-arrow" data-pk="next" title="Semana siguiente">›</button>
      </div>
      <table class="pick-wk"><thead><tr><th></th>
        ${days.map(iso=>`<th>${DAY_NAMES[dowMon(iso)].slice(0,3)}<small>${parseDate(iso).getDate()}</small></th>`).join('')}
      </tr></thead><tbody>
      ${state.schedule.map(sl=>{
        if(sl.kind==='break') return `<tr class="pick-brk"><td colspan="6">${sl.from}–${sl.to} · ${esc(sl.label||'Recreo')}</td></tr>`;
        return `<tr><td class="pick-time">${sl.from}<small>${sl.to}</small></td>
          ${days.map(iso=>{
            const s = state.sessions[skey(iso, sl.id)];
            const on = has(iso, sl.from);
            const col = s? sessionColor(s):'';
            return `<td class="pick-cell ${on?'on':''}" data-pk="cell" data-d="${iso}" data-t="${sl.from}" title="${fmtDate(iso)} · ${sl.from}">
              ${s? `<span class="pick-ses" style="color:${col}">${esc((s.title||courseName(s.courseId)||'').slice(0,14))}</span>`:''}
              ${on?'<span class="pick-tick">✓</span>':''}
            </td>`;
          }).join('')}
        </tr>`;
      }).join('')}
      </tbody></table>
      <p class="sub" style="margin:10px 0 0">Toca la casilla del día y la hora. Vuelve a tocarla para quitarla. Se ve tu horario de fondo como guía.</p>`;
  };

  const wrap = openModal(`<h3>Colocar en el horario</h3>
    <p class="sub">Elige el día y la franja; la tarea se pondrá a esa hora.</p>
    <div id="pickBody">${grid()}</div>`, ()=>{}, 'Hecho', {wide:true});

  const redraw = ()=>{ wrap.querySelector('#pickBody').innerHTML = grid(); };
  wrap.addEventListener('click', e=>{
    const b = e.target.closest('[data-pk]');
    if(!b) return;
    e.preventDefault();
    if(b.dataset.pk==='prev'){ wkIso = addDays(wkIso,-7); redraw(); return; }
    if(b.dataset.pk==='next'){ wkIso = addDays(wkIso,7); redraw(); return; }
    if(b.dataset.pk==='cell'){ onPick({d:b.dataset.d, t:b.dataset.t}); redraw(); return; }
  });
  return wrap;
}

/* =====================================================================
   PÁGINA DE TAREA: crear y editar una tarea evaluable
   Es una vista propia (no una ventana superpuesta) y es la misma se abra
   desde la unidad, desde la agenda, desde una sesión o desde la evaluación inicial.
   El borrador vive en state.taskEd y no toca la clase hasta pulsar Guardar.
   ===================================================================== */
const TE_TYPES = [
  ['rubric','Rúbrica','Ítems con un descriptor en cada grado'],
  ['scale','Escala','Ítems valorados con un número'],
  ['check','Lista de cotejo','Conseguido o no conseguido'],
  ['num','Nota directa','Una sola nota, sin ítems'],
  ['points','Notas por apartado','Una nota directa por criterio o parte del examen'],
  ['faces','Caritas','😊 😐 ☹️ para observar']
];
const TE_KINDS = [
  ['counts','Cuenta para la nota','Entra en la nota de la unidad y en la de la evaluación.'],
  ['initial','Evaluación inicial','Diagnóstico: se ve la nota, pero no cuenta.'],
  ['info','Solo informativa','Se ve en el cuaderno y en los informes, pero no cuenta.']
];
const SKILL_SHORT = {speaking:'Speaking', writing:'Writing', reading:'Reading', listening:'Listening', mediation:'Mediation'};
function teSortDates(a){ a.sort((x,y)=> x.d===y.d ? (x.t||'').localeCompare(y.t||'') : x.d.localeCompare(y.d)); }
/* o = {task, cid} para editar · {cid, aid, pid, unitId, dates, fromAgenda} para crear */
function openTaskPage(o){
  o = o || {};
  if(!state.courses.length){ alertBox('Crea primero una clase para poder añadirle tareas evaluables.'); return; }
  const back = {view:state.view, homeTab:state.homeTab, unit:state.activeUnit, editor:state.editor,

    const c = state.courses.find(x=>x.id===o.cid) || course() || state.courses[0];

function teError(msg, focusSel){
  state.taskEd.err = msg; render(); window.scrollTo(0,0);

}
function teSave(go){
  const d = state.taskEd, c = teCourse(); if(!d || !c) return;
  const name = (d.name||'').trim();
  if(!name) return teError('Ponle un nombre a la tarea.', '#teName');
  const ini = isInitialP(c, d.pid);
  let unitId = ini ? '' : d.unitId;
  if(!ini && unitId==='__new'){
    const un = (d.newUnit||'').trim();
    if(!un) return teError('Escribe el nombre de la nueva unidad.', '[data-te="newUnit"]');
    const nu = {id:uid(), areaId:d.aid, periodId:d.pid, name:un, desc:''};
    if(!c.units) c.units = [];
    c.units.push(nu); unitId = nu.id;
  }
  const isInitial = ini || d.kind==='initial', informative = !ini && d.kind==='info';
  const weight = (isInitial || informative) ? 0 : Math.max(0, Number(d.weight)||0);
  const crit = d.criteria.slice();
  const dates = d.dates.slice(); teSortDates(dates);
  let task;
  if(d.id){
    task = c.tasks.find(x=>x.id===d.id);
    Object.assign(task, {name:name, desc:d.desc.trim(), goals:d.goals.trim(), activities:d.activities.trim(), criteria:crit,
      weight:weight, isInitial:isInitial, informative:informative, unitId:unitId});
    if(d.aid==='ing') task.skill = d.skill||'';
    setTaskDates(task, dates);
    ((task.instr||{}).items||[]).forEach(it=>{ it.crits = itemCrits(it).filter(k=>crit.indexOf(k)>-1); delete it.critCode; });
  } else {
    const tpl = d.tpl ? (state.templates||[]).find(x=>x.id===d.tpl) : null;
    const instr = tpl ? cloneInstr(tpl) : blankInstr(d.type);
    if(!tpl && instr.type==='points' && crit.length){ instr.items = crit.slice().sort(cmpCode).map(k=>mkItem('Criterio '+k, [k])); instr.auto = true; }
    task = {id:uid(), areaId:d.aid, periodId:d.pid, unitId:unitId, name:name, skill:d.aid==='ing'?(d.skill||''):'',
      desc:d.desc.trim(), goals:d.goals.trim(), activities:d.activities.trim(), criteria:crit, weight:weight,
      isInitial:isInitial, informative:informative, instr:instr, adaptations:{}, dates:dates};
    c.tasks.push(task);
  }
  const b = d.back || {}, type = (task.instr||{}).type;
  const toInstr = go==='instr' || (!d.id && type!=='num' && type!=='faces' && !(task.instr||{}).auto);
  if(task.instr) delete task.instr.auto;
  state.taskEd = null;
  state.activeCourse = c.id; state.activeArea = task.areaId; state.activePeriod = task.periodId;
  if(toInstr){ state.editor = {mode:'task', id:task.id}; state.view = 'editorInstr'; }
  else if(d.fromAgenda){ state.view = 'clases'; state.homeTab = 'agenda'; if(!d.id && taskDates(task)[0]) state.planDate = taskDates(task)[0]; }
  else if(d.id && b.view==='editorInstr'){ state.editor = b.editor; state.view = 'editorInstr'; }
  else if(isInitialP(c, task.periodId) || !unitId){ state.view = 'unidades'; state.activeUnit = null; }
  else { state.view = 'unidad'; state.activeUnit = unitId; state.unitSub = 'tareas'; }
  rememberSel(); save(); render(); window.scrollTo(0,0);
}

/* ---------- adaptar una tarea para un alumno concreto (opción A) ---------- */
function adaptModal(taskId){
  const c = course(), aid = areaId();
  const task = taskById(c, taskId);
  if(!task) return;
  if(!task.adaptations) task.adaptations = {};
  // alumnos con medida de criterios adaptados en esta área
  const cand = c.students.filter(s=>{ const d=c.diversity[dvkey(s.id,aid)]; return d && d.med && medDef(d.med).cri; });
  // alumnos con medida que NO cambia criterios (ACNS, ACC, apoyo…): no adaptan la evaluación
  const nonSig = c.students.filter(s=>{ const d=c.diversity[dvkey(s.id,aid)]; return d && d.med && !medDef(d.med).cri; });
  const nonSigNote = nonSig.length
    ? `<div class="card" style="border-left:3px solid var(--rule);margin-top:10px;padding:8px 10px"><p class="hint" style="margin:0">${nonSig.map(s=>esc(s.name.split(',')[0])+' ('+medDef(c.diversity[dvkey(s.id,aid)].med).code+')').join(', ')} ${nonSig.length>1?'llevan':'lleva'} una medida <b>no significativa</b>: se ${nonSig.length>1?'evalúan':'evalúa'} con los criterios del curso, por eso no ${nonSig.length>1?'aparecen':'aparece'} aquí.</p></div>`
    : '';
  if(!cand.length){
    openModal(`<h3>Adaptar «${esc(task.name)}»</h3>
      <p class="sub">Ningún alumno de esta clase tiene una medida con criterios adaptados (ACS o ACA) en ${esc(areaDef(aid).name)}. Márcala primero en su ficha, dentro de Diversidad.</p>
      ${nonSigNote}`, null, null);
    return;
  }
  let curSid = cand[0].id;
  const draw = ()=>{
    const d = c.diversity[dvkey(curSid,aid)] || {}; const med = d.med? medDef(d.med) : {code:'',name:''};
    const a = task.adaptations[curSid] || null;
    const refCycle = a && a.refCycle ? a.refCycle : c.cycle;
    const crits = a && a.criteria ? a.criteria : [];
    const critMap = areaDef(aid).crit[refCycle] || {};
    const list = critList(aid, refCycle);
    return `
      <div class="seg-toggle" id="stuPick" style="flex-wrap:wrap">
        ${cand.map(s=>{ const dd=c.diversity[dvkey(s.id,aid)]; const mc=dd&&dd.med?medDef(dd.med).code:''; return `<button data-sid="${s.id}" aria-pressed="${s.id===curSid}">${esc(s.name.split(',')[0])} <span style="font-size:10px">${mc}</span></button>`; }).join('')}
      </div>
      <p class="sub" style="margin-top:10px">${esc((c.students.find(s=>s.id===curSid)||{}).name)} · ${med.code} · ${esc(med.name)}</p>
      ${a? `<div class="row"><span class="tag warn">Tiene adaptación en esta tarea</span><div class="spacer"></div><button class="btn ghost small" data-clearad>Quitar adaptación</button></div>`
         : `<p class="sub">Sin adaptación en esta tarea: se le evalúa como al resto. Define abajo su versión para adaptarla.</p>`}
      <label class="field" style="margin-top:10px"><span>Ciclo de referencia</span></label>
      <div class="seg-toggle" id="adCyc">
        ${[1,2,3].map(cy=>`<button data-cyc="${cy}" aria-pressed="${refCycle===cy}">${CYCLE_NAMES[cy].replace(/ \(.*/,'')}</button>`).join('')}
      </div>
      <label class="field" style="margin-top:12px"><span>Criterios adaptados</span></label>
      <div class="crit-chips" id="adCrits">
        ${list.length? list.map(k=>`<button class="chip ${crits.indexOf(k.code)>-1?'on':''}" data-adcode="${k.code}" title="${esc(k.text)}">${k.code}</button>`).join('')
          : '<span class="chip">no hay criterios de ese ciclo</span>'}
      </div>
      <p class="sub" style="margin-top:12px">Instrumento: <b>${a && a.instr? TYPE_NAMES[a.instr.type] : 'usa el común de la tarea'}</b>.
        <button class="btn ghost small" data-editadinstr style="margin-left:6px">${a && a.instr? 'Editar su rúbrica':'Crear rúbrica propia'}</button>
        ${a && a.instr? '<button class="btn ghost small" data-delinstr>Usar el común</button>':''}</p>`;
  };

  const wrap = openModal(`<h3>Adaptar «${esc(task.name)}»</h3>
    <p class="sub">${esc(areaDef(aid).name)}. Cada alumno puede tener sus propios criterios y rúbrica; la tarea sigue siendo una sola columna.</p>
    <div id="adBody">${draw()}</div>
    ${nonSigNote}`, ()=>{}, 'Hecho', {wide:true});

  const refresh = ()=>{ wrap.querySelector('#adBody').innerHTML = draw(); };
  const ensure = ()=>{ if(!task.adaptations[curSid]) task.adaptations[curSid] = {refCycle:c.cycle, criteria:[], instr:null}; return task.adaptations[curSid]; };

  wrap.addEventListener('click', e=>{
    const sp = e.target.closest('[data-sid]');
    if(sp){ e.preventDefault(); curSid = sp.dataset.sid; refresh(); return; }
    const cy = e.target.closest('[data-cyc]');
    if(cy){ e.preventDefault(); const a=ensure(); a.refCycle=Number(cy.dataset.cyc); a.criteria=[]; save(); refresh(); return; }
    const cc = e.target.closest('[data-adcode]');
    if(cc){ e.preventDefault(); const a=ensure(); const code=cc.dataset.adcode; const i=(a.criteria||[]).indexOf(code);
      if(i>-1) a.criteria.splice(i,1); else (a.criteria=a.criteria||[]).push(code);
      cc.classList.toggle('on', i===-1); save(); return; }
    if(e.target.hasAttribute('data-clearad')){ e.preventDefault(); delete task.adaptations[curSid]; save(); refresh(); return; }
    if(e.target.hasAttribute('data-delinstr')){ e.preventDefault(); const a=ensure(); a.instr=null; save(); refresh(); return; }
    if(e.target.hasAttribute('data-editadinstr')){ e.preventDefault();
      const a=ensure();
      if(!a.instr){ a.instr = cloneInstr(task.instr); }   // parte del instrumento común como base
      // abrir el editor de instrumento apuntando a esta adaptación
      state.editor = {mode:'adapt', taskId:task.id, sid:curSid};
      state.view='editorInstr';
      close_(); save(); render();
      return;
    }
  });
  function close_(){ wrap.remove(); }
}

function levelLabelOf(ins, i, raw){
  if(ins.type==='points') return Array.isArray(raw) && num(raw[i])!=null ? fmt2(num(raw[i]))+' / '+(ins.max||10) : '–';
  if(ins.type==='check') return Array.isArray(raw) ? (raw[i]?'Conseguido':'No conseguido') : '–';
  if(!Array.isArray(raw)) return '–';
  const j = raw[i];
  return (j!=null && ins.levels[j]) ? ((levelFace(ins.levels[j])?levelFace(ins.levels[j])+' ':'')+ins.levels[j].label) : '–';
}

function reportFor(c, s, aid, pid, opt){
  const p = c.periods.find(x=>x.id===pid);
  const list = studentTasks(c, s.id, aid, pid);
  const f = areaFinal(c, s.id, aid, pid);
  const k = calif(f, c.scale);
  const idx = c.students.findIndex(x=>x.id===s.id)+1;

  let h = `<div class="rep">
    <div class="rhead">
      <div>
        <h1>${esc(s.name)}</h1>
        <p class="meta">Nº ${String(idx).padStart(2,'0')} · ${esc(c.name)} · ${esc(c.level||'')} de Primaria · ${CYCLE_NAMES[c.cycle]}</p>
        <p class="meta">${esc(areaDef(aid).name)} · ${esc(p?p.name:'')}</p>

      <div class="grade">
        <span class="n">${fmt(f)}</span>
        <span class="k">${k?esc(k.name):'sin calificar'}</span>
        ${(function(){ const dv=c.diversity[dvkey(s.id,aid)]; const m=dv&&dv.med?medDef(dv.med):null;

      </div>

  h += `<h2>Tareas evaluadas</h2>
    <table><thead><tr><th>Tarea</th><th>Instrumento</th><th class="r">Peso</th><th class="r">Nota</th></tr></thead><tbody>
    ${list.map(t=>{
      const v = taskFinal(c, t, s.id);
      const adj = isAdjTask(c, s.id, t.id);
      const insR = effInstr(c, t, s.id) || {};
      const fc = insR.type==='faces' ? faceOf(insR, c.grades[gkey(s.id, t.id)], v) : '';
      const mn = marksNames(c, s.id, t.id), cmR = commentOf(c, s.id, t.id);
      return `<tr><td>${esc(t.name)}${t.desc?`<br><span class="sub">${esc(t.desc)}</span>`:''}${mn?`<br><span class="sub">${esc(mn)}</span>`:''}${cmR?`<br><i>${esc(cmR)}</i>`:''}</td>
        <td>${TYPE_NAMES[(t.instr||{}).type]||''}</td>
        <td class="r">${t.informative?'<span class="sub">informativa</span>':(Number(t.weight)||0)+'%'}</td>
        <td class="r"><b>${v==null?'–':(fc?fc+' ':'')+(t.informative&&fc?'':fmt2(v))}</b>${adj?' <span class="sub">(ajustada)</span>':''}</td></tr>`;
    }).join('')}
    <tr class="tot"><td colspan="3">Nota final ponderada${isAdjFinal(c,s.id,aid,pid)?' (ajustada)':''}</td><td class="r">${fmt(f)}</td></tr>
    </tbody></table>`;

  if(opt.ini && hasStartPoint(c, s.id, aid)){
    const im = initMean(c, s.id, aid), io = initObs(c, s.id, aid);
    const pr = (p && !p.initial) ? progressText(c, s.id, aid, pid) : '';
    h += `<h2>Punto de partida y progreso</h2>
      <table><tbody>
        <tr><td style="width:34%"><b>Evaluación inicial</b>${im!=null?`<br><span class="sub">Nota orientativa: ${fmt2(im)}</span>`:''}</td><td>${io?esc(io):'–'}</td></tr>
        ${(p && !p.initial) ? `<tr><td><b>Progreso en ${esc(p.name)}</b></td><td>${pr?esc(pr):'–'}</td></tr>`:''}
      </tbody></table>`;
  }

  if(opt.crits){
    const scR = studentCycle(c, s.id, aid);
    const critMapSc = areaDef(aid).crit[scR] || {};
    const critMapBase = areaDef(aid).crit[c.cycle] || {};
    const codes = critsWorked(c, aid, pid, s.id);
    const crits = codes.map(code=>({code:code, text: critMapSc[code]||critMapBase[code]||''}));
    if(crits.length){
      h += `<h2>Logro por criterio de evaluación</h2>
        <table class="crits"><tbody>
        ${crits.map(x=>{
          const v = critScore(c, s.id, aid, pid, x.code);
          const kk = calif(v, c.scale);
          return `<tr><td class="code">${esc(x.code)}</td><td>${esc(x.text)}</td>
            <td class="r"><b>${v==null?'–':fmt2(v)}</b><br><span class="sub">${kk?esc(kk.code):''}</span></td></tr>`;
        }).join('')}
        </tbody></table>`;
    }
  }

  if(opt.rub){
    const withItems = list.filter(t=>{ const ins=effInstr(c,t,s.id); return ins && ins.type!=='num' && (ins.items||[]).length; });
    if(withItems.length){
      h += `<h2>Detalle de los instrumentos</h2>`;
      withItems.forEach(t=>{
        const ins = effInstr(c, t, s.id);
        const raw = c.grades[gkey(s.id, t.id)];
        h += `<h3>${esc(t.name)}${isAdaptedFor(c,t,s.id)?' (adaptada)':''}</h3>
          <table class="items"><tbody>
          ${(ins.items||[]).map((it,i)=>{
            const v = itemValue(ins, i, raw);
            return `<tr><td>${esc(it.name||('Ítem '+(i+1)))}${itemCrits(it).length?` <span class="sub">${itemCrits(it).join(' · ')}</span>`:''}</td>
              <td class="lv">${esc(levelLabelOf(ins, i, raw))}</td>
              <td class="r">${v==null?'–':fmt2(v)}</td></tr>`;
          }).join('')}
          </tbody></table>`;
      });
    }
  }

  if(opt.att){
    const cnt={P:0,A:0,R:0,J:0};
    Object.keys(c.attendance||{}).forEach(d=>{ const k2=c.attendance[d][s.id]; if(k2) cnt[k2]++; });
    h += `<h2>Asistencia registrada en el curso</h2>
      <p>${cnt.P} sesiones presente · ${cnt.A} faltas · ${cnt.R} retrasos · ${cnt.J} faltas justificadas.</p>`;
  }

  if(opt.tut){
    const tl = tutoriasOf(c, s.id);
    h += `<h2>Tutorías con la familia</h2>`;
    h += tl.length ? tl.map(t=>`<div class="tut">
        <p class="date">${fmtDate(t.date)}${t.time?' · '+esc(t.time):''} · ${esc(t.mode||'')}</p>
        <p><b>Asistentes:</b> ${esc(t.family||'–')} / ${esc(t.staff||'–')}</p>
        ${t.topics?`<p><b>Temas:</b> ${esc(t.topics)}</p>`:''}
        ${t.agreements?`<p><b>Acuerdos:</b> ${esc(t.agreements)}</p>`:''}
      </div>`).join('') : '<p>Sin tutorías registradas.</p>';
  }

  if(opt.obs){
    h += `<h2>Observaciones</h2><div class="lines"></div>
      <p class="sign">Firma del maestro/a &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; Firma de la familia</p>`;
  }

  h += `<div class="rfoot">Documento generado el ${fmtDate(today())} · uso interno del profesorado</div></div>`;
  return h;
}

function taskClassMean(c, t){
  const vs = c.students.map(s=>taskFinal(c, t, s.id)).filter(v=>v!=null);
  return vs.length ? vs.reduce((a,b)=>a+b,0)/vs.length : null;
}
function areaClassMean(c, aid, pid){
  const vs = c.students.map(s=>areaFinal(c, s.id, aid, pid)).filter(v=>v!=null);
  return vs.length ? vs.reduce((a,b)=>a+b,0)/vs.length : null;
}
function tutSheet(c, s, opt){
  const reals = c.periods.filter(p=>!p.initial);
  const ex = extAreas(c);
  const hasAny = p=>c.students.some(st=>c.areas.some(a=>areaFinal(c, st.id, a, p.id)!=null) || ex.some(e=>extGet(c, st.id, e.id, p.id)));
  let lastIdx = -1; reals.forEach((p,i)=>{ if(hasAny(p)) lastIdx = i; });
  const sel = opt.pid==='all' ? null : reals.find(p=>p.id===opt.pid);
  const cmpP = sel || reals[Math.max(0,lastIdx)] || reals[0];
  const cols = reals.slice(0, Math.max(lastIdx, sel?reals.indexOf(sel):0, 0)+1);
  const scope = sel ? [sel] : cols;
  const idx = c.students.findIndex(x=>x.id===s.id)+1;
  const q = v=>{ const k = calif(v, c.scale); return k ? `<span class="ts-q">${k.code}</span>` : ''; };

  /* ---- notas por área ---- */
  const ownRow = a=>{
    const dvA = c.diversity[dvkey(s.id, a)], mA = dvA && dvA.med ? medDef(dvA.med) : null;
    return `<tr><td><i class="ts-dot" style="background:${areaColor(a)}"></i>${esc(areaDef(a).name)}${mA&&mA.sig?`<span class="ts-tag" title="${esc(mA.name)}">${esc(mA.code)}</span>`:''}</td>
      ${cols.map(p=>{ const x = areaFinal(c, s.id, a, p.id); return `<td class="r ${p===cmpP?'cur':''}">${x==null?'–':`<b class="${x<c.pass?'ts-low':''}">${fmt(x)}</b>${q(x)}`}</td>`; }).join('')}</tr>`;
  };
  const extRow = e=>{
    const mE = extMed(c, s.id, e.id);
    return `<tr><td><i class="ts-dot" style="background:${subjColor(e.name)}"></i>${esc(e.name)}${mE&&mE.sig?`<span class="ts-tag" title="${esc(mE.name)}">${esc(mE.code)}</span>`:''}${e.teacher?` <span class="sub">${esc(e.teacher)}</span>`:''}</td>
      ${cols.map(p=>{ const x = extGet(c, s.id, e.id, p.id); return `<td class="r ${p===cmpP?'cur':''}">${!x?'–':(x.isNum?`<b class="${x.v<c.pass?'ts-low':''}">${fmt(x.v)}</b>${q(x.v)}`:`<b class="${x.v<c.pass?'ts-low':''}">${x.code}</b>`)}</td>`; }).join('')}</tr>`;
  };
  let h = `<div class="rep ts">
    <div class="rhead"><div>
      <h1>${esc(s.name)}</h1>
      <p class="meta">Nº ${String(idx).padStart(2,'0')} · ${esc(c.name)} · ${esc(c.level||'')} de Primaria</p>
      <p class="meta">Ficha para tutoría · ${sel?esc(sel.name):'todo el curso'} · ${fmtDate(today())}</p></div></div>
    <h2>Notas por área</h2>
    <table class="ts-grades"><thead><tr><th>Área</th>${cols.map(p=>`<th class="r">${esc(p.name)}</th>`).join('')}</tr></thead>
      <tbody>${c.areas.map(ownRow).join('')}${ex.map(extRow).join('')}</tbody></table>
    <p class="ts-legend">${c.scale.map(k=>k.code+' '+k.name).join(' · ')}</p>`;

  /* ---- tareas y pruebas por unidad ---- */
  let det = '';
  c.areas.forEach(a=>{
    let block = '';
    scope.forEach(p=>{
      const tasks = tasksOf(c, a, p.id);
      if(!tasks.length) return;
      const f = areaFinal(c, s.id, a, p.id), k = calif(f, c.scale);
      const groups = unitsOf(c, a, p.id).map(u=>({u:u, ts:tasks.filter(t=>t.unitId===u.id)})).filter(g=>g.ts.length);
      const loose = tasks.filter(t=>!unitById(c, t.unitId));
      if(loose.length) groups.push({u:null, ts:loose});
      const row = t=>{
        const v = taskFinal(c, t, s.id), ins = effInstr(c, t, s.id)||{};
        const face = ins.type==='faces' ? faceOf(ins, c.grades[gkey(s.id, t.id)], v) : '';
        const d = taskDates(t)[0], cm = opt.cmt ? commentOf(c, s.id, t.id) : '';
        return `<tr><td>${esc(t.name)}${t.isInitial?'<span class="ts-tag">inicial</span>':''}${t.informative?'<span class="ts-tag">informativa</span>':''}${cm?`<div class="ts-note">${esc(cm)}</div>`:''}</td>
          <td class="r sub">${d?fmtDate(d).slice(0,5):''}</td>
          <td class="r">${v==null?'–':(face?face+' ':'')+(face&&t.informative?'':`<b class="${v<c.pass&&!t.informative&&!t.isInitial?'ts-low':''}">${fmt2(v)}</b>`)}${v!=null&&!t.informative&&!t.isInitial&&!face?q(v):''}</td></tr>`;
      };
      block += `${sel?'':`<h3 class="ts-per">${esc(p.name)}</h3>`}
        <table class="ts-tasks"><thead><tr><th>Tarea o prueba</th><th class="r">Fecha</th><th class="r">Nota</th></tr></thead><tbody>
        ${groups.map(g=>{ const um = g.u ? unitScore(c, s.id, g.u.id) : null;
          return `<tr class="ts-unit"><td colspan="2">${g.u?esc(g.u.name):'Otras tareas'}</td><td class="r">${um==null?'':fmt2(um)}</td></tr>`+g.ts.map(row).join(''); }).join('')}
        <tr class="tot"><td colspan="2">Nota de ${esc(p.name)}</td><td class="r">${fmt(f)}${k?' · '+esc(k.name):''}</td></tr>
        </tbody></table>`;
    });
    if(block) det += `<div class="ts-area"><i class="ts-dot" style="background:${areaColor(a)}"></i>${esc(areaDef(a).name)}</div>${block}`;
  });
  if(det) h += `<h2>Tareas y pruebas por unidad</h2>${det}`;

  /* ---- punto de partida ---- */
  if(opt.ini){
    const rows = c.areas.filter(a=>hasStartPoint(c, s.id, a)).map(a=>{
      const im = initMean(c, s.id, a), io = initObs(c, s.id, a), pr = sel ? progressText(c, s.id, a, sel.id) : '';
      return `<tr><td style="width:26%"><b>${esc(areaDef(a).short||areaDef(a).name)}</b>${im!=null?`<br><span class="sub">Prueba inicial: ${fmt2(im)}</span>`:''}</td>
        <td>${io?esc(io):'–'}${pr?`<div class="ts-note"><b>Progreso:</b> ${esc(pr)}</div>`:''}</td></tr>`; });
    if(rows.length) h += `<h2>Punto de partida y progreso</h2><table><tbody>${rows.join('')}</tbody></table>`;
  }

  /* ---- asistencia y tutorías anteriores ---- */
  const cnt = {P:0,A:0,R:0,J:0};
  Object.keys(c.attendance||{}).forEach(d=>{ const k2 = c.attendance[d][s.id]; if(k2 && cnt[k2]!=null) cnt[k2]++; });
  if(cnt.P+cnt.A+cnt.R+cnt.J) h += `<h2>Asistencia</h2><p>${cnt.A} falta(s) sin justificar · ${cnt.J} justificada(s) · ${cnt.R} retraso(s), de ${cnt.P+cnt.A+cnt.R+cnt.J} sesiones registradas.</p>`;
  if(opt.prev){
    const tl = tutoriasOf(c, s.id).slice(-2);
    if(tl.length) h += `<h2>Tutorías anteriores</h2>` + tl.map(t=>`<div class="tut"><p class="date">${fmtDate(t.date)}${t.mode?' · '+esc(t.mode):''}</p>
      ${t.agreements?`<p><b>Acuerdos:</b> ${esc(t.agreements)}</p>`:(t.topics?`<p>${esc(t.topics)}</p>`:'')}</div>`).join('');
  }
  if(opt.lines) h += `<h2>Acuerdos de esta tutoría</h2><div class="lines"></div><div class="lines" style="height:46px"></div>`;
  h += `<div class="rfoot">Documento generado el ${fmtDate(today())} · ${esc(c.name)}</div></div>`;
  return h;
}

/* El documento se arma con etiquetas construidas, no escritas literalmente:
   así el propio archivo no contiene marcado de documento dentro del script. */
const LT = String.fromCharCode(60), GT = String.fromCharCode(62);
function tagWrap(open, inner, name){ return LT+open+GT+(inner||'')+LT+'/'+name+GT; }
function tagVoid(open){ return LT+open+GT; }

function reportBar(pack){
  /* barra para el archivo descargado: el botón imprime desde el propio documento */
  return tagWrap('div class="rbar"',
      tagWrap('span', esc(pack.n+' informe(s)'), 'span') +
      tagVoid('div class="sp"') + LT+'/div'+GT +
      tagWrap('button onclick="window.print()"', 'Imprimir o guardar en PDF', 'button'),
    'div');
}
function reportHTML(pack){
  return tagVoid('!doctype html') +
    tagWrap('html lang="es"',
      tagWrap('head',
        tagVoid('meta charset="utf-8"') +
        tagVoid('meta name="viewport" content="width=device-width,initial-scale=1"') +
        tagWrap('title', esc(pack.title), 'title') +
        tagWrap('style', pack.css, 'style'), 'head') +
      tagWrap('body style="margin:0;background:#EFF2EF"',
        tagWrap('div id="reportRoot" style="position:static"',
          reportBar(pack) + tagWrap('div class="pages"', pack.body, 'div'), 'div'), 'body'),
    'html');
}

/* El informe se muestra dentro de la propia app: los visores que bloquean
   las ventanas nuevas no lo impiden, y al imprimir solo sale el informe. */
let lastReport = null;
function closeReport(){
  const r = document.getElementById('reportRoot'); if(r) r.remove();
  const st = document.getElementById('reportStyle'); if(st) st.remove();
}
function showReport(pack, name){
  closeReport();
  lastReport = {pack:pack, name:name};
  const st = document.createElement('style');
  st.id = 'reportStyle';
  st.textContent = pack.css;
  document.head.appendChild(st);

  const root = document.createElement('div');
  root.id = 'reportRoot';

  const bar = document.createElement('div');
  bar.className = 'rbar';
  const mk = (label, act, alt)=>{
    const b = document.createElement('button');
    b.textContent = label; b.dataset.act = act; if(alt) b.className = 'alt';
    return b;
  };
  const info = document.createElement('span');
  info.textContent = pack.n + ' informe(s)';
  const sp = document.createElement('div'); sp.className = 'sp';
  bar.appendChild(mk('← Volver','closeReport', true));
  bar.appendChild(info);
  bar.appendChild(sp);
  bar.appendChild(mk('Imprimir o guardar en PDF','printReport'));
  bar.appendChild(mk('Descargar','dlReport', true));
  root.appendChild(bar);

  const pages = document.createElement('div');
  pages.className = 'pages';
  pages.innerHTML = pack.body;
  root.appendChild(pages);

  document.body.appendChild(root);
  root.scrollTop = 0;
}

function alertBox(msg){ openModal('<h3>Aviso</h3><p class="sub" style="margin:0">'+esc(msg)+'</p>', null); }

function applyBackup(data, mode){
  if(mode==='replace'){
    if(data.courses) state.courses = data.courses;
    if(data.templates) state.templates = data.templates;
    if(data.curriculo) state.curriculo = data.curriculo;
    if(Array.isArray(data.schedule) && data.schedule.length) state.schedule = data.schedule;
    if(data.sessions && typeof data.sessions==='object') state.sessions = data.sessions;
    if(data.teacherTT && typeof data.teacherTT==='object') state.teacherTT = data.teacherTT;
    if(data.areaColors && typeof data.areaColors==='object') state.areaColors = data.areaColors;
    if(data.colorBy) state.colorBy = data.colorBy;
    if(Array.isArray(data.markDefs)) state.markDefs = data.markDefs;
    if(Array.isArray(data.upMethods)) state.upMethods = data.upMethods;
    if(data.holidays && typeof data.holidays==='object') state.holidays = data.holidays;
    state.activeCourse = state.courses[0]? state.courses[0].id : null;
    state.activePeriod = null; state.activeArea = null; state.editor = null;
  } else {
    (data.courses||[]).forEach(c=>{
      const dup = state.courses.find(x=>x.id===c.id);
      if(dup){ c = JSON.parse(JSON.stringify(c)); c.id = uid(); c.name = c.name+' (importada)'; }
      state.courses.push(c);
    });
    (data.templates||[]).forEach(t=>{
      if(!state.templates.some(x=>x.name===t.name)) state.templates.push(t);
    });
    if(data.sessions) Object.keys(data.sessions).forEach(k=>{ if(!state.sessions[k]) state.sessions[k] = data.sessions[k]; });
    if(data.teacherTT) Object.keys(data.teacherTT).forEach(k=>{ if(!state.teacherTT[k]) state.teacherTT[k] = data.teacherTT[k]; });
    if(data.curriculo) Object.keys(data.curriculo).forEach(k=>{
      const src = data.curriculo[k];
      if(!state.curriculo[k]){ state.curriculo[k] = src; return; }
      const dst = state.curriculo[k];
      [1,2,3].forEach(cy=>{
        const have = dst.crit && dst.crit[cy] ? Object.keys(dst.crit[cy]).length : 0;
        const inc  = src.crit && src.crit[cy] ? Object.keys(src.crit[cy]).length : 0;
        if(inc > have){ dst.crit = dst.crit||{}; dst.crit[cy] = src.crit[cy]; }
      });
      if(src.ce && (!dst.ce || Object.keys(dst.ce).length < Object.keys(src.ce).length)) dst.ce = src.ce;
    });
  }
  migrate(); normalize(); save(); render();
  const n = (data.courses||[]).length, t = (data.templates||[]).length;
  alertBox('Restaurado: '+n+' clase(s) y '+t+' plantilla(s).');
}

      ${k.note?`<p class="sub" style="margin:2px 0 4px 30px">${esc(k.note)}</p>`:''}
      ${k.subs.map(sb=>`<label class="check-opt dv-sub"><input type="checkbox" data-sub="${k.code}.${sb[0]}" ${conds.indexOf(k.code+'.'+sb[0])>-1?'checked':''}><span>${esc(sb[1])}</span></label>`).join('')}
    </details>`; }).join('');

  const inner = `<h3>Atención a la diversidad</h3>
    <p class="sub">${esc(s.name)} · ${esc(c.name)}</p>

    <div class="dv-sec">
      <h4>Tipología de ACNEAE <small>es del alumno: vale para todas las áreas</small></h4>
      <p class="sub" style="margin:0 0 8px">Categorías del Decreto 188/2017 (mod. 164/2022). Marca la que conste en su informe psicopedagógico o resolución; si no tiene, déjalo en blanco.</p>
      <div id="dvTip">${tipHtml()}</div>
    </div>

    <div class="dv-sec">
      <h4>Actuación en ${esc(aName)} <small>solo esta área</small></h4>
      <div class="m-cols">
        <div class="col-a">
          <label class="field"><span>Actuación de intervención educativa</span>
            <select class="inp" id="medSel">
              <option value="">Sin actuación registrada (currículo del grupo)</option>
              ${medOptions(med)}
            </select></label>
          <p class="sub" id="medDesc"></p>
          <div id="medNote"></div>
          <div id="refBox" style="display:none">
            <label class="field"><span>Ciclo de referencia para evaluarle</span></label>
            <div class="seg-toggle" id="refPick">
              ${[1,2,3].map(cy=>`<button data-ref="${cy}" aria-pressed="${refCycle===cy}">${CYCLE_NAMES[cy].replace(/ \(.*/,'')}</button>`).join('')}
            </div>
            <p class="sub">Las tareas que marques como <b>adaptadas</b> con este ciclo son las que se le evalúan; su nota se consigna con las siglas de la actuación.</p>
          </div>
        </div>
        <div class="col-b">
          ${field('Repercusión en el currículo','note',{type:'textarea', rows:3, value:d.note,
            placeholder:'Qué implica en la práctica: más tiempo, pictogramas, criterios de otro curso, agrupamientos…'})}
          <label class="field" style="margin-top:6px"><span>Medidas individuales aplicadas</span></label>
          <div id="measList"></div>
          <div class="row"><button class="btn ghost small" data-addm>+ Añadir medida individual</button>
            <button class="btn ghost small" data-fromdua>Tomar del catálogo DUA</button></div>
        </div>
      </div>
    </div>

    <div class="dv-sec">
      <h4>Otras actuaciones específicas <small>son del alumno: valen para todas las áreas</small></h4>
      <p class="sub" style="margin:0 0 6px">Artículo 26.2 de la Orden ECD/1005/2018 (mod. 913/2023). La adaptación curricular significativa, la de ampliación, la aceleración parcial y la exención parcial se marcan arriba, área por área.</p>
      <div class="dv-acts">${ACT_STUDENT.map(a=>`<label class="check-opt dv-sub"><input type="checkbox" data-actc="${a[0]}" ${acts.indexOf(a[0])>-1?'checked':''}><span><b>${a[1]})</b> ${esc(a[2])}</span></label>`).join('')}</div>
    </div>

    <div class="dv-sec">
      <h4>Actuaciones en áreas que no das tú <small>solo informativo</small></h4>
      <div class="div-ext-grid">${xList.map((e,i)=>`<label><span class="te-lbl">${esc(e.name)}</span>
        <select class="inp" data-xmed="${i}">
          <option value="">Sin actuación registrada</option>
          ${medOptions(e.cur)}
        </select></label>`).join('')}</div>
    </div>`;

  const wrap = openModal(inner, v=>{
    sd.cond = normConds(conds);
    sd.acts = ACT_STUDENT.map(a=>a[0]).filter(k=>acts.indexOf(k)>-1);
    d.cond = [];
    d.med = med;
    d.refCycle = med && medDef(med).cri ? refCycle : null;
    d.note = v.note||'';
    d.measures = [...wrap.querySelectorAll('.meas-input')].map(i=>i.value.trim()).filter(Boolean);
    if(!c.extDiv || typeof c.extDiv!=='object') c.extDiv = {};
    wrap.querySelectorAll('[data-xmed]').forEach(el=>{
      const e = xList[Number(el.dataset.xmed)];
      if(!e.id && el.value){ if(!Array.isArray(c.extAreas)) c.extAreas = []; const na = {id:uid(), name:e.name, teacher:''}; c.extAreas.push(na); e.id = na.id; }
      if(!e.id) return;

    });

  const refresh = ()=>{
    const m = med? medDef(med) : null;
    wrap.querySelector('#medDesc').textContent = m? m.desc : '';
    wrap.querySelector('#refBox').style.display = (m && m.cri) ? 'block' : 'none';
    const noteBox = wrap.querySelector('#medNote');
    if(m && m.cri){
      const okProfile = medMatchesProfile(med, conds);
      const need = med==='ACA'
        ? 'alumnado con altas capacidades según informe psicopedagógico (art. 28 bis)'
        : 'alumnado con necesidad específica de apoyo educativo que, agotadas las actuaciones generales, necesita un ajuste de al menos dos cursos (art. 28)';
      noteBox.innerHTML = okProfile
        ? `<div class="card" style="border-left:3px solid var(--mark);margin:8px 0 4px;padding:8px 10px">
             <p class="hint" style="margin:0">Esta actuación <b>sí modifica la evaluación</b>: este alumno aparecerá al pulsar «Adaptar» en las tareas, y se le podrá evaluar con criterios de otro ciclo.</p></div>`
        : `<div class="card" style="border-left:3px solid var(--low);margin:8px 0 4px;padding:8px 10px">
             <p class="hint" style="margin:0;color:var(--low)"><b>Revisa la tipología.</b> La ${med==='ACA'?'adaptación curricular de ampliación (ACA)':'adaptación curricular significativa (ACS)'} está prevista para ${need}. Este alumno no tiene marcada esa tipología. Puedes guardar igualmente —la decisión corresponde al equipo de orientación—, pero márcala arriba si procede.</p></div>`;
    } else if(m && m.sig){
      noteBox.innerHTML = `<div class="card" style="border-left:3px solid var(--mark);margin:8px 0 4px;padding:8px 10px">
        <p class="hint" style="margin:0">Es una <b>actuación específica</b>: requiere evaluación psicopedagógica y autorización. En la app queda registrada, pero no cambia los criterios con los que le evalúas.</p></div>`;
    } else if(m){
      noteBox.innerHTML = `<div class="card" style="border-left:3px solid var(--rule);margin:8px 0 4px;padding:8px 10px">
        <p class="hint" style="margin:0"><b>Actuación general</b>: <b>no cambia los criterios de evaluación</b>. Este alumno se evalúa con los criterios del curso y no aparecerá en la opción «Adaptar» de las tareas. Anota a la derecha los apoyos concretos.</p></div>`;
    } else {
      noteBox.innerHTML = '';
    }
  };
  const drawMeas = ()=>{
    const box = wrap.querySelector('#measList');
    box.innerHTML = measures.map((t,i)=>`<div class="row" style="margin-bottom:6px">
        <input class="inp meas-input" value="${esc(t)}" data-i="${i}">
        <button class="icon" data-delm="${i}">✕</button></div>`).join('');
  };
  const drawTip = ()=>{
    const open = [...wrap.querySelectorAll('.dv-cat')].map(x=>x.open);
    wrap.querySelector('#dvTip').innerHTML = tipHtml();
    wrap.querySelectorAll('.dv-cat').forEach((x,i)=>{ if(open[i]) x.open = true; });
  };
  wrap.querySelector('#medSel').addEventListener('change', e=>{ med = e.target.value; refresh(); });
  wrap.addEventListener('change', e=>{
    const t = e.target;
    if(t.dataset.cat){            // casilla de la categoría
      const k = t.dataset.cat;
      conds = conds.filter(x=>x!==k && x.indexOf(k+'.')!==0);
      if(t.checked) conds.push(k);
      conds = normConds(conds); drawTip();
      if(t.checked){ const dt = [...wrap.querySelectorAll('.dv-cat')][ACNEAE.findIndex(x=>x.code===k)]; if(dt) dt.open = true; }
      refresh(); return;
    }
    if(t.dataset.sub){            // casilla de un subtipo: implica su categoría
      const k = t.dataset.sub, i = conds.indexOf(k);
      if(t.checked && i<0) conds.push(k);
      if(!t.checked && i>-1){ conds.splice(i,1); const cat = k.split('.')[0]; if(!conds.some(x=>x.indexOf(cat+'.')===0)) conds.push(cat); }
      conds = normConds(conds); drawTip(); refresh(); return;
    }
    if(t.dataset.actc){
      const i = acts.indexOf(t.dataset.actc);
      if(t.checked && i<0) acts.push(t.dataset.actc);
      if(!t.checked && i>-1) acts.splice(i,1);
    }
  });
  wrap.addEventListener('click', e=>{
    const rf = e.target.closest('[data-ref]');
    if(rf){ e.preventDefault(); refCycle=Number(rf.dataset.ref);
      wrap.querySelectorAll('#refPick [data-ref]').forEach(b=>b.setAttribute('aria-pressed', Number(b.dataset.ref)===refCycle)); return; }
    if(e.target.hasAttribute('data-addm')){ e.preventDefault();
      syncMeas(); measures.push(''); drawMeas();
      const ins=[...wrap.querySelectorAll('.meas-input')]; if(ins.length) ins[ins.length-1].focus(); return; }
    if(e.target.hasAttribute('data-delm')){ e.preventDefault();
      syncMeas(); measures.splice(Number(e.target.dataset.delm),1); drawMeas(); return; }
    if(e.target.hasAttribute('data-fromdua')){ e.preventDefault(); pickDua(); return; }
  });
  function syncMeas(){ [...wrap.querySelectorAll('.meas-input')].forEach((inp,i)=>measures[i]=inp.value); }
  function pickDua(){
    const cat = duaCat(c);
    const all = [];
    Object.keys(cat).forEach(bk=>cat[bk].items.forEach(it=>all.push(it)));
    const sub = openModal(`<h3>Tomar del catálogo DUA</h3><p class="sub">Se añade como medida individual de ${esc(s.name)}.</p>
      ${all.map((it,i)=>`<label class="check-opt"><input type="checkbox" data-p="${i}"><span>${esc(it)}</span></label>`).join('')}`, ()=>{
      syncMeas();
      sub.querySelectorAll('input:checked').forEach(chk=>measures.push(all[Number(chk.dataset.p)]));
      drawMeas();
    }, 'Añadir');
  }
  refresh(); drawMeas();
}

function importCritModal(){
  const c = course(), aid = areaId();
  const inner = `<h3>Importar criterios</h3>
    <p class="sub">${esc(areaDef(aid).name)} · ${CYCLE_NAMES[c.cycle]}</p>
    ${field('Pega el texto tal cual', 'raw', {type:'textarea', rows:9,

    ${field('Competencias específicas (opcional): número | enunciado', 'ces', {type:'textarea', rows:4,
      placeholder:'1 | Comprender el sentido general e información específica...'})}
    <p class="sub">Se reconocen las líneas que empiezan por un código tipo 1.1 o 2.3.</p>`;
  openModal(inner, v=>{
    const out = {}; let cur = null;
    v.raw.split('\n').forEach(line=>{
      const m = line.match(/^\s*(\d{1,2}\.\d{1,2})\.?\s*(.*)$/);
      if(m){ cur = m[1]; out[cur] = (m[2]||'').trim(); }
      else if(cur && line.trim()) out[cur] += ' ' + line.trim();
    });
    Object.keys(out).forEach(k=>{ out[k] = out[k].replace(/\s+/g,' ').trim(); });
    if(Object.keys(out).length) state.curriculo[aid].crit[c.cycle] = out;
    if(v.ces && v.ces.trim()){
      const ce = state.curriculo[aid].ce || {};
      v.ces.split('\n').forEach(l=>{
        const p = l.split('|'); const n = (p[0]||'').trim().replace(/\D/g,'');
        if(n && p[1]) ce[n] = p.slice(1).join('|').trim();
      });
      state.curriculo[aid].ce = ce;
    }
    state.view = 'trimestre'; state.triSub = 'referencia';
  }, 'Importar');
}

/* ---- desarrollo de la sesión como lista de partes ----
   s.parts = [{text, min}].  Compatibilidad: sesiones antiguas con s.notes
   (texto o HTML) se convierten en partes por líneas. */
function sessionParts(s){
  if(Array.isArray(s.parts)) return s.parts.map(p=>({text:p.text||'', min:Number(p.min)||0}));
  if(s.notes){
    const txt = String(s.notes).replace(/<li[^>]*>/gi,'\n').replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ');
    return txt.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>({text:l, min:0}));
  }
  return [];
}
function slotMinutes(sl){
  const p = t=>{ const x=(t||'').split(':'); return Number(x[0])*60+Number(x[1]||0); };
  return Math.max(0, p(sl.to)-p(sl.from));
}
/* render del desarrollo para la vista de Día */
/* ---------- anexos de las sesiones ----------
   El archivo se guarda en este equipo (IndexedDB) y, con Drive conectado, se sube a la carpeta
   «Cuaderno Profesor · anexos». En la sesión solo queda la referencia {id, name, type, size, driveId}. */
const ATT_MAX = 25*1024*1024;
const attUrls = {};
function attIsImg(a){ return /^image\//.test(a.type||''); }
function attIsPdf(a){ return a.type==='application/pdf' || /\.pdf$/i.test(a.name||''); }
function attIcon(a){ return attIsImg(a)?'🖼️':attIsPdf(a)?'📄':/presentation|powerpoint|\.pptx?$/i.test(a.type+a.name)?'📊':/word|\.docx?$/i.test(a.type+a.name)?'📝':/audio\//.test(a.type)?'🎧':/video\//.test(a.type)?'🎬':'📎'; }
function attSize(n){ return n>1048576 ? (n/1048576).toFixed(1).replace('.',',')+' MB' : Math.max(1,Math.round(n/1024))+' KB'; }
/* las fotos grandes se reducen (lado mayor 2400 px) para no llenar el almacenamiento */
async function attShrink(file){
  if(!/^image\/(jpeg|png|webp)$/.test(file.type) || file.size < 1.5*1024*1024) return file;
  try{
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, 2400/Math.max(bmp.width, bmp.height));
    const cv = document.createElement('canvas'); cv.width = Math.round(bmp.width*k); cv.height = Math.round(bmp.height*k);
    cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
    const blob = await new Promise(r=>cv.toBlob(r, 'image/jpeg', 0.85));
    return blob && blob.size < file.size ? new File([blob], file.name.replace(/\.\w+$/, '')+'.jpg', {type:'image/jpeg'}) : file;
  }catch(e){ return file; }
}
async function attAdd(file){
  const f = await attShrink(file);
  const a = {id:uid()+uid(), name:f.name||'archivo', type:f.type||'application/octet-stream', size:f.size, driveId:null};
  await idbSet('att:'+a.id, f);
  return a;
}
async function attBlob(a){
  let b = await idbGet('att:'+a.id);
  if(b) return b;
  if(a.driveId && gd.connected && gdTokenOk()){
    const r = await gdFetch(GD_API+'/files/'+a.driveId+'?alt=media');
    if(r.ok){ b = await r.blob(); await idbSet('att:'+a.id, b); return b; }
  }
  return null;
}
async function attUrl(a){
  if(attUrls[a.id]) return attUrls[a.id];
  const b = await attBlob(a); if(!b) return null;
  return attUrls[a.id] = URL.createObjectURL(b.type ? b : new Blob([b], {type:a.type}));
}
function allAtts(){ const out = []; Object.keys(state.sessions||{}).forEach(k=>(state.sessions[k].files||[]).forEach(a=>out.push(a)));
  (state.courses||[]).forEach(c=>(c.units||[]).forEach(u=>{ ((u.plan||{}).files||[]).forEach(a=>out.push(a)); if(u.cover) out.push(u.cover); })); return out; }
async function gdAttFolder(){
  if(state.attFolderId){
    try{ const r = await gdFetch(GD_API+'/files/'+state.attFolderId+'?fields=id,trashed'); if(r.ok){ const f = await r.json(); if(f.id && !f.trashed) return f.id; } }catch(e){ if(e.offline||e.auth) throw e; }
  }
  const r = await gdFetch(GD_API+'/files?fields=id', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({name:'Cuaderno Profesor · anexos', mimeType:'application/vnd.google-apps.folder'})});
  const f = await r.json(); state.attFolderId = f.id; save(); return f.id;
}
let attBusy = false;
async function attUploadPending(){
  if(attBusy || !gd.connected || !gdTokenOk() || !navigator.onLine) return;
  const todo = allAtts().filter(a=>!a.driveId);
  if(!todo.length) return;
  attBusy = true;
  try{
    const folder = await gdAttFolder();
    for(const a of todo){
      const blob = await idbGet('att:'+a.id); if(!blob) continue;
      const b = 'att'+Math.random().toString(36).slice(2);
      const meta = {name:a.name, parents:[folder], mimeType:a.type};
      const body = new Blob(['--'+b+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(meta)+'\r\n--'+b+'\r\nContent-Type: '+(a.type||'application/octet-stream')+'\r\n\r\n', blob, '\r\n--'+b+'--']);
      const r = await gdFetch(GD_UP+'/files?uploadType=multipart&fields=id', {method:'POST', headers:{'Content-Type':'multipart/related; boundary='+b}, body:body});
      const f = await r.json();
      /* la misma referencia puede estar en varias sesiones (sesión copiada) */
      allAtts().forEach(x=>{ if(x.id===a.id) x.driveId = f.id; });
      save();
    }
  }catch(e){}
  attBusy = false;
}
/* miniaturas: se rellenan después de pintar */
async function attHydrate(root){
  const els = (root||document).querySelectorAll('img[data-attimg]:not([src])');
  for(const el of els){
    const a = allAtts().find(x=>x.id===el.dataset.attimg) || (window.__attTmp||[]).find(x=>x.id===el.dataset.attimg);
    if(!a) continue;
    try{ const u = await attUrl(a); if(u) el.src = u; else el.closest('.att-th')?.classList.add('att-missing'); }catch(e){ el.closest('.att-th')?.classList.add('att-missing'); }
  }
}
function attThumbs(files, opts){
  opts = opts || {};
  if(!files || !files.length) return '';
  return `<div class="att-list ${opts.small?'small':''}">${files.map((a,i)=>`<div class="att-th" data-attopen="${i}" title="${esc(a.name)} · ${attSize(a.size||0)}">
      ${attIsImg(a)?`<img data-attimg="${a.id}" alt="">`:`<span class="att-ic">${attIcon(a)}</span>`}
      <span class="att-nm">${esc(a.name)}</span>
      ${opts.edit?`<button type="button" class="att-del" data-attdel="${i}" title="Quitar de la sesión">✕</button>`:''}
    </div>`).join('')}</div>`;
