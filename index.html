/* visor a pantalla completa, con flechas entre anexos */
async function attViewer(files, start){
  let i = start||0;
  const root = document.createElement('div'); root.className = 'att-viewer';
  const show = async ()=>{
    const a = files[i];
    root.innerHTML = `<div class="av-bar"><span class="av-nm">${attIcon(a)} ${esc(a.name)}</span><span class="av-n">${i+1} / ${files.length}</span><div class="spacer"></div>
        <button data-av="full" title="Pantalla completa">⛶</button><button data-av="dl" title="Descargar">⬇</button><button data-av="close" title="Cerrar (Esc)">✕</button></div>
      <div class="av-stage"><div class="av-load">Cargando…</div></div>
      ${files.length>1?`<button class="av-nav prev" data-av="prev">‹</button><button class="av-nav next" data-av="next">›</button>`:''}`;
    const stage = root.querySelector('.av-stage');
    let u = null; try{ u = await attUrl(a); }catch(e){}
    if(files[i]!==a) return;
    if(!u){ stage.innerHTML = `<div class="av-msg">Este anexo no está en este equipo${a.driveId?' y no se ha podido traer de Drive. Conecta Drive y vuelve a intentarlo.':' y aún no se había subido a Drive desde el otro equipo.'}</div>`; return; }
    if(attIsImg(a)) stage.innerHTML = `<img src="${u}" alt="${esc(a.name)}">`;
    else if(attIsPdf(a)) stage.innerHTML = `<iframe src="${u}#view=FitH" title="${esc(a.name)}"></iframe>`;
    else if(/^video\//.test(a.type)) stage.innerHTML = `<video src="${u}" controls autoplay></video>`;
    else if(/^audio\//.test(a.type)) stage.innerHTML = `<div class="av-msg"><div style="font-size:64px">🎧</div><audio src="${u}" controls autoplay></audio></div>`;
    else stage.innerHTML = `<div class="av-msg"><div style="font-size:64px">${attIcon(a)}</div><p>Este tipo de archivo no se puede mostrar aquí.</p>
      <div class="row" style="justify-content:center;gap:10px">${a.driveId?`<a class="tl-go small" href="https://drive.google.com/file/d/${a.driveId}/view" target="_blank" rel="noopener">Abrir en Drive</a>`:''}
      <a class="tl-go small" href="${u}" download="${esc(a.name)}">Descargar</a></div></div>`;
  };
  const close = ()=>{ if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}); root.remove(); document.removeEventListener('keydown', key); };
  const key = e=>{ if(e.key==='Escape') close(); if(e.key==='ArrowRight' && files.length>1){ i=(i+1)%files.length; show(); } if(e.key==='ArrowLeft' && files.length>1){ i=(i-1+files.length)%files.length; show(); } };
  root.addEventListener('click', async e=>{
    const b = e.target.closest('[data-av]'); if(!b){ if(e.target===root || e.target.classList.contains('av-stage')) close(); return; }
    const v = b.dataset.av;
    if(v==='close') close();
    if(v==='next'){ i=(i+1)%files.length; show(); }
    if(v==='prev'){ i=(i-1+files.length)%files.length; show(); }
    if(v==='full'){ if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}); else root.requestFullscreen && root.requestFullscreen().catch(()=>{}); }
    if(v==='dl'){ const u = await attUrl(files[i]); if(u){ const l = document.createElement('a'); l.href = u; l.download = files[i].name; l.click(); } }
  });
  document.addEventListener('keydown', key);
  document.body.appendChild(root);
  show();
}

      const cc = state.courses.find(x=>x.id===ad.dataset.cid);
      const tk = cc && cc.tasks.find(x=>x.id===ad.dataset.adapttask);
      if(tk){ state.activeCourse=cc.id; state.activeArea=tk.areaId; state.activePeriod=tk.periodId; wrap.remove(); save(); adaptModal(tk.id); }
      return;
    }
    const un = e.target.closest('[data-untask]');
    if(un){
      e.preventDefault();
      const cc = state.courses.find(x=>x.id===un.dataset.cid);
      const tk = cc && cc.tasks.find(x=>x.id===un.dataset.untask);
      if(tk){ setTaskDates(tk, dateEntries(tk).filter(x=>x.d!==iso)); save(); drawTasks(); }
      return;
    }
    if(e.target.id==='sesAddTask'){
      e.preventDefault();
      // guarda lo escrito en la sesión antes de saltar al alta de tarea
      const v = vals(wrap);
      const clean = parts.map(pp=>({text:(pp.text||'').trim(), min:pp.min||0})).filter(pp=>pp.text);
      if(v.title || clean.length || courseId)
        state.sessions[key] = {title:v.title||'', parts:clean, courseId:courseId, areaId:courseId?aid:''};
      wrap.remove(); save();
      openTaskPage({cid:courseId, aid:aid, dates:[{d:iso, t:sl?sl.from:''}], fromAgenda:true});
      return;
    }
  });

  if(state.sessions[key]){
    const row = wrap.querySelector('.modal > .row');
    const cp = document.createElement('button');
    cp.className='btn ghost'; cp.textContent='⧉ Copiar sesión';
    cp.addEventListener('click', ev=>{
      ev.preventDefault();
      // copia lo que hay escrito ahora mismo (aunque no se haya guardado)
      const v = vals(wrap);
      const clean = parts.map(pp=>({text:(pp.text||'').trim(), min:pp.min||0})).filter(pp=>pp.text);
      state.sessions[key] = {title:v.title||'', parts:clean, courseId:courseId, areaId:courseId?aid:''};
      save(); wrap.remove(); copySession(iso, slotId);
    });
    row.insertBefore(cp, row.children[0]);
    const del = document.createElement('button');
    del.className='btn danger'; del.textContent='Vaciar sesión'; del.dataset.delsession='1';
    row.insertBefore(del, row.children[1]);
    wrap.addEventListener('click', e=>{
      if(e.target.dataset.delsession){ delete state.sessions[key]; save(); wrap.remove(); render(); }
    });
  }
}

function scheduleModal(){
  const draw = ()=>state.schedule.map((sl,i)=>`<div class="sch-row" data-i="${i}">
      <input class="inp" type="time" value="${sl.from}" data-i="${i}" data-f="from">
      <input class="inp" type="time" value="${sl.to}" data-i="${i}" data-f="to">
      <select class="inp" data-i="${i}" data-f="kind">
        <option value="class" ${sl.kind!=='break'?'selected':''}>Sesión lectiva</option>
        <option value="break" ${sl.kind==='break'?'selected':''}>Recreo / pausa</option>
      </select>
      <input class="inp" value="${esc(sl.label||'')}" placeholder="Etiqueta" data-i="${i}" data-f="label">
      <button class="icon" data-schdel="${i}">✕</button>
    </div>`).join('');
  const inner = `<h3>Editar horario</h3>
    <p class="sub">Define las franjas de tu jornada. Se aplican a todas las semanas.</p>
    <div id="schList">${draw()}</div>
    <div class="row" style="margin-top:8px"><button class="btn ghost small" data-schadd>+ Añadir franja</button></div>`;
  const wrap = openModal(inner, ()=>{
    const rows = [...wrap.querySelectorAll('.sch-row')];
    state.schedule = rows.map(r=>{
      const get=f=>r.querySelector('[data-f="'+f+'"]').value;
      const kind=get('kind');
      const orig = state.schedule[Number(r.dataset.i)];
      const sl={id:orig?orig.id:uid(), from:get('from'), to:get('to'), kind:kind};
      if(kind==='break') sl.label=get('label')||'Recreo';
      return sl;
    }).sort((a,b)=>a.from.localeCompare(b.from));
  }, 'Guardar', {wide:true});
  wrap.addEventListener('click', e=>{
    if(e.target.hasAttribute('data-schadd')){ e.preventDefault();
      state.schedule.push({id:uid(), from:'14:00', to:'15:00', kind:'class'});
      wrap.querySelector('#schList').innerHTML = draw(); return; }
    if(e.target.hasAttribute('data-schdel')){ e.preventDefault();
      state.schedule.splice(Number(e.target.dataset.schdel),1);
      wrap.querySelector('#schList').innerHTML = draw(); return; }
  });
}

function unitModal(existing){
  const c = course(), aid = areaId(), p = period();
  const u = existing || {name:'', desc:''};
  const inner = `<h3>${existing?'Editar unidad':'Nueva unidad'}</h3>
    <p class="sub">${esc(areaDef(aid).name)} · ${esc(p.name)}</p>
    ${field('Nombre','name',{value:u.name, placeholder:'Unit 1: My daily routine'})}
    ${field('Descripción (opcional)','desc',{type:'textarea', rows:3, value:u.desc, placeholder:'Contenidos, temporalización, producto final de la unidad…'})}
    ${!existing && dupTargets(c, aid).some(x=>x.ok) ? `<div class="field"><span>Crear también en</span>
      <div class="dup-list">${dupTargets(c, aid).filter(x=>x.ok).map(({c:x})=>`<label class="dup-opt"><input type="checkbox" name="also_${x.id}"> <span><b>${esc(x.name)}</b></span></label>`).join('')}</div></div>` : ''}`;
  const wrap = openModal(inner, v=>{
    if(!v.name) return;
    if(existing){ existing.name=v.name; existing.desc=v.desc||''; }
    else {
      const nu = {id:uid(), areaId:aid, periodId:p.id, name:v.name, desc:v.desc||''};
      c.units.push(nu);
      dupTargets(c, aid).filter(x=>x.ok && v['also_'+x.c.id]).forEach(({c:dst})=>ensureUnitIn(c, dst, nu));
      state.activeUnit=nu.id; state.view='unidad'; state.unitSub='plan'; state.upView='edit';
      if(!state.upOpen || typeof state.upOpen!=='object') state.upOpen = {}; state.upOpen[nu.id] = ['ident'];
    }
  }, existing?'Guardar':'Crear unidad');
  if(existing && state.courses.length>1){
    const row = wrap.querySelector('.modal > .row');
    const b = document.createElement('button');
    b.className = 'btn ghost'; b.textContent = '⇉ Duplicar en otra clase';
    b.addEventListener('click', ev=>{ ev.preventDefault(); wrap.remove(); dupModal('unit', existing.id); });
    row.insertBefore(b, row.children[0]);
  }
}

function courseModal(existing){

  const inner = `<h3>${c?'Editar clase':'Nueva clase'}</h3>
    ${field('Nombre','name',{value:c?c.name:'', placeholder:'4.º A'})}
    ${field('Curso','level',{type:'select', value:c?c.level:'4º', options:Object.keys(COURSE_CYCLE).map(k=>({value:k,label:k+' de Primaria · '+CYCLE_NAMES[COURSE_CYCLE[k]]}))})}
    ${field('Descripción (opcional)','desc',{type:'textarea', rows:2, value:c?c.desc:'', placeholder:'Grupo, horario, aula, lo que quieras recordar.'})}
    <label class="field"><span>Áreas que impartes en esta clase</span></label>
    <div class="crit-chips">${Object.keys(state.curriculo).map(a=>
      `<button class="chip ${areas.indexOf(a)>-1?'on':''}" data-area="${a}">${esc(areaDef(a).short||a)}</button>`).join('')}</div>
    <p class="sub" style="margin-top:10px">El ciclo se deduce del curso; al guardar se cargan sus criterios de evaluación.</p>`;
  const wrap = openModal(inner, v=>{
    if(!v.name) return;
    if(c){ c.name=v.name; c.level=v.level; c.desc=v.desc||''; c.cycle=COURSE_CYCLE[v.level]||c.cycle; c.areas = areas.length?areas:c.areas; }
    else {
      const n = newCourse(v.name, v.level, areas);

  });
}

  restore(){
    const inner = `<h3>Restaurar desde archivo</h3>
      <p class="sub">Abre una copia descargada antes, en este equipo o en otro.</p>
      <label class="field"><span>Archivo .json</span>
        <input class="inp" type="file" accept=".json,application/json" id="bkFile"></label>
      ${field('Qué hacer con lo que ya hay','mode',{type:'select', value:'merge', options:[
        {value:'merge', label:'Añadir lo que falte y conservar lo actual'},
        {value:'replace', label:'Reemplazarlo todo por el contenido del archivo'}]})}
      <label class="field"><span>O pega aquí el contenido</span>
        <textarea class="inp" name="raw" style="min-height:90px;font-size:12px" placeholder='{"app":"cuaderno-lomloe"...'></textarea></label>`;
    const wrap = openModal(inner, v=>{
      const finish = txt=>{
        let data;
        try{ data = JSON.parse(txt); }catch(e){ return alertBox('No se ha podido leer el archivo: no es un JSON válido.'); }
        if(!data || (!data.courses && !data.templates && !data.curriculo))
          return alertBox('El archivo no parece una copia de este cuaderno.');
        applyBackup(data, v.mode);
      };
      const f = wrap.querySelector('#bkFile');
      if(f && f.files && f.files[0]){
        const rd = new FileReader();
        rd.onload = ()=>finish(String(rd.result));
        rd.onerror = ()=>alertBox('No se ha podido leer el archivo.');
        rd.readAsText(f.files[0]);
      } else if(v.raw){ finish(v.raw); }
      else alertBox('Elige un archivo o pega el contenido.');
    }, 'Restaurar');
  },

  csv(){
    const c=course(), aid=areaId(), p=period();
    const codes = critsWorked(c, aid, p.id, null);
    const head = ['Alumno/a', 'Adaptación', ...codes.map(cd=>cd+(critWeight(c,aid,p.id,cd)!=null?' ('+critWeight(c,aid,p.id,cd)+'%)':'')), 'Nota final', 'Calificación'];
    const rows = c.students.map(s=>{
      const f = areaFinal(c, s.id, aid, p.id);
      const k = calif(f, c.scale);
      const dv = c.diversity[dvkey(s.id,aid)]; const med = dv&&dv.med?medDef(dv.med).code:'';
      const own = critsWorked(c, aid, p.id, s.id);
      return [s.name, med,
        ...codes.map(cd=> own.indexOf(cd)>-1 ? fmt2(critScore(c,s.id,aid,p.id,cd)) : 'n/a'),
        fmt(f) + (isAdjFinal(c,s.id,aid,p.id)?' *':''), k?k.code:''];
    });
    const csv = [head, ...rows].map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\n');
    const wrap = openModal(`<h3>CSV · ${esc(c.name)}</h3><p class="sub">${esc(areaDef(aid).name)} · ${esc(p.name)}</p>
      <textarea class="inp" style="min-height:190px;font-family:var(--font-mono);font-size:14px">${esc(csv)}</textarea>`, null);
    const bar = wrap.querySelector('.row');
    const dl = document.createElement('button');
    dl.className='btn'; dl.textContent='Descargar';
    dl.onclick = ()=>{
      const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = (c.name+'_'+(areaDef(aid).short||'')+'_'+p.name).replace(/[^\w]+/g,'_')+'.csv';
      a.click();
    };
    bar.appendChild(dl);
    wrap.querySelector('textarea').select();
  }
};

document.addEventListener('click', e=>{

  if(!t || t.tagName==='INPUT' || t.tagName==='SELECT' || t.tagName==='TEXTAREA') return;
  if(t.closest('.backdrop')) return;
  const fn = actions[t.dataset.act];
  if(fn){ e.preventDefault(); if(t.closest('summary')) e.stopPropagation(); if(weightGuard(t.dataset.act, ()=>fn(t))) return; fn(t); }
});
/* al salir del editor de un instrumento, sus pesos tienen que sumar 100 % */
const LEAVE_ACTS = ['tab','goHome','backToUnit','pickCourse','pickArea','pickPeriod','editTask'];
function weightGuard(act, go){
  if(state.view!=='editorInstr' || LEAVE_ACTS.indexOf(act)<0) return false;
  const ins = editedInstr();
  if(weightsOk(ins)) return false;
  const sum = String(weightSum(ins)).replace('.',',');
  const wrap = openModal(`<h3>Los pesos suman ${sum} %</h3>
    <p class="sub" style="margin:0">Los porcentajes de los ítems tienen que sumar 100 %. Puedes volver y corregirlos, o ajustarlos ahora manteniendo la proporción entre ellos.</p>`,
    ()=>{ fixWeights(ins); go(); }, 'Ajustar a 100 % y salir');
  wrap.querySelector('[data-close]').textContent = 'Volver a corregir';
  wrap.addEventListener('click', e=>{ if(e.target===wrap || e.target.hasAttribute('data-close')) renderHeader(); });
  return true;
}

document.addEventListener('change', async e=>{
  const t = e.target; if(!t.dataset || !t.dataset.upfile) return;
  const c = course(), u = c && unitById(c, state.activeUnit); if(!u) return;
  const list = [...t.files]; t.value = ''; const key = t.dataset.upfile; let bad = '';
  for(const f of list){
    if(f.size > ATT_MAX){ bad = '«'+f.name+'» pesa más de 25 MB y no se ha añadido.'; continue; }
    try{ const a = await attAdd(f);
      if(key==='cover'){ if(!/^image\//.test(f.type||'')){ bad = 'La foto de cabecera tiene que ser una imagen.'; continue; } u.cover = a; break; }
      if(key==='unit'){ if(!u.plan || typeof u.plan!=='object') u.plan = {}; (u.plan.files = u.plan.files || []).push(a); }
      else if(state.sessions[key]){ (state.sessions[key].files = state.sessions[key].files || []).push(a); }
    }catch(err){ bad = 'No se ha podido guardar «'+f.name+'» en este equipo.'; }
  }
  save(); render();
  if(bad){ const h = document.getElementById(key==='cover'?'upCoverHint':'upAttHint'); if(h) h.innerHTML = '<b style="color:#B4232C">'+esc(bad)+'</b>'; }
});
document.addEventListener('click', e=>{

document.addEventListener('change', e=>{
  const t = e.target.closest('[data-act]');
  if(!t || t.closest('.backdrop')) return;
  const a = t.dataset.act, c = course();
  if(a==='iniGrade'||a==='iniObs'||a==='progObs') return;
  if(a==='pickCourse'||a==='pickPeriod'||a==='pickArea'){ const v = t.value; if(weightGuard(a, ()=>actions[a]({value:v, dataset:t.dataset}))) return; actions[a](t); return; }
  if(a==='toggleDiana'){ actions.toggleDiana(); return; }
  if(a==='homeTutCourse'||a==='homeAjCourse'){ actions[a](t); return; }
  if(a==='areaColor'){ if(!state.areaColors||typeof state.areaColors!=='object') state.areaColors = {}; state.areaColors[t.dataset.id] = t.value; save(); render(); return; }
  if(a==='courseColor'){ const k = state.courses.find(x=>x.id===t.dataset.id); if(k){ k.color = t.value; save(); render(); } return; }
  if(a==='attDate'){ state.attDate = t.value; save(); render(); return; }
  if(!c) return;
  if(a==='periodName'){ const x=c.periods.find(k=>k.id===t.dataset.id); x.name=t.value; save(); renderHeader(); return; }
  if(a==='cpass'){ c.pass = num(t.value)==null?5:num(t.value); save(); return; }
  if(a==='scaleMin'){ c.scale[Number(t.dataset.i)].min = num(t.value)||0; save(); return; }
  if(a==='scaleRef'){ c.scale[Number(t.dataset.i)].ref = num(t.value)||0; save(); return; }
  if(a==='minTut'){ c.minTutorias = Math.max(1, Number(t.value)||3); save(); render(); return; }
  if(a==='ovTask'){
    const k = gkey(t.dataset.s, t.dataset.t);
    const v = num(t.value);
    if(t.value.trim()==='' || v==null) delete c.overrides[k];
    else c.overrides[k] = String(v);
    save(); render(); return;
  }
  if(a==='extGrade'){
    const ok = extSet(c, t.dataset.s, t.dataset.e, t.dataset.p, t.value);
    t.classList.toggle('bad', !ok);
    t.title = ok ? '' : 'Escribe un número de 0 a 10 o '+c.scale.map(k=>k.code).join(', ');
    if(!ok) return;
    const g = extGet(c, t.dataset.s, t.dataset.e, t.dataset.p);
    t.value = extText(g); t.classList.toggle('low', !!g && g.v<c.pass);
    const pl = t.parentNode.querySelector('.ext-pill'); if(pl) pl.innerHTML = extPill(c, g);
    const mc = document.querySelector('[data-xmean="'+t.dataset.e+'"]'); if(mc) mc.textContent = fmt(extClassMean(c, t.dataset.e, t.dataset.p));
    save(); return;
  }
  if(a==='ovFinal'){
    const k = fkey(t.dataset.s, areaId(), period().id);
    const v = num(t.value);
    if(t.value.trim()==='' || v==null) delete c.finals[k];
    else c.finals[k] = String(v);
    save(); render(); return;
  }
  if(a==='critW'){ actions.critW(t); render(); return; }

  const ins = editedInstr();
  if(!ins) return;
  const i = t.dataset.i!=null ? Number(t.dataset.i) : null;
  const j = t.dataset.j!=null ? Number(t.dataset.j) : null;
  if(a==='instrName'||a==='instrDesc'){
    const tpl = state.templates.find(x=>x.id===state.editor.id);
    if(tpl){ if(a==='instrName') tpl.name=t.value; else tpl.desc=t.value; save(); }
    return;
  }
  if(a==='instrMax'){ ins.max = Number(t.value)||10; save(); if(ins.type==='points') render(); return; }
  if(a==='instrType'){
    const before = ins.type;
    ins.type = t.value;
    if((ins.type==='rubric'||ins.type==='scale') && !(ins.levels||[]).length)
      ins.levels = ins.type==='scale' ? numericLevels(4) : LEVEL_PRESETS.calif.slice();
    if(ins.type!=='num' && !(ins.items||[]).length) ins.items = [mkItem('','')];
    if(before!==ins.type && state.editor.mode==='task'){
      const cc = course();
      Object.keys(cc.grades).forEach(k=>{ if(k.indexOf(':'+state.editor.id)>-1) delete cc.grades[k]; });
    }
    if(before!==ins.type && state.editor.mode==='adapt'){
      const cc = course();
      delete cc.grades[gkey(state.editor.sid, state.editor.taskId)];
    }
    save(); render(); return;
  }
  if(a==='levelLabel'){ ins.levels[j].label = t.value; save(); return; }
  if(a==='levelValue'){ ins.levels[j].value = num(t.value)==null?0:num(t.value);
    document.querySelectorAll('[data-tj="'+j+'"]').forEach(x=>{ x.className = x.className.replace(/\btn\d\b/, tn(ins.levels[j])); });
    save(); return; }
  if(a==='itemName'){ ins.items[i].name = t.value; save(); return; }
  if(a==='itemWeight'){ const v = num(t.value); ins.items[i].weight = v==null ? 0 : Math.max(0, Math.min(100, wRound(v))); t.value = ins.items[i].weight; weightBarRefresh(ins); save(); return; }
  if(a==='cellText'){
    const it = ins.items[i];
    if(!it.cells) it.cells = [];
    while(it.cells.length < ins.levels.length) it.cells.push('');
    it.cells[j] = t.value;
    save(); return;
  }
});

document.addEventListener('input', e=>{
  if(e.target.dataset && e.target.dataset.act==='itemWeight' && !e.target.closest('.backdrop')){
    const ins = editedInstr(); const it = ins && ins.items[Number(e.target.dataset.i)];
    if(it){ const v = num(e.target.value); it.weight = v==null ? 0 : Math.max(0, wRound(v)); weightBarRefresh(ins); }
  }
});
document.addEventListener('input', e=>{
  const t = e.target;
  if(!t.dataset) return;
  const ia = t.dataset.act;
  if(ia==='iniGrade' || ia==='iniObs' || ia==='progObs'){
    const c = course(), aid = areaId(); if(!c) return;
    if(ia==='iniGrade'){
      const k = gkey(t.dataset.s, t.dataset.t), v = t.value.trim();
      const tk = taskById(c, t.dataset.t), mx = tk && tk.instr ? (tk.instr.max||10) : 10;
      const n = num(v);
      t.classList.toggle('bad', v!=='' && (n==null || n<0 || n>mx));
      if(v==='') delete c.grades[k]; else c.grades[k] = v;
      const mb = document.querySelector('[data-inimean="'+t.dataset.s+'"]');
      if(mb){ const m = initMean(c, t.dataset.s, aid); mb.textContent = m==null?'–':fmt2(m); }
    } else if(ia==='iniObs'){
      if(!c.initObs) c.initObs = {};
      const k = okey(t.dataset.s, aid);
      if(t.value.trim()) c.initObs[k] = t.value; else delete c.initObs[k];
      autoGrow(t);
    } else {
      if(!c.progress) c.progress = {};
      const k = fkey(t.dataset.s, aid, period().id);
      if(t.value.trim()) c.progress[k] = t.value; else delete c.progress[k];
      autoGrow(t);
    }
    save(); return;
  }
  if(t.dataset.act!=='grade') return;
  const c = course(), aid = areaId(), p = period();
  const key = gkey(t.dataset.s, t.dataset.t);
  if(t.value.trim()==='') delete c.grades[key]; else c.grades[key] = t.value.trim();
  const task = taskById(c, t.dataset.t);
  const v = taskScore(c, task, t.dataset.s);
  t.classList.toggle('low', v!=null && v < c.pass);
  refreshRow(t.dataset.s, aid, p.id);
  save();
});

function refreshRow(studentId, aid, pid){
  const c = course();
  const tr = document.querySelector('[data-student="'+studentId+'"]');
  if(!tr) return;
  const f = areaFinal(c, studentId, aid, pid);
  const fc = tr.querySelector('[data-final]');
  if(fc){ fc.textContent = fmt(f); fc.classList.toggle('low', f!=null && f < c.pass); }
  const kc = tr.querySelector('[data-calif]');
  if(kc) kc.innerHTML = pill(f, c.scale);
}

document.addEventListener('keydown', e=>{
  const t = e.target;
  if(t.dataset && t.dataset.act==='iniGrade' && (e.key==='Enter' || e.key==='ArrowDown' || e.key==='ArrowUp')){
    e.preventDefault();
    const inputs = [...document.querySelectorAll('input[data-act="iniGrade"][data-t="'+t.dataset.t+'"]')];
    const nx = inputs[inputs.indexOf(t) + (e.key==='ArrowUp'?-1:1)];
    if(nx){ nx.focus(); nx.select(); }
    return;
  }
  if(!t.dataset || t.dataset.act!=='grade') return;
  if(e.key==='Enter' || e.key==='ArrowDown' || e.key==='ArrowUp'){
    e.preventDefault();
    const inputs = [...document.querySelectorAll('input[data-t="'+t.dataset.t+'"]')];
    const i = inputs.indexOf(t);
    const next = inputs[i + (e.key==='ArrowUp'?-1:1)];
    if(next){ next.focus(); next.select(); }
  }
});

document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && sessClip && !document.querySelector('.backdrop')){ sessClip = null; render(); }
});

let rzTimer=null;
window.addEventListener('resize', fitHeader);
let rzW = window.innerWidth;
window.addEventListener('resize', ()=>{
  if(window.innerWidth===rzW) return;
  rzW = window.innerWidth;
  clearTimeout(rzTimer);
  rzTimer = setTimeout(()=>{ const a = document.activeElement; const typing = a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);
    if(!document.querySelector('.backdrop') && !typing) render(); else fitHeader(); }, 250);
});

load();
if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
})();
</script>
</body>
