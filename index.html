/* migración desde el modelo anterior (herramientas compartidas) */
function migrate(){
  if(!state.templates || !state.templates.length){ state.templates = presetTemplates(); state.seedSmartNB = true; }
  if(!state.seedSmartNB){
    if(!state.templates.some(x=>x.name==='Rúbrica de Cuaderno Inteligente')) state.templates.unshift(smartNotebookTemplate());
    state.seedSmartNB = true;
  }
  if(!state.seedSelf32){
    selfEvalTemplates().forEach(t=>{ if(!state.templates.some(x=>x.name===t.name)) state.templates.push(t); });
    const dn = state.templates.find(x=>x.name==='Diana de evaluación'); if(dn){ if(dn.diana==null) dn.diana = true; if(dn.self==null) dn.self = true; }
    state.seedSelf32 = true;
  }
  if(!state.teacherTT || typeof state.teacherTT!=='object') state.teacherTT = {};
  (state.courses||[]).forEach(c=>{ if(!c.comments || typeof c.comments!=='object') c.comments = {}; if(!c.timetable || typeof c.timetable!=='object') c.timetable = {}; if(!c.marks || typeof c.marks!=='object') c.marks = {}; });
  (state.courses||[]).forEach(c=>{
    const old = c.tools || [];
    old.forEach(t=>{
      if(t.type==='levels') t.type='scale';
      if(!Array.isArray(t.items)) t.items=[];
      t.items = t.items.map(it=> typeof it==='string' ? mkItem(it,'') : it);
      t.items.forEach(it=>{ if(!it.id) it.id=uid(); if(!it.cells) it.cells=[]; if(it.weight==null) it.weight=1;
        if(!Array.isArray(it.crits)) it.crits = it.critCode? [it.critCode] : []; delete it.critCode; });
      if(!Array.isArray(t.levels)) t.levels=[];
      if(t.type==='scale' && !t.levels.length) t.levels = numericLevels(4);
      if(t.type!=='num' && !t.items.length) t.items = [mkItem(t.name,'')];
      if(!state.templates.some(x=>x.name===t.name))
        state.templates.push({id:uid(), name:t.name, desc:t.desc||'', type:t.type, max:t.max||10,
          levels:JSON.parse(JSON.stringify(t.levels)), items:JSON.parse(JSON.stringify(t.items)).map(i=>{i.id=uid();i.crits=[];delete i.critCode;return i;})});
    });
    (c.tasks||[]).forEach(task=>{
      if(task.instr) return;
      const src = old.find(x=>x.id===task.toolId);
      if(src){
        task.instr = JSON.parse(JSON.stringify({type:src.type, max:task.max||src.max||10, levels:src.levels||[], items:src.items||[]}));
        task.instr.items.forEach(it=>{
          it.crits = itemCrits(it).filter(k=>(task.criteria||[]).indexOf(k)>-1);
          delete it.critCode;
        });
      } else {
        task.instr = blankInstr('num');
        task.instr.max = task.max||10;
      }
      if(task.goals==null) task.goals='';
      if(task.activities==null) task.activities='';
      delete task.toolId;
    });
    /* calificaciones antiguas guardadas como número suelto */
    (c.tasks||[]).forEach(task=>{
      if(!task.instr || task.instr.type==='num') return;
      Object.keys(c.grades||{}).forEach(k=>{
        if(k.indexOf(':'+task.id)===-1) return;
        const v = c.grades[k];
        if(!Array.isArray(v) && v!=null && v!=='') c.grades[k] = [Number(v)];
      });
    });
    (c.tasks||[]).forEach(task=>{
      const ins = task.instr;
      if(!ins) return;
      (ins.items||[]).forEach(it=>{
        if(!Array.isArray(it.crits)) it.crits = it.critCode? [it.critCode] : [];
        delete it.critCode;
      });
    });
    if(!c.overrides) c.overrides = {};
    if(!c.finals) c.finals = {};
    if(!Array.isArray(c.tutorias)) c.tutorias = [];
    if(!c.dua) c.dua = {};                 // aid -> [medidas generales activas del grupo]
    if(!c.duaCatalog) c.duaCatalog = null; // catálogo propio (si null, usa DUA_PRESET)
    if(!c.diversity) c.diversity = {};     // sid:aid -> {cond:[], med:'', refCycle, note, measures:[]}
    if(!Array.isArray(c.units)) c.units = [];
    // migración adaptadas: el modelo viejo tenía tareas gemelas (adapted:true).
    // Las convertimos en adaptaciones por alumno sobre su tarea ordinaria hermana (mismo nombre sin "(Adaptado)").
    c.tasks.forEach(t=>{ if(!t.adaptations) t.adaptations = {}; });
    const oldAdapted = c.tasks.filter(t=>t.adapted);
    if(oldAdapted.length){
      oldAdapted.forEach(t=>{
        const baseName = t.name.replace(/\s*\(Adaptad[oa]\)\s*$/i,'').trim();
        const base = c.tasks.find(x=>!x.adapted && x.unitId===t.unitId && x.name.trim()===baseName)
                  || c.tasks.find(x=>!x.adapted && x.areaId===t.areaId && x.periodId===t.periodId && x.name.trim()===baseName);
        // ¿a qué alumnos iba dirigida?
        const targets = (Array.isArray(t.forStudents) && t.forStudents.length)
          ? t.forStudents
          : c.students.filter(s=>{ const d=c.diversity[dvkey(s.id,t.areaId)]; return d&&d.med&&medDef(d.med).cri; }).map(s=>s.id);
        if(base){
          targets.forEach(sid=>{
            base.adaptations[sid] = {refCycle: t.adaptCycle||c.cycle, criteria:(t.criteria||[]).slice(), instr: t.instr};
            // trasladar las notas puestas en la tarea gemela a la tarea base
            const gk = gkey(sid, t.id), bk = gkey(sid, base.id);
            if(c.grades[gk]!=null && c.grades[bk]==null){ c.grades[bk] = c.grades[gk]; delete c.grades[gk]; }
          });
        }
      });
      // eliminar las gemelas ya migradas
      const ids = oldAdapted.map(t=>t.id);
      c.tasks = c.tasks.filter(t=>!t.adapted);
      // limpiar flags/campos obsoletos
      c.tasks.forEach(t=>{ delete t.adapted; delete t.adaptCycle; delete t.forStudents; });
    }
    if(!c.critWeights) c.critWeights = {};  // aid:pid:code -> peso %
    // migración: tareas sin unidad -> se agrupan en una unidad "General" por área y periodo
    const orphan = c.tasks.filter(t=>!t.unitId);
    if(orphan.length){
      const seen = {};
      orphan.forEach(t=>{
        const key = t.areaId+'|'+t.periodId;
        if(!seen[key]){
          let u = c.units.find(x=>x.areaId===t.areaId && x.periodId===t.periodId && x.name==='General');
          if(!u){ u = {id:uid(), areaId:t.areaId, periodId:t.periodId, name:'General', desc:'Tareas creadas antes de organizar por unidades.'}; c.units.push(u); }
          seen[key] = u.id;
        }
        t.unitId = seen[key];
      });
    }
    /* asegurar un periodo inicial al principio en clases anteriores */
    if(!c.periods.some(p=>p.initial)){
      c.periods.unshift({id:uid(), name:'Evaluación inicial', initial:true});
    }
    if(c.minTutorias==null) c.minTutorias = 3;
    delete c.tools;
  });
}

function periodById(c, pid){ return c.periods.find(p=>p.id===pid) || null; }
function isInitialP(c, pid){ const p=periodById(c,pid); return !!(p && p.initial); }
function tasksOf(c, aid, pid){ return c.tasks.filter(t=>t.areaId===aid && t.periodId===pid); }
function gkey(s,t){ return s+':'+t; }
function taskById(c,id){ return c.tasks.find(t=>t.id===id)||null; }

/* ---------- cálculo ---------- */
function itemValue(instr, i, raw){
  if(instr.type==='points'){
    if(!Array.isArray(raw)) return null;
    const v = num(raw[i]);
    return v==null ? null : Math.max(0, Math.min(10, v/(instr.max||10)*10));
  }
  if(instr.type==='check') return Array.isArray(raw) ? (raw[i]?10:0) : null;
  if(!Array.isArray(raw)) return null;
  const j = raw[i];
  if(j==null || !instr.levels[j]) return null;
  return instr.levels[j].value;
}
/* ---------- peso de los ítems en porcentaje ----------
   El peso de cada ítem se guarda como porcentaje y entre todos deben sumar 100.
   Los instrumentos anteriores (pesos relativos 1, 2, 0,5…) se convierten una sola vez (ins.pct). */
function wRound(v){ return Math.round((Number(v)||0)*10)/10; }
function weightSum(ins){ return wRound((ins.items||[]).reduce((n,it)=>n+(Number(it.weight)||0),0)); }
function weightsOk(ins){ return !ins || ins.type==='num' || !(ins.items||[]).length || Math.abs(weightSum(ins)-100) < 0.05; }
function weightsEqual(ins){ const w = (ins.items||[]).map(it=>Number(it.weight)||0); return w.length>0 && Math.max(...w)-Math.min(...w) <= 1; }
function equalWeights(ins){
  const n = (ins.items||[]).length; if(!n) return;
  ins.items.forEach(it=>{ it.weight = 100/n; });      // exacto (33,33…): tres ítems iguales pesan de verdad lo mismo
}
/* ajusta a 100 conservando la proporción entre ítems */
function fixWeights(ins, exactly){
  const items = ins.items||[]; if(!items.length) return;
  const sum = items.reduce((n,it)=>n+(Number(it.weight)||0),0);
  if(!sum) return equalWeights(ins);
  if(exactly){   /* conversión automática: reescalado exacto, las notas no cambian */
    items.forEach(it=>{ const v = (Number(it.weight)||0)*100/sum; it.weight = Math.abs(v-Math.round(v))<1e-9 ? Math.round(v) : v; });
    return;
  }
  /* a petición del docente: valores limpios (un decimal como mucho); el resto va al ítem que más pesa */
  items.forEach(it=>{ it.weight = wRound((Number(it.weight)||0)*100/sum); });
  const diff = wRound(100 - items.reduce((n,it)=>n+it.weight,0));
  if(diff){ const big = items.reduce((a,b)=>b.weight>a.weight?b:a, items[0]); big.weight = wRound(big.weight+diff); }
}
function toPct(ins){
  if(!ins || ins.pct || ins.type==='num') return ins;
  const items = ins.items||[];
  if(items.length){
    const w = items.map(it=>it.weight==null?1:(Number(it.weight)||0));
    items.forEach((it,i)=>{ it.weight = w[i]; });
    if(w.every(x=>x===w[0])) equalWeights(ins); else fixWeights(ins, true);
  }
  ins.pct = true;
  return ins;
}
function allInstrs(fn){
  (state.templates||[]).forEach(fn);
  (state.courses||[]).forEach(c=>(c.tasks||[]).forEach(t=>{ if(t.instr) fn(t.instr);
    Object.keys(t.adaptations||{}).forEach(sid=>{ const a = t.adaptations[sid]; if(a && a.instr) fn(a.instr); }); }));
}
function weightBar(ins){
  const sum = weightSum(ins), ok = weightsOk(ins), d = wRound(100 - sum);
  const zeros = (ins.items||[]).filter(it=>!(Number(it.weight)>0)).length;
  const f = v=>String(v).replace('.',',');
  return `<div class="w-bar ${ok?'ok':'bad'}" id="wBar">
    <b>Pesos de los ítems: ${f(sum)} %</b>
    <span class="w-msg">${ok ? '✓ suman 100 %' + (zeros?` · ${zeros} ítem(s) con 0 % no cuentan para la nota`:'')
      : (d>0 ? `faltan ${f(d)} % para llegar a 100 %` : `sobran ${f(-d)} %: tienen que sumar 100 %`)}</span>
    <div class="spacer"></div>
    ${ok?'':`<button class="btn small" data-act="fixWeights" title="Mantiene la proporción entre ítems">Ajustar a 100 %</button>`}
    ${weightsEqual(ins)&&ok?'':`<button class="btn ghost small" data-act="eqWeights">Repartir por igual</button>`}
  </div>`;
}
function weightBarRefresh(ins){ const b = document.getElementById('wBar'); if(b) b.outerHTML = weightBar(ins); }
function itemPct(instr, i){
  const total = (instr.items||[]).reduce((n,it)=>n+(Number(it.weight)||0),0);
  if(!total) return 0;
  return Math.round(((Number(instr.items[i].weight)||0)/total)*1000)/10;
}
function taskScore(c, task, studentId){
  const raw = c.grades[gkey(studentId, task.id)];
  if(raw==null) return null;
  const ins = effInstr(c, task, studentId);
  if(!ins) return null;
  if(ins.type==='num'){ const v=num(raw); return v==null?null:(v/(ins.max||10))*10; }
  if(!Array.isArray(raw)) return null;
  let s=0, w=0;
  (ins.items||[]).forEach((it,i)=>{
    const v = itemValue(ins, i, raw);
    if(v==null) return;
    const wi = Number(it.weight)||1;
    s += v*wi; w += wi;
  });
  return w ? s/w : null;
}
/* nota efectiva de una tarea: el ajuste manual manda sobre lo calculado */
function taskFinal(c, task, studentId){
  const ov = c.overrides ? c.overrides[gkey(studentId, task.id)] : null;
  if(ov!=null && ov!=='') { const v = num(ov); if(v!=null) return v; }
  return taskScore(c, task, studentId);
}
function fkey(sid, aid, pid){ return sid+':'+aid+':'+pid; }
function areaFinal(c, studentId, aid, pid){
  const ov = c.finals ? c.finals[fkey(studentId, aid, pid)] : null;
  if(ov!=null && ov!=='') { const v = num(ov); if(v!=null) return v; }
  return areaFinalByCrit(c, studentId, aid, pid);   // media ponderada de criterios (LOMLOE)
}
function isAdjTask(c, sid, tid){ const v = c.overrides ? c.overrides[gkey(sid,tid)] : null; return v!=null && v!==''; }
function isAdjFinal(c, sid, aid, pid){ const v = c.finals ? c.finals[fkey(sid,aid,pid)] : null; return v!=null && v!==''; }
function countAdj(c, aid, pid){
  let n=0;
  c.students.forEach(s=>{
    if(isAdjFinal(c, s.id, aid, pid)) n++;
    tasksOf(c, aid, pid).forEach(t=>{ if(isAdjTask(c, s.id, t.id)) n++; });
  });
  return n;
}

/* ---------- adaptación por alumno (opción A) ----------
   Cada tarea puede llevar adaptations[studentId] = {refCycle, criteria:[], instr}.
   La tarea es una sola columna; el alumno con adaptación se califica con su variante. */
function taskAdaptFor(c, task, studentId){
  return (task.adaptations && task.adaptations[studentId]) ? task.adaptations[studentId] : null;
}
function isAdaptedFor(c, task, studentId){ return !!taskAdaptFor(c, task, studentId); }
/* instrumento efectivo del alumno en la tarea (su variante o el común) */
function effInstr(c, task, studentId){
  const a = taskAdaptFor(c, task, studentId);
  return (a && a.instr) ? a.instr : task.instr;
}
/* criterios efectivos del alumno en la tarea */
function effCriteria(c, task, studentId){
  const a = taskAdaptFor(c, task, studentId);
  return ((a && a.criteria) ? a.criteria : (task.criteria||[])).slice().sort(cmpCode);
}
/* ciclo efectivo del alumno en la tarea */
function effCycle(c, task, studentId){
  const a = taskAdaptFor(c, task, studentId);
  return (a && a.refCycle) ? a.refCycle : c.cycle;
}

/* toda tarea aplica a todo el alumnado (la adaptación va dentro de la celda) */
function taskApplies(c, task, studentId){ return true; }
function studentTasks(c, studentId, aid, pid){
  return tasksOf(c, aid, pid);
}
/* ¿esta tarea cuenta para las notas? Las de evaluación inicial no computan. */
function taskComputes(t){ return !t.isInitial && !t.informative; }
function areaScore(c, studentId, aid, pid){
  let s=0, w=0;
  studentTasks(c, studentId, aid, pid).forEach(t=>{
    if(!taskComputes(t)) return;   // la evaluación inicial no computa
    const v = taskFinal(c, t, studentId);
    if(v==null) return;
    const weight = Number(t.weight)||0;
    if(weight<=0) return;
    s += v*weight; w += weight;
  });
  return w? s/w : null;
}
function taskCycle(c, task){ return c.cycle; }
function taskCriteria(c, task){ return (task.criteria||[]).slice().sort(cmpCode); }

/* ---------- atención a la diversidad ---------- */
function duaCat(c){ return c.duaCatalog || DUA_PRESET; }
function dvkey(sid, aid){ return sid+':'+aid; }
function divOf(c, sid, aid){
  const k = dvkey(sid, aid);
  if(!c.diversity[k]) c.diversity[k] = {cond:[], med:'', refCycle:null, note:'', measures:[]};
  const d = c.diversity[k];
  if(!Array.isArray(d.cond)) d.cond=[];
  if(!Array.isArray(d.measures)) d.measures=[];
  return d;
}
/* c.sdiv[alumno] = {cond:[tipología], acts:[actuaciones específicas del alumno]} */
function stuDiv(c, sid){
  if(!c.sdiv || typeof c.sdiv!=='object') c.sdiv = {};
  if(!c.sdiv[sid]) c.sdiv[sid] = {cond:[], acts:[]};
  const d = c.sdiv[sid];
  if(!Array.isArray(d.cond)) d.cond = [];
  if(!Array.isArray(d.acts)) d.acts = [];
  return d;
}
function stuConds(c, sid){ return ((c.sdiv||{})[sid]||{}).cond || []; }
function stuActs(c, sid){ return ((c.sdiv||{})[sid]||{}).acts || []; }
/* pasa lo guardado con las etiquetas antiguas (por área) a la tipología de la norma (por alumno) */
function migrateDiv(){
  (state.courses||[]).forEach(c=>{
    Object.keys(c.diversity||{}).forEach(k=>{
      const d = c.diversity[k]; if(!d) return;
      if(d.med==='APO') d.med = 'PMO';
      if(Array.isArray(d.cond) && d.cond.length){
        const sd = stuDiv(c, k.split(':')[0]);
        sd.cond = normConds(sd.cond.concat(d.cond));
        d.cond = [];
      }
    });
    Object.keys(c.extDiv||{}).forEach(k=>{ if(c.extDiv[k]==='APO') c.extDiv[k] = 'PMO'; });
  });
}
function hasDiv(c, sid, aid){
  const k = dvkey(sid, aid); const d = c.diversity[k];
  return !!(stuConds(c, sid).length || stuActs(c, sid).length || (d && (d.med || (d.measures&&d.measures.length) || (d.note&&d.note.trim()))));
}
/* ciclo de referencia para evaluar a un alumno en un área:
   si tiene medida que cambia criterios y un ciclo fijado, ese; si no, el del curso */
function studentCycle(c, sid, aid){
  const d = c.diversity[dvkey(sid,aid)];
  if(d && d.refCycle && medDef(d.med).cri) return d.refCycle;
  return c.cycle;
}
function activeMeasures(c, sid, aid){
  const gen = (c.dua[aid]||[]).map(id=>({scope:'grupo', text:duaItemText(c, id)}));
  const own = (divOf(c, sid, aid).measures||[]).map(t=>({scope:'individual', text:t}));
  return gen.concat(own);
}
function duaItemText(c, id){
  const cat = duaCat(c);
  const parts = id.split('::');
  const block = cat[parts[0]];
  if(!block) return id;
  const idx = Number(parts[1]);
  return block.items[idx] || id;
}
function critScore(c, studentId, aid, pid, code){
  let s=0, n=0;
  studentTasks(c, studentId, aid, pid).forEach(t=>{
    if(!taskComputes(t)) return;   // la evaluación inicial no computa
    const crits = effCriteria(c, t, studentId);
    if(crits.indexOf(code)===-1) return;
    const ins = effInstr(c, t, studentId); if(!ins) return;
    const raw = c.grades[gkey(studentId, t.id)];
    const linked = (ins.items||[]).map((it,i)=>({it:it,i:i})).filter(x=>itemCrits(x.it).indexOf(code)>-1);
    if(linked.length){
      let ls=0, lw=0;
      linked.forEach(x=>{ const v=itemValue(ins, x.i, raw); if(v!=null){ const wi=Number(x.it.weight)||1; ls+=v*wi; lw+=wi; } });
      if(lw){ s += ls/lw; n++; }
      return;
    }
    const v = taskFinal(c, t, studentId);
    if(v!=null){ s+=v; n++; }
  });
  return n? s/n : null;
}
/* criterios trabajados en un periodo. Para un alumno, usa sus criterios efectivos
   (un ACS con adaptación puede evaluar criterios de otro ciclo). */
function critsWorked(c, aid, pid, studentId){
  const set = {};
  const tasks = tasksOf(c, aid, pid).filter(t=>!t.informative);
  tasks.forEach(t=>{
    const crits = studentId!=null ? effCriteria(c, t, studentId) : (t.criteria||[]);
    crits.forEach(cd=>{ set[cd]=1; });
    // incluir también criterios de adaptaciones cuando se pide la vista global (studentId null)
    if(studentId==null && t.adaptations){
      Object.keys(t.adaptations).forEach(sid=>{ (t.adaptations[sid].criteria||[]).forEach(cd=>{ set[cd]=1; }); });
    }
  });
  return Object.keys(set).sort(cmpCode);
}
/* criterios trabajados dentro de una unidad concreta */
function critsWorkedUnit(c, unitId){
  const set = {};
  tasksOfUnit(c, unitId).forEach(t=>{
    (t.criteria||[]).forEach(cd=>{ set[cd]=1; });
    if(t.adaptations) Object.keys(t.adaptations).forEach(sid=>{ (t.adaptations[sid].criteria||[]).forEach(cd=>{ set[cd]=1; }); });
  });
  return Object.keys(set).sort(cmpCode);
}
function critWeight(c, aid, pid, code){
  const w = c.critWeights[aid+':'+pid+':'+code];
  return (w==null || w==='') ? null : Number(w);
}
/* ¿hay algún peso fijado a mano para este área/periodo? */
function hasCustomWeights(c, aid, pid){
  return critsWorked(c, aid, pid, null).some(cd=>critWeight(c, aid, pid, cd)!=null);
}
/* peso efectivo que se muestra en la tabla:
   - si el profe fijó pesos, el suyo (los no fijados quedan a 0 visible)
   - si nadie los tocó, reparto equitativo redondeado (25/25/25/25…) */
function critWeightPct(c, aid, pid, code){
  const codes = critsWorked(c, aid, pid, null);
  if(hasCustomWeights(c, aid, pid)){
    const w = critWeight(c, aid, pid, code);
    return w==null ? 0 : w;
  }
  // equitativo: reparte 100 y ajusta el resto en los primeros para que sume 100
  const n = codes.length; if(!n) return 0;
  const base = Math.floor(100/n), rem = 100 - base*n;
  const idx = codes.indexOf(code);
  return base + (idx < rem ? 1 : 0);
}
/* nota final del trimestre = media ponderada de los criterios trabajados.
   Si no se han fijado pesos, todos pesan igual (media simple). */
function areaFinalByCrit(c, studentId, aid, pid){
  const codes = critsWorked(c, aid, pid, studentId);
  if(!codes.length) return null;
  let s=0, w=0, anyGraded=false;
  codes.forEach(code=>{
    const v = critScore(c, studentId, aid, pid, code);
    if(v==null) return;
    anyGraded=true;
    const wc = critWeight(c, aid, pid, code);
    const weight = (wc==null) ? 1 : wc;
    if(weight<=0) return;
    s += v*weight; w += weight;
  });
  if(!anyGraded) return null;
  return w? s/w : null;
}
/* nota media de una unidad (informativa): media simple de las notas de tarea del alumno en esa unidad */
function unitScore(c, studentId, unitId){
  let s=0, w=0;
  tasksOfUnit(c, unitId).forEach(t=>{
    if(!taskApplies(c, t, studentId)) return;
    const v = taskFinal(c, t, studentId);
    if(v==null) return;
    const weight = Number(t.weight)||0;
    if(weight<=0){ return; }
    s += v*weight; w += weight;
  });
  return w? s/w : null;
}
function totalWeight(c, aid, pid){
  return tasksOf(c, aid, pid).filter(t=>!t.adapted).reduce((n,t)=>n+(Number(t.weight)||0),0);
}
function adaptedWeight(c, aid, pid){
  return tasksOf(c, aid, pid).filter(t=>t.adapted).reduce((n,t)=>n+(Number(t.weight)||0),0);
}
/* reparto adaptado desglosado por alumno destinatario, cuando conviene comprobarlo por separado */
function adaptedWeightByStudent(c, aid, pid){
  const out = {};
  c.students.forEach(s=>{
    const d = c.diversity[dvkey(s.id, aid)];
    if(!(d && d.med && medDef(d.med).cri)) return;
    let w = 0;
    tasksOf(c, aid, pid).forEach(t=>{ if(t.adapted && taskApplies(c, t, s.id)) w += Number(t.weight)||0; });
    out[s.id] = {name:s.name, med:medDef(d.med).code, w:w};
  });
  return out;
}

   state.teacherTT  = {'slotId|dow': {courseId, areaId, label}}   (mi horario, dow 0=lunes)
   course.timetable = {'slotId|dow': {subject, teacher}}           (horario del aula)

  if(!c.timetable) c.timetable = {};
  const key = ttKey(slotId, dow);
  const cur = c.timetable[key] || {subject:'', teacher:''};
  const inner = `<h3>Horario de aula · ${esc(c.name)}</h3>
    <p class="sub">${DAY_NAMES[dow]} · ${sl.from}–${sl.to} · se repite todas las semanas</p>
    <label class="field"><span>Materia</span>
      <input class="inp" name="subject" list="ttSubjList" value="${esc(cur.subject)}" placeholder="p. ej. Matemáticas"></label>
    <datalist id="ttSubjList">${TT_SUBJECTS.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>
    ${field('Profesor/a (opcional)','teacher',{value:cur.teacher, placeholder:'p. ej. Marta'})}
    <label class="field" style="display:flex;align-items:center;gap:8px"><input type="checkbox" name="allweek"> <span style="margin:0">Poner lo mismo toda la semana a esta hora (L–V)</span></label>`;
  const wrap = openModal(inner, v=>{
    const days = v.allweek ? TT_DAYS : [dow];
    days.forEach(d=>{
      const own = ttEntry(slotId, d);
      if(own && own.courseId===c.id) return;   // no pisa tus franjas
      const k = ttKey(slotId, d);
      if(!v.subject) delete c.timetable[k];
      else c.timetable[k] = {subject:v.subject, teacher:v.teacher||''};
    });
  }, 'Guardar');
  if(c.timetable[key]){
    const row = wrap.querySelector('.modal > .row');
    const del = document.createElement('button');
    del.className = 'btn danger'; del.textContent = 'Vaciar franja';
    del.addEventListener('click', ev=>{ ev.preventDefault(); delete c.timetable[key]; save(); wrap.remove(); render(); });
    row.insertBefore(del, row.children[1]);
  }
}

/* ---------- copiar / pegar sesiones ----------
   Portapapeles en memoria (no se sincroniza). Mientras hay una sesión copiada,
   tocar un hueco de la agenda la pega allí; la clase y el área se toman del
   horario de esa franja si lo hay (p. ej. copiar de 6ºA y pegar en la de 6ºB). */
let sessClip = null;
function copySession(iso, slotId){
  const s = state.sessions[skey(iso, slotId)]; if(!s) return;
  sessClip = {title:s.title||'', parts:sessionParts(s), files:(s.files||[]).slice(), courseId:s.courseId||'', areaId:s.areaId||'', from:iso, slot:slotId};
  render();
}
function pasteSession(iso, slotId, force){
  if(!sessClip) return;
  const key = skey(iso, slotId);
  if(iso===sessClip.from && slotId===sessClip.slot) return;
  if(state.sessions[key] && !force){
    openModal(`<h3>Este hueco ya tiene una sesión</h3>
      <p class="sub" style="margin:0">«${esc(state.sessions[key].title||'(sin título)')}». ¿Quieres sustituirla por la copiada?</p>`,
      ()=>pasteSession(iso, slotId, true), 'Sustituir');
    return;
  }
  const tt = ttAt(iso, slotId);
  const useTT = tt && tt.courseId;
  state.sessions[key] = {
    title: sessClip.title,
    parts: JSON.parse(JSON.stringify(sessClip.parts)),
    files: JSON.parse(JSON.stringify(sessClip.files||[])),
    courseId: useTT ? tt.courseId : sessClip.courseId,
    areaId: useTT ? (tt.areaId || (state.courses.find(c=>c.id===tt.courseId)||{areas:[]}).areas.find(a=>a===sessClip.areaId) || '') : sessClip.areaId
  };
  save(); render();
}
function clipBar(){
  if(!sessClip) return '';
  const lbl = sessClip.courseId ? courseName(sessClip.courseId)+' · ' : '';
  return `<div class="clip-bar">
    <span class="clip-ic">⧉</span>
    <span class="clip-txt"><b>Sesión copiada:</b> ${esc(lbl)}${esc(sessClip.title||'(sin título)')}<small>Toca un hueco de la agenda para pegarla. Puedes pegarla en varios.</small></span>
    <button class="btn small" data-act="clipDone">Terminar</button>
  </div>`;
}

function planView(){

function holidayOf(iso){ return (state.holidays||{})[iso] != null ? ((state.holidays||{})[iso] || 'No lectivo') : null; }
function holidaysModal(preIso){
  const list = ()=>{
    const ks = Object.keys(state.holidays||{}).sort();
    if(!ks.length) return '<p class="hint" style="margin:0">Aún no hay días no lectivos.</p>';
    /* agrupa días seguidos con el mismo motivo: «23/12 – 7/1 · Navidad» */
    const groups = []; ks.forEach(k=>{
      const g = groups[groups.length-1], lbl = state.holidays[k]||'';
      if(g && g.label===lbl && addDays(g.to,1)===k){ g.to = k; g.keys.push(k); }
      else if(g && g.label===lbl && dowMon(addDays(g.to,1))>4 && (addDays(g.to,3)===k || addDays(g.to,2)===k) && dowMon(k)===0){ g.to = k; g.keys.push(k); }
      else groups.push({from:k, to:k, label:lbl, keys:[k]});
    });

      <button type="button" class="btn small" id="holAdd">Añadir</button>
    </div>
    <p class="sub" style="margin:4px 0 12px">En un periodo (por ejemplo, Navidad) se marcan solo los días de lunes a viernes.</p>
    <div id="holList">${list()}</div>`;
  const wrap = openModal(inner, null);
  wrap.querySelector('[data-close]').textContent = 'Hecho';
  wrap.addEventListener('click', e=>{
    const del = e.target.closest('[data-holdel]');
    if(del){ e.preventDefault(); del.dataset.holdel.split(',').forEach(k=>{ delete state.holidays[k]; }); save(); render(); wrap.querySelector('#holList').innerHTML = list(); return; }
    if(e.target.id==='holAdd'){
      e.preventDefault();

    }
  });

function dtRow(cc, t, iso){

/* ---------- enlace tareas ↔ agenda ----------
   t.dates = [{d:'YYYY-MM-DD', t:'HH:MM'}, ...]   (t vacío = sin hora concreta)
   Se admite el formato antiguo (cadena suelta o t.date) y se normaliza al vuelo. */
function dateEntries(t){
  if(Array.isArray(t.dates))
    return t.dates.map(x => typeof x === 'string' ? {d:x, t:''} : {d:x.d, t:x.t||''}).filter(x=>x.d);
  if(t.date) return [{d:t.date, t:''}];
  return [];
}
function taskDates(t){ return dateEntries(t).map(x=>x.d); }         // solo los días
function setTaskDates(t, arr){
  t.dates = (arr||[]).filter(x=>x && x.d)
    .map(x=>({d:x.d, t:x.t||''}))
    .sort((a,b)=> a.d===b.d ? (a.t||'').localeCompare(b.t||'') : a.d.localeCompare(b.d));
  delete t.date;
}
function tasksOnDate(iso){
  const out = [];
  (state.courses||[]).forEach(c=>{
    (c.tasks||[]).forEach(t=>{
      dateEntries(t).forEach(e=>{ if(e.d===iso) out.push({course:c, task:t, time:e.t}); });
    });
  });
  return out.sort((a,b)=>(a.time||'~').localeCompare(b.time||'~'));
}
/* tareas ancladas a una franja horaria concreta de un día */
function tasksInSlot(iso, sl){
  return tasksOnDate(iso).filter(x=> x.time && x.time>=sl.from && x.time<sl.to );
}
/* tareas de ese día sin hora asignada */
function tasksNoTime(iso){ return tasksOnDate(iso).filter(x=>!x.time); }

function datesLabel(t){
  const es = dateEntries(t);
  if(!es.length) return '';
  if(es.length===1) return fmtDate(es[0].d) + (es[0].t? ' · '+es[0].t : '');
  return es.length + ' fechas';
}
function dateEntryLabel(e){ return fmtDate(e.d) + (e.t? ' · '+e.t : ''); }

function planMonth(){
  const dt = parseDate(state.planDate);
  const first = new Date(dt.getFullYear(), dt.getMonth(), 1);
  const startISO = weekStart(toISO(first));
  const tod = today();
  const cells = Array.from({length:42},(_,i)=>addDays(startISO,i));
  const monthIdx = dt.getMonth();
  return `<div class="mo">
    <div class="mo-head">${DAY_SHORT.map(d=>`<div>${d}</div>`).join('')}</div>
    <div class="mo-grid">
      ${cells.map(iso=>{
        const d = parseDate(iso), inMonth = d.getMonth()===monthIdx, wknd = dowMon(iso)>4;
        const daySessions = classSlots().map(sl=>state.sessions[skey(iso, sl.id)]).filter(Boolean);
        const evalT = tasksOnDate(iso);
        const hol = wknd ? null : holidayOf(iso);
        return `<div class="mo-cell ${inMonth?'':'off'} ${wknd?'wknd':''} ${hol?'is-hol':''} ${iso===tod?'is-today':''}" data-act="planGoDay" data-iso="${iso}">
          <div class="mo-num">${d.getDate()}</div>${hol?`<div class="mo-hol">⛱ ${esc(hol)}</div>`:''}

          ${daySessions.slice(0,evalT.length?2:3).map(s=>`<div class="mo-dot" style="border-left:3px solid ${sessionColor(s)}">${esc((s.title||'').slice(0,22))}</div>`).join('')}
          ${daySessions.length>(evalT.length?2:3)? `<div class="mo-more">+${daySessions.length-(evalT.length?2:3)} más</div>`:''}
        </div>`;
      }).join('')}
    </div>
    <p class="hint" style="margin-top:10px">Vista de recordatorio: cada día muestra qué tareas hay planificadas. Toca un día para verlo en detalle.</p>
  </div>`;
}

/* ================= DISPOSICIÓN EN EL AULA ================= */
/* Modelo: c.layout = { items:[{id,kind,x,y,studentId?}] }
   kinds: desk (mesa alumno), teacher, board-digital, board-chalk, window, door */
/* El aula es una rejilla de casillas. Cada casilla = una mesa de alumno.
   Posiciones (x,y) e índices de celda; tamaños (cw,ch) en nº de casillas. */
const GRID_COLS = 12, GRID_ROWS = 9;
const ELEM_DEFS = {
  teacher:        {cw:2, ch:1, label:'Mesa del profesor', cls:'el-teacher', rot:false},
  'board-digital':{cw:2, ch:1, label:'Pizarra digital',   cls:'el-boardd',  rot:false, flat:true},
  'board-chalk':  {cw:2, ch:1, label:'Pizarra de tiza',   cls:'el-boardc',  rot:false, flat:true},
  window:         {cw:2, ch:1, label:'Ventana',           cls:'el-window',  rot:true,  flat:true},
  door:           {cw:1, ch:1, label:'Puerta',            cls:'el-door',    rot:true,  flat:true}
};
function elemDims(it){
  const def = it.kind==='desk' ? {cw:1,ch:1} : (ELEM_DEFS[it.kind]||{cw:1,ch:1});
  // si está girado 90/270, intercambia ancho y alto (en casillas)
  return (it.rot===90||it.rot===270) ? {cw:def.ch, ch:def.cw} : {cw:def.cw, ch:def.ch};
}

function layoutOf(c){
  if(!c.layout || !Array.isArray(c.layout.items)) c.layout = {items:[]};
  return c.layout;
}
/* asegura que cada alumno tenga su mesa; retira mesas de alumnos borrados */
function syncDesks(c){
  const L = layoutOf(c);
  const ids = c.students.map(s=>s.id);
  L.items = L.items.filter(it=> it.kind!=='desk' || ids.indexOf(it.studentId)>-1 );
  return L;
}

function viewAula(){

    <p class="hint">Elige una distribución de partida y luego arrastra las mesas y los elementos donde quieras. Se guarda solo.</p>

    <div class="aula-tools">

        <button class="btn ghost small" data-act="aulaLayout" data-d="pairs">En parejas</button>

      <div class="at-group">
        <span class="at-lbl">Añadir elemento</span>
        <button class="btn ghost small" data-act="aulaAdd" data-k="teacher">+ Mesa profesor</button>

        <button class="btn ghost small" data-act="aulaAdd" data-k="board-chalk">+ Pizarra tiza</button>
        <button class="btn ghost small" data-act="aulaAdd" data-k="window">+ Ventana</button>
        <button class="btn ghost small" data-act="aulaAdd" data-k="door">+ Puerta</button>
      </div>
      <div class="at-group">
        <button class="btn ghost small danger" data-act="aulaClear">Vaciar aula</button>
      </div>
    </div>

    ${pending.length? `<div class="aula-pending">
      <span class="hint" style="margin:0">Sin colocar (arrástralos o usa una distribución): </span>
      ${pending.map(s=>`<span class="ap-chip">${esc(shortName(s.name))}</span>`).join('')}
    </div>`:''}

    <div class="aula-stage-wrap">
      <div class="aula-stage" id="aulaStage" style="aspect-ratio:${GRID_COLS}/${GRID_ROWS};--cols:${GRID_COLS};--rows:${GRID_ROWS}">
        <div class="aula-front">Frente de la clase</div>
        ${L.items.map(it=>aulaItemHtml(c, it)).join('')}
      </div>
    </div>
    <p class="hint" style="margin-top:8px">Cada casilla es una mesa. Arrastra para recolocar; las mesas se ajustan solas a la cuadrícula. En ventanas y puertas, el botón ⟳ las gira para ponerlas en los laterales.</p>
  </div>`;
}

function shortName(name){
  // "Apellido Apellido, Nombre" -> "Nombre A."
  const parts = name.split(',');
  if(parts.length===2){
    const nombre = parts[1].trim().split(' ')[0];
    const ape = parts[0].trim().split(' ')[0];
    return nombre + ' ' + ape.charAt(0) + '.';
  }
  return name.split(' ').slice(0,2).join(' ');
}

/* estilo de posición/tamaño en % del grid */
function cellStyle(it){
  const d = elemDims(it);
  const x = Math.max(0, Math.min(GRID_COLS-d.cw, it.x||0));
  const y = Math.max(0, Math.min(GRID_ROWS-d.ch, it.y||0));
  return `left:${x/GRID_COLS*100}%;top:${y/GRID_ROWS*100}%;width:${d.cw/GRID_COLS*100}%;height:${d.ch/GRID_ROWS*100}%`;
}

function aulaItemHtml(c, it){
  if(it.kind==='desk'){
    const s = c.students.find(x=>x.id===it.studentId); if(!s) return '';
    const aid = areaId();
    const dv = c.diversity[dvkey(s.id, aid)];
    const med = dv && dv.med ? medDef(dv.med) : null;
    const num = c.students.indexOf(s)+1;
    return `<div class="aula-item desk" data-id="${it.id}" style="${cellStyle(it)}">
      <span class="dk-num">${num}</span>
      <span class="dk-name">${esc(shortName(s.name))}</span>
      ${med?`<span class="dk-med" style="background:${med.cri?'#FCF1D8':'var(--accent-soft)'};color:${med.cri?'#8A6206':'var(--accent)'}">${med.code}</span>`:''}
    </div>`;
  }
  const def = ELEM_DEFS[it.kind]; if(!def) return '';
  const vert = (it.rot===90||it.rot===270);
  return `<div class="aula-item ${def.cls}${def.flat?' flat':''}${vert?' vert':''}" data-id="${it.id}" style="${cellStyle(it)}">
    <span class="el-label">${def.label}</span>
    ${def.rot?`<button class="el-rot" data-act="aulaRot" data-id="${it.id}" title="Girar">⟳</button>`:''}
    <button class="el-del" data-act="aulaDel" data-id="${it.id}" title="Quitar">✕</button>
  </div>`;
}

/* ---- distribuciones automáticas ---- */
function aulaDistribute(mode){
  const c = course();
  const L = layoutOf(c);
  const others = L.items.filter(it=>it.kind!=='desk');
  const students = c.students.slice();
  const n = students.length;
  const desks = [];
  const startRow = 1;              // fila 0 reservada para profesor/pizarra
  const place = (s, cx, cy)=> desks.push({id:uid(), kind:'desk', studentId:s.id, x:cx, y:cy});

  if(mode==='single'){
    // todas separadas: una mesa sí, una casilla no (columnas alternas)
    const step = 2;                                   // mesa + hueco
    const perRow = Math.floor((GRID_COLS+1)/step);    // ~6 con 12 columnas
    students.forEach((s,i)=>{
      const r = Math.floor(i/perRow), col = i%perRow;
      place(s, col*step, startRow + r*2);             // fila sí, fila no
    });
  }
  else if(mode==='pairs'){
    // pares juntos (2 casillas contiguas) con 1 casilla de hueco entre pares
    // patrón por fila: [0,1] _ [3,4] _ [6,7] _ [9,10]  -> 4 pares/fila si caben
    const cols = [];
    for(let x=0; x+1<GRID_COLS; x+=3){ cols.push(x); cols.push(x+1); }
    const perRow = cols.length;                        // 8 con 12 columnas (4 pares)
    students.forEach((s,i)=>{
      const r = Math.floor(i/perRow), idx = i%perRow;
      place(s, cols[idx], startRow + r*2);
    });
  }
  else if(mode==='groups'){
    // grupos de 4 (2x2). Bloques de 2 col x 2 filas con 1 col de separación
    const gCols = [];
    for(let x=0; x+1<GRID_COLS; x+=3){ gCols.push(x); }   // inicios de grupo: 0,3,6,9
    const groupsPerRow = gCols.length;                    // 4
    students.forEach((s,i)=>{
      const g = Math.floor(i/4), inG = i%4;
      const gr = Math.floor(g/groupsPerRow), gc = g%groupsPerRow;
      const gx = gCols[gc], gy = startRow + gr*3;          // 2 filas de grupo + 1 hueco
      place(s, gx + (inG%2), gy + Math.floor(inG/2));
    });
  }
  L.items = others.concat(desks);
  if(!others.some(it=>it.kind==='teacher')) L.items.push({id:uid(), kind:'teacher', x:GRID_COLS-2, y:0});
  save(); render();
}

/* ---------- ficha individual del alumno ---------- */
/* notas de un alumno en todas las áreas y periodos (para su ficha y su informe) */
function studentOverview(c, sid){
  return c.areas.map(a=>{
    const cells = c.periods.map(p=>{
      if(p.initial){ const v = initMean(c, sid, a); return {p:p, v:v, ini:true, n:v==null?0:1}; }
      const ts = studentTasks(c, sid, a, p.id);
      const n = ts.filter(t=>taskFinal(c, t, sid)!=null).length;
      const v = n || isAdjFinal(c, sid, a, p.id) ? areaFinal(c, sid, a, p.id) : null;
      return {p:p, v:v, ini:false, n:n, total:ts.length};
    });
    return {aid:a, cells:cells, any:cells.some(x=>x.v!=null)};
  });
}
/* fecha de referencia de una tarea para ordenarla en el tiempo */
function taskWhen(c, t){
  const d = taskDates(t)[0]; if(d) return d;
  const pi = c.periods.findIndex(p=>p.id===t.periodId);
  return '9999-'+String(pi).padStart(2,'0')+'-'+String(c.tasks.indexOf(t)).padStart(4,'0');
}
function evolutionCard(c, s){
  const aid = areaId();
  const ts = c.tasks.filter(t=>t.areaId===aid && !t.isInitial && !t.informative && !isInitialP(c, t.periodId))
    .map(t=>({t:t, v:taskFinal(c, t, s.id), m:taskClassMean(c, t), w:taskWhen(c, t)})).filter(x=>x.v!=null)
    .sort((a,b)=>a.w.localeCompare(b.w));
  const per = c.periods.filter(p=>!p.initial);
  const areasWith = c.areas.filter(a=>per.some(p=>areaFinal(c, s.id, a, p.id)!=null));
  if(!ts.length && !areasWith.length) return '';
  const W = 640, H = 220, L = 34, R = 14, T = 22, B = 28;
  const y = v=>T + (H-T-B)*(1 - v/10);
  const grid = [0,2.5,5,7.5,10].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#E6EBE7" stroke-width="1"/>
      <text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="#6B7A72">${String(v).replace('.',',')}</text>`).join('');
  const pass = `<line x1="${L}" x2="${W-R}" y1="${y(c.pass)}" y2="${y(c.pass)}" stroke="#B4232C" stroke-width="1" stroke-dasharray="4 4" opacity=".55"/>
      <text x="${L+4}" y="${y(c.pass)+13}" font-size="10.5" fill="#8A3A3F">aprobado</text>`;
  let chart1 = '';
  if(ts.length){
    const col = areaColor(aid);
    const x = i=> ts.length===1 ? (L+W-R)/2 : L+10 + (W-R-L-20)*i/(ts.length-1);
    /* separadores de evaluación */
    let seps = '', lastP = null;
    ts.forEach((d,i)=>{ if(d.t.periodId!==lastP){ const pn = (c.periods.find(p=>p.id===d.t.periodId)||{}).name||'';
        const xx = i===0 ? L : (x(i-1)+x(i))/2;
        seps += `${i?`<line x1="${xx}" x2="${xx}" y1="${T-8}" y2="${H-B}" stroke="#C9D2CB" stroke-width="1"/>`:''}<text x="${xx+4}" y="${T-8}" font-size="10.5" fill="#6B7A72">${esc(pn)}</text>`;
        lastP = d.t.periodId; } });
    const path = ts.map((d,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(d.v).toFixed(1)}`).join(' ');
    const pts = ts.map((d,i)=>`<g class="ev-pt"><circle cx="${x(i).toFixed(1)}" cy="${y(d.v).toFixed(1)}" r="12" fill="transparent"/>
        <circle cx="${x(i).toFixed(1)}" cy="${y(d.v).toFixed(1)}" r="4.5" fill="${col}" stroke="#fff" stroke-width="2"/>
        <title>${esc(d.t.name)} · ${fmt2(d.v)} · media de la clase ${fmt2(d.m)}${taskDates(d.t)[0]?' · '+fmtDate(taskDates(d.t)[0]):''}</title></g>`).join('');
    const mpath = ts.map((d,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(d.m).toFixed(1)}`).join(' ');
    const lastI = ts.length-1;
    chart1 = `<div class="ev-scroll"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Evolución de las notas de las tareas">${grid}${pass}${seps}
      <path d="${mpath}" fill="none" stroke="#8C9892" stroke-width="1.5" stroke-dasharray="4 3"/>
      <path d="${path}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${pts}
      <text x="${Math.min(x(lastI)+8, W-R-30)}" y="${y(ts[lastI].v)-8}" font-size="11.5" font-weight="600" fill="#16241F">${fmt2(ts[lastI].v)}</text>
      <text x="${L}" y="${H-8}" font-size="10.5" fill="#6B7A72">${ts.length} tarea(s) calificada(s), en orden de fecha</text></svg></div>`;
  }
  let chart2 = '';
  if(areasWith.length && per.length){
    const x = i=> per.length===1 ? (L+W-R)/2 : L+40 + (W-R-L-80)*i/(per.length-1);
    const xl = per.map((p,i)=>`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="#6B7A72">${esc(p.name)}</text>`).join('');
    const lines = areasWith.map(a=>{
      const col = areaColor(a);
      const vs = per.map(p=>areaFinal(c, s.id, a, p.id));
      let d = '', started = false;
      vs.forEach((v,i)=>{ if(v==null){ started=false; return; } d += `${started?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)} `; started = true; });
      return `<path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>` +
        vs.map((v,i)=>v==null?'':`<g><circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="12" fill="transparent"/><circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="4.5" fill="${col}" stroke="#fff" stroke-width="2"/><title>${esc(areaDef(a).short||areaDef(a).name)} · ${esc(per[i].name)} · ${fmt(v)}</title></g>`).join('');
    }).join('');
    chart2 = `<div class="ev-scroll"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Nota de cada área por evaluación">${grid}${pass}${xl}${lines}</svg></div>
      ${areasWith.length>1?`<div class="ev-legend">${areasWith.map(a=>`<span><i style="background:${areaColor(a)}"></i>${esc(areaDef(a).short||areaDef(a).name)}</span>`).join('')}</div>`:''}`;
  }
  return `<div class="card ev-card">
    <h2 class="sec-title">Evolución</h2>
    ${chart1?`<p class="hint" style="margin:0 0 4px">${esc(areaDef(aid).short||areaDef(aid).name)} · nota de cada tarea a lo largo del curso. Pasa por encima de un punto para ver la tarea.</p>${chart1}
      <div class="ev-legend"><span><i style="background:${areaColor(aid)}"></i>${esc(s.name.split(',').pop().trim())}</span><span><i class="dash"></i>Media de la clase (solo la ves tú: no sale en la ficha para tutoría)</span></div>`:`<p class="hint">Aún no hay tareas calificadas en ${esc(areaDef(aid).short||areaDef(aid).name)}.</p>`}
    ${chart2?`<p class="hint" style="margin:14px 0 4px">Nota de ${areasWith.length>1?'cada área':esc(areaDef(areasWith[0]).short||areaDef(areasWith[0]).name)} por evaluación</p>${chart2}`:''}
  </div>`;
}
/* ---------- áreas de otros docentes: la nota se escribe a mano ----------
   c.extAreas  = [{id, name, teacher}]
   c.extGrades = {'alumno:area:periodo': '7.5' | 'NT'}   (no entra en ningún cálculo) */
function extAreas(c){ return Array.isArray(c.extAreas) ? c.extAreas : []; }
function xkey(sid, eid, pid){ return sid+':'+eid+':'+pid; }
function extGet(c, sid, eid, pid){
  const raw = (c.extGrades||{})[xkey(sid, eid, pid)];
  if(raw==null || raw==='') return null;
  if(/^\d+([.,]\d+)?$/.test(String(raw))) return {v:num(raw), code:null, isNum:true};
  const k = c.scale.find(x=>x.code===String(raw).toUpperCase());
  return k ? {v:k.ref, code:k.code, isNum:false} : null;
}
/* acepta un número de 0 a 10 o una calificación de la escala (IN, SU, BI, NT, SB) */
function extSet(c, sid, eid, pid, txt){
  if(!c.extGrades || typeof c.extGrades!=='object') c.extGrades = {};
  const k = xkey(sid, eid, pid), t = String(txt||'').trim();
  if(!t){ delete c.extGrades[k]; return true; }
  if(/^\d+([.,]\d+)?$/.test(t)){ const n = num(t); if(n<0 || n>10) return false; c.extGrades[k] = String(n); return true; }
  const sc = c.scale.find(x=>x.code===t.toUpperCase());
  if(sc){ c.extGrades[k] = sc.code; return true; }
  return false;
}
function extText(g){ return !g ? '' : (g.isNum ? fmt(g.v) : g.code); }
function extPill(c, g){
  if(!g) return '';
  const k = g.isNum ? calif(g.v, c.scale) : c.scale.find(x=>x.code===g.code);
  return k ? `<span class="pill ${k.code}" title="${esc(k.name)}">${k.code}</span>` : '';
}
function extClassMean(c, eid, pid){
  const vs = c.students.map(s=>extGet(c, s.id, eid, pid)).filter(g=>g && g.isNum).map(g=>g.v);
  return vs.length ? vs.reduce((a,b)=>a+b,0)/vs.length : null;
}
function extInput(c, sid, e, p){
  const g = extGet(c, sid, e.id, p.id);
  return `<span class="ext-cell"><input class="ext-inp ${g&&g.v<c.pass?'low':''}" data-act="extGrade" data-s="${sid}" data-e="${e.id}" data-p="${p.id}"
    value="${esc(extText(g))}" placeholder="–" autocomplete="off" aria-label="${esc(e.name)} · ${esc(p.name)}"><span class="ext-pill">${extPill(c, g)}</span></span>`;
}
function extMed(c, sid, eid){ const k = (c.extDiv||{})[sid+':'+eid]; return k ? medDef(k) : null; }
function extMedTag(c, sid, eid){ const m = extMed(c, sid, eid);
  return m ? `<span class="tag ${m.sig?'warn':'grey'}" title="${esc(m.name)} (otro docente)">${esc(m.code)}</span>` : ''; }
function extMedsOf(c, sid){ return extAreas(c).map(e=>({e:e, m:extMed(c, sid, e.id)})).filter(x=>x.m); }
function extAreasModal(){
  const c = course(); if(!c) return;
  let rows = extAreas(c).map(e=>Object.assign({}, e));
  if(!rows.length) rows = [{id:uid(), name:'Matemáticas', teacher:''}, {id:uid(), name:'Lengua Castellana', teacher:''}];
  const own = c.areas.map(a=>areaDef(a).name);
  const draw = ()=>`<div class="mke-list">${rows.map((r,i)=>`<div class="mke-row">
      <input class="inp" style="flex:1.4" list="extSubj" data-xn="${i}" value="${esc(r.name)}" placeholder="Área (p. ej. Matemáticas)">
      <input class="inp" style="flex:1" data-xt="${i}" value="${esc(r.teacher||'')}" placeholder="Docente (opcional)">
      <button type="button" class="icon" data-xdel="${i}" title="Quitar esta área">✕</button></div>`).join('')}</div>

    <div id="extBody">${draw()}</div>
    <p class="sub" style="margin:12px 0 0">Si quitas un área, se borran las notas que tuviera anotadas.</p>`, ()=>{

  const body = wrap.querySelector('#extBody');

    ${overviewCard(c, s)}
    ${evolutionCard(c, s)}
    ${(()=>{ const tot = {}; list.forEach(t=>marksCount(c, s.id, t.id).forEach(x=>{ tot[x.m.id] = (tot[x.m.id]||0) + x.n; }));
      const ms = markDefs().filter(m=>tot[m.id]);

    <div class="row" style="margin:14px 0 6px"><h2 class="sec-title">Tareas evaluadas · ${esc(areaDef(aid).short||areaDef(aid).name)} · ${esc(p.name)}</h2></div>

/* ---------- tareas ---------- */
/* ---------- duplicar unidades y tareas en otra clase ----------
   La copia es idéntica (nombre, descripción, criterios, peso, instrumento),
   pero sin notas, sin adaptaciones individuales (son de otro alumnado) y sin
   fechas de agenda. El periodo se busca por nombre y, si no, por posición. */
function mapPeriod(src, dst, pid){
  const sp = periodById(src, pid); if(!sp) return null;
  const byName = dst.periods.find(x=>x.name===sp.name);
  if(byName) return byName.id;
  const i = src.periods.indexOf(sp);
  return dst.periods[i] ? dst.periods[i].id : null;
}
function cloneTaskFor(t, unitId, periodId){
  const k = JSON.parse(JSON.stringify(t));
  k.id = uid(); k.unitId = unitId; k.periodId = periodId;
  k.adaptations = {}; delete k.adapted; delete k.adaptCycle; delete k.forStudents;
  k.dates = []; delete k.date;
  if(k.instr && Array.isArray(k.instr.items)) k.instr.items.forEach(i=>i.id=uid());
  return k;
}
/* devuelve la unidad equivalente en la clase destino (misma área, periodo y nombre); la crea si no existe */
function ensureUnitIn(src, dst, u){
  const pid = mapPeriod(src, dst, u.periodId); if(!pid) return null;
  let du = (dst.units||[]).find(x=>x.areaId===u.areaId && x.periodId===pid && x.name===u.name);
  if(!du){
    du = {id:uid(), areaId:u.areaId, periodId:pid, name:u.name, desc:u.desc||''};
    if(u.cover) du.cover = JSON.parse(JSON.stringify(u.cover));
    if(u.plan){ du.plan = JSON.parse(JSON.stringify(u.plan)); ['divStu','self','valWorked','valChange'].forEach(k=>{ delete du.plan[k]; }); }
    if(!dst.units) dst.units = [];
    dst.units.push(du);
  }
  return du;
}
function dupTargets(src, aid){
  return state.courses.filter(x=>x.id!==src.id).map(x=>({c:x, ok:x.areas.includes(aid)}));
}
function dupModal(kind, id){
  const src = course(); if(!src) return;
  const obj = kind==='unit' ? unitById(src, id) : taskById(src, id);
  if(!obj) return;
  const aid = obj.areaId;
  const targets = dupTargets(src, aid);
  if(!targets.length){ alertBox('No tienes otra clase donde duplicarla. Crea antes la otra clase en «Mis clases».'); return; }
  const nTasks = kind==='unit' ? tasksOfUnit(src, obj.id).length : 0;
  const unitName = kind==='task' ? ((unitById(src, obj.unitId)||{}).name||'') : '';
  const inner = `<h3>Duplicar en otra clase</h3>
    <p class="sub">${kind==='unit' ? `Unidad «${esc(obj.name)}» con sus ${nTasks} tarea(s)` : `Tarea «${esc(obj.name)}»${unitName?` · unidad «${esc(unitName)}»`:''}`}
      · ${esc(areaDef(aid).short||areaDef(aid).name)} · ${esc((periodById(src,obj.periodId)||{}).name||'')}</p>
    <div class="dup-list">${targets.map(({c,ok})=>`<label class="dup-opt ${ok?'':'off'}">
        <input type="checkbox" data-dupc="${c.id}" ${ok?(targets.filter(x=>x.ok).length===1?'checked':''):'disabled'}>
        <span><b>${esc(c.name)}</b>${ok?'':`<small>No tiene el área ${esc(areaDef(aid).short||areaDef(aid).name)}</small>`}</span>
      </label>`).join('')}</div>
    <p class="sub" style="margin:10px 0 0">Se copia tal cual: ${kind==='unit'?'descripción, tareas, ':''}criterios, peso e instrumento. No se copian notas, adaptaciones individuales ni fechas de la agenda.
      ${kind==='unit'?'Si la otra clase ya tiene una unidad con el mismo nombre, se añaden a ella las tareas que le falten.':'Si la otra clase no tiene la unidad, se crea.'}</p>`;
  const wrap = openModal(inner, ()=>{
    const ids = [...wrap.querySelectorAll('[data-dupc]:checked')].map(x=>x.dataset.dupc);
    const done = [];
    ids.forEach(cid=>{
      const dst = state.courses.find(x=>x.id===cid); if(!dst) return;
      if(!dst.tasks) dst.tasks = [];
      if(kind==='unit'){
        const du = ensureUnitIn(src, dst, obj); if(!du) return;
        let n = 0;
        tasksOfUnit(src, obj.id).forEach(t=>{
          if(tasksOfUnit(dst, du.id).some(x=>x.name===t.name)) return;
          dst.tasks.push(cloneTaskFor(t, du.id, du.periodId)); n++;
        });
        done.push(dst.name+(n? ' ('+n+' tarea'+(n===1?'':'s')+')' : ' (ya tenía todas las tareas)'));
      } else {
        const su = unitById(src, obj.unitId);
        let unitId = '', pid = mapPeriod(src, dst, obj.periodId);
        if(su){ const du = ensureUnitIn(src, dst, su); if(!du) return; unitId = du.id; pid = du.periodId; }
        if(!pid) return;
        const k = cloneTaskFor(obj, unitId, pid);
        if(tasksOfUnit(dst, unitId).some(x=>x.name===k.name) && unitId) k.name = k.name+' (copia)';
        dst.tasks.push(k);
        done.push(dst.name);
      }
    });
    if(done.length) setTimeout(()=>alertBox('Duplicado en: '+done.join(', ')+'.'), 0);
  }, 'Duplicar');
}

/* =====================================================================
   EVALUACIÓN INICIAL (formato propio)
   - 1 o 2 pruebas por área (tareas isInitial, sin unidad, nota numérica).
   - Nota orientativa = media de las pruebas. No computa en los trimestres.
   - Observaciones por alumno y área: c.initObs['sid:aid'].
   - Valoración del progreso en cada trimestre: c.progress['sid:aid:pid'].
   ===================================================================== */
function initPeriod(c){ return (c.periods||[]).find(p=>p.initial) || null; }
function okey(sid, aid){ return sid+':'+aid; }
function initTasks(c, aid){ const ip = initPeriod(c); return ip ? tasksOf(c, aid, ip.id) : []; }
function initObs(c, sid, aid){ return (c.initObs||{})[okey(sid, aid)] || ''; }
function initMean(c, sid, aid){
  const vals = initTasks(c, aid).map(t=>taskFinal(c, t, sid)).filter(v=>v!=null);
  return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
}
function progressText(c, sid, aid, pid){ return (c.progress||{})[fkey(sid, aid, pid)] || ''; }
function hasStartPoint(c, sid, aid){ return initMean(c, sid, aid)!=null || !!initObs(c, sid, aid).trim(); }

function iniTestModal(existing){
  const c = course(), aid = areaId(), p = period();
  const ins = existing ? (existing.instr||{type:'num'}) : {type:'num', max:10};
  const inner = `<h3>${existing?'Editar prueba':'Nueva prueba inicial'}</h3>
    <p class="sub">${esc(areaDef(aid).name)} · ${esc(p.name)}</p>
    ${field('Nombre','name',{value:existing?existing.name:'', placeholder:'Initial test'})}
    ${ins.type==='num'? field('Puntuación máxima','max',{type:'number', value:ins.max||10}) : ''}
    ${field('Descripción (opcional)','desc',{type:'textarea', rows:2, value:existing?existing.desc:'', placeholder:'Contenidos que revisa la prueba'})}
    ${!existing && dupTargets(c, aid).some(x=>x.ok) ? `<div class="field"><span>Crear también en</span>
      <div class="dup-list">${dupTargets(c, aid).filter(x=>x.ok).map(({c:x})=>`<label class="dup-opt"><input type="checkbox" name="also_${x.id}"> <span><b>${esc(x.name)}</b></span></label>`).join('')}</div></div>` : ''}`;
  openModal(inner, v=>{
    const name = v.name || 'Prueba inicial';
    const max = Math.max(1, num(v.max)||10);
    if(existing){
      existing.name = name; existing.desc = v.desc||'';
      if(existing.instr && existing.instr.type==='num') existing.instr.max = max;
      return;
    }
    const t = {id:uid(), areaId:aid, periodId:p.id, unitId:'', name:name, desc:v.desc||'', goals:'', activities:'',
      criteria:[], weight:0, isInitial:true, instr:{type:'num', max:max, levels:[], items:[]}, adaptations:{}, dates:[]};
    c.tasks.push(t);
    dupTargets(c, aid).filter(x=>x.ok && v['also_'+x.c.id]).forEach(({c:dst})=>{
      const pid = mapPeriod(c, dst, p.id); if(!pid) return;
      if(tasksOf(dst, aid, pid).length>=2) return;
      dst.tasks.push(cloneTaskFor(t, '', pid));
    });
  }, existing?'Guardar':'Crear prueba');
}

e las tecnologías digitales (tiempo excesivo de uso, ciberacoso, acceso a contenidos inadecuados, publicidad y correos no deseados, etc.), y estrategias de actuación."]},{"c":"B.2","n":"Proyectos de diseño y pensamiento computacional","i":["Fases de los proyectos de diseño: diseño, construcción de modelos y prototipos, prueba y comunicación.","Materiales, herramientas y objetos adecuados a la consecución de un proyecto de diseño.","Técnicas cooperativas sencillas para el trabajo en equipo y estrategias para la gestión de conflictos y promoción de conductas empáticas e inclusivas.","Iniciación a la programación a través de recursos analógicos (actividades desenchufadas) o digitales (plataformas digitales de iniciación a la programación, aplicaciones de programación por bloques, robótica educativa...)."]}]}],"3":[{"c":"A","n":"Cultura científica","s":[{"c":"A.1","n":"Iniciación a la actividad científica","i":["Prácticas científicas (observación, formulación de preguntas y predicciones, planificación y realización de experimentos, recogida y análisis de información y datos, comunicación de resultados y conclusiones...).","Instrumentos y dispositivos apropiados para realizar observaciones y mediciones precisas de acuerdo con las necesidades de la investigación.","Vocabulario científico básico relacionado con las diferentes investigaciones.","La curiosidad, la iniciativa, la constancia y el sentido de la responsabilidad como actitudes en la realización de las diferentes investigaciones.","La ciencia, la tecnología y la ingeniería como actividades humanas. Las profesiones STEM en la actualidad desde una perspectiva de género.","La relación entre los avances en matemáticas, ciencia, ingeniería y tecnología para comprender la evolución de la sociedad en el ámbito científico-tecnológico."]},{"c":"A.2","n":"La vida en nuestro planeta","i":["Aspectos básicos de las funciones vitales del ser humano desde una perspectiva integrada: obtención de energía, relación con el entorno y perpetuación de la especie.","Los cambios físicos, emocionales y sociales que conllevan la pubertad y la adolescencia para aceptarlos de forma positiva tanto en uno mismo como en los demás. Educación afectivo-sexual.","Pautas para una alimentación saludable y sostenible: menús saludables y equilibrados. La importancia de la cesta de la compra y del etiquetado de los productos alimenticios para conocer sus nutrientes y su aporte energético.","Pautas que fomenten una salud emocional y social adecuadas: higiene del sueño, prevención y consecuencias del consumo de drogas (legales e ilegales), gestión saludable del ocio y del tiempo libre, uso adecuado de dispositivos digitales, estrategias para el fomento de relaciones sociales saludables y fomento de los cuidados de las personas.","Pautas para la prevención de riesgos y accidentes. Conocimiento de actuaciones básicas de primeros auxilios."]},{"c":"A.3","n":"Materia, fuerzas y energía","i":["Masa y volumen. Su medida en objetos y materiales.","Instrumentos y procedimientos para calcular medirla masa y la capacidad volumen de un diferentes objetos.","Concepto de densidad y su relación con la flotabilidad de un objeto o material en un líquido o en un gas.","La energía eléctrica: fuentes, transferencia, transformaciones entre formas de energía y usos en la vida cotidiana. Los circuitos eléctricos y las estructuras robotizadas como ejemplos de transferencia y transformación y algunos usos.","Las fuentes de energías renovables y no renovables y su influencia en la contribución al desarrollo sostenible de la sociedad.","Artefactos, objetos y seres vivos voladores. Principios básicos físicos del vuelo."]},{"c":"A.4","n":"La Tierra y el espacio","i":["El futuro de la Tierra y del universo. Los fenómenos físicos relacionados con la Tierra y el universo y su repercusión en la vida diaria y en el entorno.","Clasificación básica de rocas y minerales. Usos y explotación sostenible de los recursos geológicos","Procesos geológicos básicos de formación y modelado del relieve.","Fenómenos atmosféricos","La exploración espacial y la observación del cielo; la contaminación lumínica."]}]},{"c":"B","n":"Tecnología y digitalización","s":[{"c":"B.1","n":"Digitalización del entorno personal de aprendizaje","i":["Dispositivos y recursos digitales de acuerdo a las necesidades del contexto educativo.","Estrategias de búsquedas de información seguras y eficientes en Internet (valoración, discriminación, selección, organización y propiedad intelectual).","Estrategias de recogida, almacenamiento y representación de datos para facilitar su comprensión y análisis.","Reglas básicas de seguridad y privacidad para navegar por Internet y para proteger el entorno digital personal de aprendizaje.","Recursos y plataformas digitales restringidas y seguras para comunicarse con otras personas. Etiqueta digital, reglas básicas de cortesía y respeto y estrategias para resolver problemas en la comunicación digital.","Estrategias para fomentar el bienestar físico y mental. Reconocimiento de los riesgos asociados a un uso inadecuado y poco seguro de las tecnologías digitales (tiempo excesivo de uso, ciberacoso, dependencia tecnológica, acceso a contenidos inadecuados, etc.), y estrategias de actuación."]},{"c":"B.2","n":"Proyectos de diseño y pensamiento computacional","i":["Fases de los proyectos de diseño: identificación de necesidades, diseño, creación de un prototipo, prueba, evaluación y comunicación.","Fases del pensamiento computacional (descomposición de una tarea en partes más sencillas, reconocimiento de patrones y creación de algoritmos sencillos para la resolución del problema...).","Materiales, herramientas, objetos, dispositivos y recursos digitales (programación por bloques, sensores, motores, simuladores, impresoras 3D, ...) seguros y adecuados a la consecución del proyecto.","Estrategias en situaciones de incertidumbre: adaptación y cambio de estrategia cuando sea necesario, valoración del error propio y el de los demás como oportunidad de aprendizaje."]}]}]},"soc":{"1":[{"c":"A","n":"Cultura científica: iniciación a la actividad científica en Ciencias Sociales","s":[{"c":"A","n":"","i":["Exploración y observación guiada del entorno físico y social, con especial interés en el patrimonio, el paisaje y la organización de la localidad.","Inicio al trabajo con fuentes. Uso de objetos y artefactos de la vida cotidiana como fuentes para reflexionar sobre el cambio y la continuidad, las causas y consecuencias.","Inicio en la representación gráfica del espacio (lectura o Inicio a la representación gráfica del espacio y del tiempo. Utilización de mapas, croquis o planos sencillos o visualización a través de sistemas de información geográfica como Google Earth o similares. Elaboración de líneas temporales sencillas, árboles genealógicos, etc."]}]},{"c":"B","n":"Sociedades y territorios","s":[{"c":"B.1","n":"Retos del mundo actual","i":["Retos sobre situaciones cotidianas. Categorías espaciales. Funciones básicas del pensamiento espacial y temporal para la interacción con el medio y la resolución de situaciones de la vida cotidiana. Itinerarios y trayectos, desplazamientos y viajes.","La diversidad de las poblaciones en el entorno físico y sociocultural."]},{"c":"B.2","n":"Sociedades en el tiempo","i":["La percepción del tiempo. Categorías temporales básicas. Medida del tiempo en la vida cotidiana.","El ciclo vital y las relaciones intergeneracionales.","Recursos y medios analógicos y digitales. Las fuentes orales y la memoria colectiva. La historia local y la biografía familiar, hombres y mujeres como sujetos de la historia.","Las expresiones y producciones artísticas a través del tiempo. El patrimonio material e inmaterial local y del contexto sociocultural del alumnado. Las lenguas propias de Aragón (aragonés y catalán)."]},{"c":"B.3","n":"Alfabetización cívica","i":["La vida en colectividad. La familia. Diversidad familiar. Compromisos, participación y normas en el entorno familiar, vecinal y escolar. Prevención, gestión y resolución dialogada de conflictos.","Habilidades emocionales (conciencia y regulación emocional; autovaloración) y comunicativas (verbales, no verbales, y conversacionales; la escucha activa).","La vida en sociedad. Espacios, recursos y servicios del entorno. Formas y modos de interacción social en espacios públicos desde una perspectiva de género.","Identidad y diversidad cultural: existencia de realidades diferentes y aproximación a las distintas etnoculturas presentes en el entorno. La convivencia con los demás y el rechazo a las actitudes discriminatorias. Cultura de paz y no violencia.","Ocupación y trabajo. Identificación de las principales actividades profesionales y laborales de mujeres y hombres en el entorno.","Igualdad de género y conducta no sexista.","Seguridad vial. La ciudad como espacio de convivencia. Normas básicas en los desplazamientos como peatones y usuarios de los medios de locomoción."]},{"c":"B.4","n":"Conciencia ecosocial","i":["Conocimiento de nuestro entorno. Paisajes naturales y paisajes humanizados, y sus elementos. La acción humana sobre el medio y sus consecuencias.","Relación entre el ser humano y el medio.","Responsabilidad ecosocial. Acciones para la conservación, mejora y uso sostenible de los bienes comunes. El maltrato animal y su prevención.","Estilos de vida sostenible. El uso responsable del agua, la movilidad segura, saludable y sostenible, y la prevención y gestión de los residuos."]}]}],"2":[{"c":"A","n":"Cultura científica: iniciación a la actividad científica en Ciencias Sociales","s":[{"c":"A","n":"","i":["Iniciación a la investigación y a los métodos de trabajo para la realización de proyectos, que analicen hechos, asuntos y temas de la vida cotidiana o de relevancia actual desde una perspectiva histórica, contextualizándolos en la época correspondiente desde la Prehistoria a la Edad Contemporánea, como son la supervivencia y la alimentación, la vivienda, los intercambios comerciales (de dónde viene el dinero, los trabajos no remunerados), la explotación de bienes comunes y recursos, los avances técnicos.","Las fuentes históricas: clasificación y utilización de las distintas fuentes (orales, escritas, patrimoniales) como vía para el análisis de los cambios y permanencias en la localidad a lo largo de la historia. Las huellas de la historia en lugares, edificios, objetos, oficios o tradiciones de la localidad.","La representación gráfica del espacio y del tiempo. Comparación de mapas y planos de diferentes escalas. Representaciones gráficas y visuales del clima y los paisajes. Las Tecnologías de la Información Geográfica (TIG)."]}]},{"c":"B","n":"Sociedades y territorios","s":[{"c":"B.1","n":"Retos del mundo actual","i":["Conocimiento del espacio. Representación de la Tierra a través del globo terráqueo, los mapas y otros recursos analógicos y digitales. Mapas y planos en distintas escalas. Técnicas de orientación mediante la observación de los elementos del medio físico y otros medios de localización espacial.).","El clima y el paisaje. gráfica. Relación entre las zonas climáticas y la diversidad de paisajes. El medio físico de Aragón. Distribución territorial de Aragón.","Retos demográficos. Ocupación y distribución de la población en el espacio y análisis de los principales problemas y retos demográficos. Representación gráfica y cartográfica de la población. La organización del territorio en Aragón y rasgos básicos de España y en Europa.","Desigualdad social y acceso a los recursos. Usos del espacio por el ser humano y evolución de las actividades productivas. El valor, el control del dinero y medios de pago. De la supervivencia a la sobreproducción."]},{"c":"B.2","n":"Sociedades en el tiempo","i":["El tiempo histórico. Nociones temporales y cronología. Representación gráfica del tiempo (líneas del tiempo y ejes cronológicos).","Ubicación temporal de las grandes etapas históricas en ejes cronológicos. Características civilizaciones y sociedades representativas de las grandes etapas cronológicas, profundizando en las referentes a España y Aragón.","La acción de las mujeres y los hombres como sujetos en la historia. Interpretación del papel de los individuos y de los distintos grupos sociales, relaciones, conflictos, creencias y condicionantes en cada época histórica. Las personas como agentes/motor de los cambios.","Introducción a las expresiones artísticas y culturales y su contextualización histórica, incluyendo una perspectiva de género. La función del arte y la cultura en el mundo a lo largo de las diferentes etapas históricas.","Ejemplos destacados del patrimonio natural y cultural de Aragón. Los espacios protegidos, culturales y naturales, parques culturales y elementos patrimoniales protegidos. Patrimonio material e inmaterial. Su uso, cuidado y conservación. Las lenguas propias de Aragón (aragonés y catalán)."]},{"c":"B.3","n":"Alfabetización cívica","i":["Compromisos y normas para la vida en sociedad.","Las costumbres, tradiciones y manifestaciones etnoculturales del entorno. Respeto por la diversidad cultural, los derechos humanos y la cohesión social. La cultura de paz y no violencia.","La organización política y territorial de Aragón y rasgos básicos de España.","Organización y funcionamiento de la sociedad. Las principales instituciones y entidades del entorno local, regional y nacional y los servicios públicos que prestan. Estructura administrativa de Aragón y aspectos básicos de la España.","Seguridad vial. La ciudad como espacio de convivencia. Normas de circulación, señales y marcas viales. Movilidad segura, saludable y sostenible como peatones y usuarios de los medios de locomoción."]},{"c":"B.4","n":"Conciencia ecosocial","i":["Riesgos ambientales y el cambio climático. Introducción a las causas y consecuencias del cambio climático y los riesgos ambientales, y su impacto en los paisajes de la Tierra. Medidas de mitigación y adaptación.","Responsabilidad ecosocial. Ecodependencia e interdependencia entre personas, sociedades y medio natural.","Ciudadanía geográfica espacial.","Desequilibrios territoriales","La transformación y la degradación de los ecosistemas naturales por acción humana. Conservación y protección de la naturaleza. El maltrato animal y su prevención.","Estilos de vida sostenible. El consumo responsable, el uso del agua y la energía, la movilidad sostenible y la gestión de los residuos."]}]}],"3":[{"c":"A","n":"Cultura científica: iniciación a la actividad científica en Ciencias Sociales","s":[{"c":"A","n":"","i":["Aplicación de competencias del pensamiento histórico.","Las fuentes históricas: clasificación y utilización de fuentes de distinta naturaleza (orales, escritas, materiales, iconográficas, etc).","Representación gráfica, visual y cartográfica a través de medios y recursos analógicos y digitales usando las Tecnologías de la Información Geográfica (TIG). Representación gráfica del tiempo (líneas temporales, mapas históricos, etc.)"]}]},{"c":"B","n":"Sociedades y territorios","s":[{"c":"B.1","n":"Retos del mundo actual","i":["El clima y el planeta. Introducción a la dinámica atmosférica y a las grandes áreas climáticas del mundo. Los principales ecosistemas y sus paisajes.","El entorno natural. La diversidad geográfica de España y de Europa.","Migraciones y diversidad cultural. Las principales variables demográficas y su representación gráfica. Los comportamientos de la población y su evolución. Los movimientos migratorios y apreciación de la diversidad cultural. Contraste entre zonas urbanas y despoblación rural.","Ciudadanía activa. Fundamentos y principios para la organización política y gestión del territorio en España y Europa. Participación social y ciudadana. Ciudadanía europea.","Igualdad de género y conductas no sexistas. Crítica de los estereotipos y roles en los distintos ámbitos: académico, profesional, social y cultural. Acciones para la igualdad efectiva de mujeres y hombres."]},{"c":"B.2","n":"Sociedades en el tiempo","i":["Acontecimientos y procesos históricos relevantes en la historia del mundo desde la Prehistoria a la actualidad, el papel representado por los sujetos históricos (individuales y colectivos), acontecimientos y procesos.","Principales hitos de la evolución histórica de Aragón y de España","El patrimonio natural y cultural material e inmaterial de Aragón y España como bien y recurso; su uso, cuidado y conservación. Las lenguas propias de Aragón (aragonés y catalán).","El papel de las mujeres en la historia y los principales movimientos en defensa de sus derechos. Situación actual y retos de futuro en la igualdad de género. Otros movimientos en defensa de los derechos de diferentes colectivos sociales.","Profundización en la función del arte y la cultura. Las expresiones artísticas y culturales y su contextualización histórica, incluyendo una perspectiva de género.","La memoria democrática. Análisis multicausal del proceso de construcción de la democracia en España. La Constitución de 1978."]},{"c":"B.3","n":"Alfabetización cívica","i":["Historia y cultura de las minorías étnico-culturales presentes en nuestro país, particularmente las propias del pueblo gitano. Reconocimiento de la diversidad cultural y lingüística de Aragón y de España.","Los principios y valores de los derechos humanos y de la infancia y la Constitución española, derechos y deberes de la ciudadanía. La contribución del Estado y sus instituciones a la paz, la seguridad integral y la cooperación internacional para el desarrollo.","La cultura de paz y no violencia. El pensamiento crítico como herramienta para el análisis de los conflictos de intereses. El reconocimiento de las víctimas de la violencia.","La organización política. Principales entidades políticas y administrativas del entorno local, autonómico y nacional en Aragón y España. Sistemas de representación y de participación política.","Fórmulas para la participación de la ciudadanía en la vida pública en Aragón, Esp
