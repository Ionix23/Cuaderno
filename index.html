<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cuaderno Profesor</title>
<meta name="description" content="Cuaderno de evaluación LOMLOE para Primaria">
<meta name="theme-color" content="#16241F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cuaderno">
<script src="https://accounts.google.com/gsi/client" async></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --paper:#F4F6F3; --card:#FFFFFF; --ink:#16241F; --muted:#6B7A72; --rule:#DDE3DD;
  --accent:#1F6B4F; --accent-soft:#DCEBE1; --mark:#E4A11B; --low:#B4472F;
  --font-display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --font-ui:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,'SF Mono',monospace;
}
*{box-sizing:border-box}
#app{font-family:var(--font-ui);color:var(--ink);background:var(--paper);line-height:1.45;font-size:17.5px;border-radius:12px;overflow:hidden;border:1px solid var(--rule)}
#app h1,#app h2,#app h3{font-family:var(--font-display);font-weight:800;letter-spacing:-0.02em;margin:0}

.top{background:var(--ink);color:#EAF0EC;padding:18px 20px 0}
.top-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand{font-family:var(--font-display);font-size:28px;font-weight:800;letter-spacing:-0.03em}
.brand em{font-style:normal;color:var(--mark)}
.brand-sub{font-family:var(--font-mono);font-size:13px;color:#8FA79A;text-transform:uppercase;letter-spacing:.08em}
.saved{margin-left:auto;font-family:var(--font-mono);font-size:13px;color:#8FA79A;opacity:0;transition:opacity .4s}
.saved.on{opacity:1}
.context{display:flex;gap:10px;flex-wrap:nowrap;align-items:stretch;padding:14px 0 0}
.context select,.ctx-sel{font-family:var(--font-ui);font-size:17px;color:#EAF0EC;background:#22362E;border:1px solid #355044;border-radius:10px;padding:10px 14px;max-width:100%}
.ctx-sel{flex:1;min-width:0}
.home-btn{display:inline-flex;align-items:center;gap:7px;flex:none;background:#2C4339;color:#EAF0EC;border:1px solid #3E5A4C;border-radius:10px;padding:10px 16px;font-family:var(--font-display);font-size:16px;font-weight:600;cursor:pointer;transition:background .12s}
.home-btn:hover{background:#365243}
.home-btn svg{flex:none}
.tabs{display:flex;gap:8px;overflow-x:auto;margin-top:16px;padding-bottom:2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{font-family:var(--font-display);font-size:16px;font-weight:600;white-space:nowrap;background:#22362E;color:#B8CBBF;border:1px solid #344C40;border-radius:10px 10px 0 0;border-bottom:2px solid transparent;padding:11px 20px;cursor:pointer;transition:all .12s}
.tab:hover{color:#EAF0EC;background:#2A4238}
.tab[aria-current="true"]{color:#fff;background:var(--accent);border-color:var(--accent);border-bottom-color:var(--mark)}
main{padding:18px 16px 40px;min-height:440px}

.card{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:14px}
.card + .card{margin-top:12px}
.sec-title{font-size:18.5px;margin-bottom:2px}
.hint{color:var(--muted);font-size:15.5px;margin:0 0 12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
button.btn{font-family:var(--font-ui);font-size:15.5px;font-weight:500;cursor:pointer;background:var(--accent);color:#fff;border:1px solid var(--accent);border-radius:8px;padding:7px 12px}
button.btn:hover{background:#185941}
button.btn.ghost{background:transparent;color:var(--accent);border-color:var(--rule)}
button.btn.ghost:hover{background:var(--accent-soft)}
button.btn.danger{background:transparent;color:var(--low);border-color:#E7CFC9}
button.btn.danger:hover{background:#F7EAE6}
button.btn.small{padding:4px 8px;font-size:14px}
button.icon{background:none;border:0;cursor:pointer;color:var(--muted);font-size:17.5px;padding:2px 5px;border-radius:6px}
button.icon:hover{background:var(--accent-soft);color:var(--ink)}
:focus-visible{outline:2px solid var(--mark);outline-offset:1px}
label.field{display:block;font-size:14px;font-weight:600;color:var(--muted);margin-bottom:14px}
label.field span{display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em}
.inp{width:100%;font-family:var(--font-ui);font-size:16.5px;color:var(--ink);background:#fff;border:1px solid var(--rule);border-radius:8px;padding:8px 10px;font-weight:400}
textarea.inp{min-height:110px;resize:vertical}
.empty{text-align:center;padding:44px 16px;color:var(--muted)}
.empty h3{font-size:21px;color:var(--ink);margin-bottom:6px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--rule)}
.list li:last-child{border-bottom:0}
.num{font-family:var(--font-mono);font-size:13px;color:var(--muted);width:22px;flex:none}
.grow{flex:1;min-width:0}
.tag{font-family:var(--font-mono);font-size:13px;padding:2px 6px;border-radius:5px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.tag.grey{background:#EEF1EE;color:var(--muted)}
.tag.warn{background:#FCF1D8;color:#8A6206}
.class-card{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--rule);border-radius:10px;background:#fff;margin-bottom:8px;cursor:pointer;width:100%;text-align:left;font-family:var(--font-ui)}

.ctx-name{font-weight:700;font-size:18px;align-self:center;flex:none;padding:0 4px;font-family:var(--font-display)}
#app.home main{padding:0}
.home-wrap{max-width:1100px;margin:0 auto;padding:26px 22px 48px}
.home-wrap.home-wide{max-width:1600px}
.home-head{display:flex;align-items:flex-end;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.home-title{font-family:var(--font-display);font-size:30px;margin:0;letter-spacing:-.01em}
.home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.course-card{border:1px solid var(--rule);border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 1px 3px rgba(20,36,31,.06);transition:box-shadow .15s,transform .15s;display:flex;flex-direction:column}
.course-card:hover{box-shadow:0 6px 20px rgba(20,36,31,.13);transform:translateY(-2px)}
.cc-banner{position:relative;padding:18px 18px 20px;color:#fff;cursor:pointer;min-height:112px}
.cc-level{font-family:var(--font-mono);font-size:12px;opacity:.85;letter-spacing:.04em}
.cc-name{font-family:var(--font-display);font-size:24px;margin:2px 0 0;color:#fff;line-height:1.1}
.cc-cycle{font-size:12px;opacity:.85;margin-top:4px}
.cc-actions{position:absolute;top:12px;right:12px;display:flex;gap:2px;opacity:0;transition:opacity .15s}
.course-card:hover .cc-actions{opacity:1}
.cc-icon{width:30px;height:30px;border:0;border-radius:8px;background:rgba(255,255,255,.18);color:#fff;cursor:pointer;font-size:14px}
.cc-icon:hover{background:rgba(255,255,255,.32)}
.cc-body{padding:14px 18px 18px;cursor:pointer;flex:1;display:flex;flex-direction:column;gap:10px}
.cc-desc{margin:0;font-size:13.5px;color:var(--ink);line-height:1.4}
.cc-desc.muted{color:var(--muted);font-style:italic}
.cc-areas{display:flex;gap:5px;flex-wrap:wrap}
.cc-stats{display:flex;gap:16px;margin-top:auto;font-size:13px;color:var(--muted)}
.cc-stats b{color:var(--ink);font-family:var(--font-mono)}
.course-add{align-items:center;justify-content:center;gap:8px;min-height:200px;border-style:dashed;color:var(--muted);cursor:pointer;font-family:var(--font-ui);font-size:15px;background:#FAFBFA}
.course-add:hover{color:var(--accent);border-color:var(--accent)}
.add-plus{font-size:34px;line-height:1;font-weight:300}
.home-foot{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:30px;padding-top:20px;border-top:1px solid var(--rule)}

/* conmutador clases/agenda */
.home-navwrap{max-width:1100px;margin:0 auto;padding:26px 22px 0}
.home-switch{display:flex;gap:10px;margin-bottom:22px;flex-wrap:wrap}
.hsw{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-display);font-size:16px;font-weight:600;padding:12px 22px;border:2px solid var(--rule);border-radius:12px;background:#fff;color:var(--muted);cursor:pointer;transition:all .12s;line-height:1}
.hsw .hsw-ic{font-size:17px;opacity:.85}
.hsw:not(.on):hover{border-color:var(--muted);color:var(--ink)}
.hsw.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.hsw.on .hsw-ic{opacity:1}
@media(max-width:700px){.home-switch{gap:8px}.hsw{padding:10px 15px;font-size:14.5px;flex:1;justify-content:center}}
.settings-section{margin-bottom:26px}
.settings-head{border-left:4px solid var(--accent);padding:2px 0 2px 14px;margin-bottom:14px}
.settings-title{font-family:var(--font-display);font-size:21px;font-weight:700;color:var(--ink);margin:0}
.settings-sub{font-size:14px;color:var(--muted);margin:3px 0 0;line-height:1.45}

/* planificador */
.plan-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.plan-title{font-family:var(--font-display);font-size:22px;font-weight:700}
.plan-datenav{display:flex;gap:6px;align-items:center}
.pd-arrow{width:40px;height:40px;border:2px solid var(--rule);border-radius:10px;background:#fff;color:var(--ink);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s;line-height:1}
.pd-arrow:hover{border-color:var(--accent);color:var(--accent)}
.pd-today{height:40px;padding:0 18px;border:2px solid var(--rule);border-radius:10px;background:#fff;color:var(--ink);font-family:var(--font-display);font-size:15px;font-weight:600;cursor:pointer;transition:all .12s}
.pd-today:hover{border-color:var(--accent);color:var(--accent)}
.plan-modes{display:flex;gap:10px;margin-bottom:16px}
.plan-modes .subnav-btn{min-width:104px;justify-content:center}
@media(max-width:700px){.plan-modes .subnav-btn{min-width:0;flex:1}.plan-title{font-size:19px}}
.area-legend{display:flex;gap:14px;flex-wrap:wrap;margin:-6px 0 14px}
.al-item{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--muted)}
.al-dot{width:11px;height:11px;border-radius:3px;display:inline-block}
.unit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.unit-card{display:flex;border:1px solid var(--rule);border-radius:12px;overflow:hidden;background:#fff;cursor:pointer;transition:box-shadow .15s,transform .15s}
.unit-card:hover{box-shadow:0 5px 16px rgba(20,36,31,.12);transform:translateY(-1px)}
.uc-bar{width:6px;flex:none}
.uc-body{padding:13px 15px;flex:1;min-width:0}
.uc-name{font-family:var(--font-display);font-size:18px}
.uc-desc{margin:6px 0;font-size:13px;color:var(--ink);line-height:1.4}
.uc-desc.muted{color:var(--muted);font-style:italic}
.uc-stats{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-top:6px}
.uc-stats b{color:var(--ink);font-family:var(--font-mono)}
.w-inp{border:1px solid var(--rule);border-radius:5px;padding:2px 3px;font-family:var(--font-mono)}
.cell-wrap{position:relative;display:block}
.ad-badge{position:absolute;top:1px;left:2px;font-size:8px;font-style:normal;font-weight:700;color:#8A6206;background:#FCF1D8;border:1px solid #EEDCA8;border-radius:3px;padding:0 2px;line-height:1.3;z-index:1}
button.is-adapted, input.is-adapted{box-shadow:inset 0 0 0 1.5px #EEDCA8}
button.is-adapted{padding-left:14px}
.wk-scroll{overflow-x:auto}
table.wk{width:100%;border-collapse:collapse;table-layout:fixed;min-width:600px}
table.wk th{font-size:12px;color:var(--muted);text-transform:none;padding:8px 4px;border-bottom:1px solid var(--rule);text-align:center;font-weight:600}
table.wk th small{display:block;font-family:var(--font-mono);font-weight:400;font-size:11px}
table.wk th.is-today{color:var(--accent)}
.wk-time{width:66px;font-family:var(--font-mono);font-size:13px;color:var(--muted);text-align:right;padding:8px 10px;vertical-align:top}
.wk-time small{display:block;opacity:.6;font-size:11px}
.wk-cell{border:1px solid var(--rule);height:88px;vertical-align:top;padding:0;cursor:pointer;position:relative;transition:background .1s}
.wk-cell:hover{background:#F7F9F7}
.wk-cell.is-today{background:#F4F8F5}
.wk-inner{height:100%;display:flex;flex-direction:column}
.wk-add{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#C4CEC7;font-size:20px;pointer-events:none}
.wk-cell:hover .wk-add{color:var(--accent)}
.wk-ev{flex:1;min-height:0;padding:7px 9px;font-size:13.5px;line-height:1.3;overflow:hidden}
.wk-course{display:block;font-size:11px;font-weight:600;margin-bottom:2px}
.wk-t{display:block;color:var(--ink)}
table.wk tr.brk td{background:#FAF7EF;color:#8A6206;font-size:11px;text-align:center;padding:3px;border:1px solid var(--rule)}
/* día */
.day-list{display:flex;flex-direction:column;gap:8px}
.day-brk{background:#FAF7EF;color:#8A6206;font-size:12px;padding:6px 12px;border-radius:8px;text-align:center}
.day-row{display:flex;gap:14px;background:#fff;border:1px solid var(--rule);border-radius:10px;padding:12px 14px;cursor:pointer}
.day-row:hover{box-shadow:0 2px 8px rgba(20,36,31,.08)}
.day-time{flex:none;width:56px;font-family:var(--font-mono);font-size:14px;color:var(--ink)}
.day-time small{display:block;color:var(--muted);font-size:11px}
.day-body{flex:1;min-width:0}
.day-course{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.day-title{font-size:15px;font-weight:600;margin:1px 0 3px}
.day-notes{font-size:13.5px;color:var(--ink);line-height:1.45}
.field-lbl{font-family:var(--font-ui);font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;font-weight:600}
.sess-total{font-size:13px;color:var(--muted)}
.sess-total .st-ok{color:var(--accent)}
.sess-total .st-over{color:var(--low)}
.sess-part{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.sp-num{flex:none;width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono)}
.sp-text{flex:1;min-width:0}
.sp-time{flex:none;display:flex;align-items:center;gap:0;border:1px solid var(--rule);border-radius:9px;overflow:hidden;background:#fff}
.sp-step{width:30px;height:36px;border:0;background:var(--paper);color:var(--ink);font-size:18px;cursor:pointer;line-height:1;display:flex;align-items:center;justify-content:center;transition:background .1s}
.sp-step:hover{background:var(--accent-soft);color:var(--accent)}
.sp-min{width:38px;border:0;text-align:center;font-size:15px;font-family:var(--font-mono);padding:0;outline:none;-moz-appearance:textfield}
.sp-min::-webkit-outer-spin-button,.sp-min::-webkit-inner-spin-button{-webkit-appearance:none}
.sp-unit{font-size:11px;color:var(--muted);padding:0 8px 0 2px}
.sp-del{flex:none}
.dev-list{margin:2px 0;padding-left:20px}
.dev-list li{margin-bottom:4px}
.dev-min{display:inline-block;font-family:var(--font-mono);font-size:11.5px;font-weight:600;color:#7A5A10;background:#FCF6E8;border:1px solid #EEDCA8;border-radius:20px;padding:0 8px;margin-left:7px;line-height:18px;vertical-align:middle}
.dev-total{font-size:12.5px;color:var(--muted);margin-top:5px;font-weight:600}
.chk-field{flex-direction:row!important}
.chk-row{display:flex;align-items:flex-start;gap:9px;cursor:pointer;font-size:13.5px;line-height:1.4;color:var(--ink);padding:2px 0}
.chk-row input{margin-top:2px;width:17px;height:17px;flex:none;accent-color:var(--accent)}
.init-tag{display:inline-block;background:var(--mark);color:#5A3E00;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;border-radius:5px;padding:1px 6px;vertical-align:middle}
th.th-init{background:#FDF6E7!important;border-bottom:2px solid var(--mark)!important}
td.td-init{background:#FEFBF2}
td.td-init .cell,td.td-init input{border-color:#EAD9A8}
.task-line.tl-init{background:#FEFBF2;border-radius:8px}
/* ---- disposición del aula ---- */
.aula-tools{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end;margin:14px 0;padding:12px 14px;background:var(--paper);border-radius:12px}
.at-group{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.at-lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;font-weight:600;width:100%;margin-bottom:2px}
.aula-pending{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.ap-chip{font-size:12px;background:#fff;border:1px dashed var(--rule);border-radius:7px;padding:3px 8px;color:var(--muted)}
.aula-stage-wrap{width:100%;overflow:auto;border-radius:14px}
.aula-stage{position:relative;width:100%;background:#F4F6F4;border:2px solid var(--rule);border-radius:14px;
  background-image:linear-gradient(#E4EAE4 1px,transparent 1px),linear-gradient(90deg,#E4EAE4 1px,transparent 1px);
  background-size:calc(100%/var(--cols,12)) calc(100%/var(--rows,9)), calc(100%/var(--cols,12)) calc(100%/var(--rows,9));
  touch-action:none;user-select:none}
.aula-front{position:absolute;top:3px;left:0;right:0;text-align:center;font-size:10.5px;color:#B7C0B7;letter-spacing:.08em;text-transform:uppercase;pointer-events:none;z-index:1}
.aula-item{position:absolute;cursor:grab;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-family:var(--font-ui);transition:box-shadow .1s}
.aula-item.dragging{cursor:grabbing;box-shadow:0 8px 22px rgba(20,36,31,.28);z-index:20;transition:none}
/* mesa de alumno: ocupa casi toda su casilla con un margen */
.aula-item.desk{margin:0;padding:3px;background:#fff;border:1.5px solid var(--accent);border-radius:9px;flex-direction:column;box-shadow:0 1px 2px rgba(20,36,31,.08);overflow:hidden}
.aula-item.desk,.aula-item:not(.flat){outline:4px solid transparent;outline-offset:-4px}
.desk .dk-num{position:absolute;top:2px;left:5px;font-size:9px;color:var(--muted);font-family:var(--font-mono)}
.desk .dk-name{font-size:clamp(9px,1.05vw,13px);font-weight:600;color:var(--ink);text-align:center;line-height:1.15;overflow:hidden}
.desk .dk-med{position:absolute;top:2px;right:4px;font-size:8.5px;font-weight:700;border-radius:4px;padding:0 3px;line-height:13px}
/* elementos: rellenan su casilla */
.el-teacher{background:#2C3B34;color:#fff;border-radius:10px;font-size:clamp(10px,1vw,13px);font-weight:600;padding:2px 6px}
.el-boardd{background:#1F4E6B;color:#fff;border-radius:5px;font-size:11px;align-self:start;height:60%!important;margin-top:3px}
.el-boardc{background:#33422F;color:#EAF0E6;border-radius:5px;font-size:11px;border:2px solid #6B7A5E;align-self:start;height:60%!important;margin-top:3px}
.el-window{background:#CDE4F2;border:2px solid #8FB8D0;border-radius:4px;font-size:10px;color:#3A6079}
.el-door{background:#C69B6D;border:2px solid #A67C4E;border-radius:4px;font-size:10px;color:#5A3E20}
.aula-item.flat{align-items:center}
.aula-item.vert .el-label{writing-mode:vertical-rl;transform:rotate(180deg)}
.el-label{pointer-events:none;padding:0 4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-align:center}
.el-del,.el-rot{position:absolute;width:20px;height:20px;border-radius:50%;border:0;color:#fff;font-size:11px;cursor:pointer;display:none;align-items:center;justify-content:center;line-height:1;z-index:5}
.el-del{top:-8px;right:-8px;background:var(--low)}
.el-rot{top:-8px;right:16px;background:var(--accent)}
.aula-item:hover .el-del,.aula-item:hover .el-rot{display:flex}
@media(max-width:700px){.aula-tools{gap:12px}}

.day-atts{margin-top:6px}
.wk-att{display:inline-block;margin-top:3px;font-size:11.5px;font-weight:600;color:#2D6A9F;background:#EAF1F8;border-radius:8px;padding:1px 6px;cursor:zoom-in}

.av-bar{display:flex;align-items:center;gap:10px;padding:10px 14px}
.av-bar button{font:inherit;font-size:18px;width:40px;height:40px;border-radius:50%;border:1px solid #2A4238;background:transparent;color:#EAF0EC;cursor:pointer}
.av-nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw}
.av-n{color:#9FB2A8;font-size:13px}
.av-stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:0 8px 8px}

.av-stage video{max-width:100%;max-height:100%}
.av-msg{text-align:center;color:#C9D6CF;max-width:520px}
.av-load{color:#9FB2A8}
.av-nav{position:absolute;top:50%;transform:translateY(-50%);width:54px;height:54px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:34px;cursor:pointer}
.av-nav.prev{left:12px}.av-nav.next{right:12px}
/* comentarios, diana, modo alumno */
.cm-field{margin-top:12px}
.cm-text{min-height:52px;resize:vertical}
.cm-dot{position:absolute;left:3px;bottom:3px;width:7px;height:7px;border-radius:50%;background:#2D6A9F;pointer-events:none}
.stu-cmt{margin:4px 0 6px;padding:7px 10px;border-left:3px solid #2D6A9F;background:#F3F7FB;border-radius:0 8px 8px 0;font-size:14px}
.stu-diana{max-width:260px;margin:6px 0}
#dianaBox{text-align:center}
.diana text{font-family:var(--font-ui)}
.kid-mode{position:fixed;inset:0;z-index:2000;background:#FFFDF6;overflow:auto;padding:20px max(16px,4vw) 40px}
.kid-top{display:flex;align-items:center;gap:12px;position:sticky;top:-20px;background:#FFFDF6;padding:10px 0 12px;z-index:1}
.kid-who{font-size:15px;color:#6B7A72}
.kid-t{font-size:clamp(20px,3vw,30px);font-weight:700;font-family:var(--font-display)}

.kid-items{display:flex;flex-direction:column;gap:18px;max-width:900px;margin:0 auto}
.kid-item{background:#fff;border:2px solid #EFE6CC;border-radius:20px;padding:16px 18px}
.kid-q{font-size:clamp(18px,2.6vw,26px);font-weight:600;margin-bottom:12px}
.kid-opts{display:flex;flex-wrap:wrap;gap:12px}
.kid-opt{flex:1;min-width:110px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 10px;border:3px solid #E6E1D2;border-radius:18px;background:#fff;font:inherit;font-size:16px;cursor:pointer}
.kid-opt.on{border-color:#E4A11B;background:#FFF3D6;font-weight:700;transform:scale(1.03)}
.kid-face{font-size:clamp(22px,4vw,42px);line-height:1;letter-spacing:-2px}
.kid-diana{text-align:center;margin:24px auto 0}
.kid-foot{text-align:center;color:#6B7A72;margin-top:24px}
/* gráficas de la ficha */
.ev-card svg{display:block;overflow:visible;max-width:720px}
.ev-card svg text{font-family:var(--font-ui)}
.ev-legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;margin-top:4px;color:#4A5A52}
.ev-legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.ev-legend i.dash{width:16px;height:0;border-top:2px dashed #8C9892;border-radius:0}
/* estadísticas */
.st-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:10px 0 14px}
.st-tile{background:#fff;border:1px solid var(--rule);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.st-n{font-size:30px;font-weight:700;font-family:var(--font-display);line-height:1.1}
.st-l{font-size:13px;color:var(--muted)}
.st-d{font-size:12.5px;color:var(--muted)}
.st-d.up{color:#1F6B4F}.st-d.down{color:#B4232C}
.st-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.st-grid .card{margin:0}
.st-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid #EEF1EE;font-size:14px}
.st-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-code{font-family:var(--font-mono);color:var(--accent);width:34px;flex:none}
.st-bar{flex:1.2;height:8px;background:#EEF1EE;border-radius:4px;overflow:hidden;min-width:60px}
.st-bar i{display:block;height:100%;border-radius:4px}
.st-v{width:40px;text-align:right;font-family:var(--font-mono);font-size:13px}
.st-low{font-size:12px;color:var(--muted);width:56px;text-align:right}
.st-watch{cursor:pointer}.st-watch:hover{background:#F7F9F7}
.st-why{font-size:12.5px;color:#8A3A3F;text-align:right}
/* herramientas de aula */
.tools-btn{gap:6px}
.tools-mode{position:fixed;inset:0;z-index:1500;background:#13221C;color:#EAF0EC;display:flex;flex-direction:column}
.tl-top{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #2A4238;flex-wrap:wrap}
.tl-tabs{display:flex;gap:6px;flex-wrap:wrap}
.tl-tabs button{font:inherit;font-size:16px;padding:9px 16px;border-radius:10px;border:1px solid #2A4238;background:transparent;color:#C9D6CF;cursor:pointer}
.tl-tabs button.on{background:#E4A11B;color:#16241F;border-color:#E4A11B;font-weight:700}
.tl-class{margin-left:auto;color:#9FB2A8}
.tl-close{font:inherit;font-size:20px;width:42px;height:42px;border-radius:50%;border:1px solid #2A4238;background:transparent;color:#EAF0EC;cursor:pointer}
.tl-body{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:20px}
.tl-pick{text-align:center;width:100%}
.tl-name{font-size:clamp(36px,7vw,96px);font-weight:800;font-family:var(--font-display);min-height:1.3em;margin-bottom:28px;transition:transform .2s}
.spinning .tl-name{color:#9FB2A8}
.tl-name.pop{animation:tlpop .45s ease-out}
@keyframes tlpop{0%{transform:scale(.7);opacity:.3}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.tl-go{font:inherit;font-size:22px;font-weight:700;padding:16px 34px;border-radius:16px;border:0;background:#E4A11B;color:#16241F;cursor:pointer}
.tl-go.small{font-size:16px;padding:10px 18px}
.tl-opts{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin-top:22px;color:#C9D6CF}
.tl-hist{margin:26px auto 0;max-width:900px;color:#9FB2A8;font-size:14px;line-height:2}
.tl-hist em{font-style:normal;background:#1F3329;border-radius:8px;padding:3px 8px;margin:0 3px;color:#EAF0EC}
.tl-link{font:inherit;background:none;border:0;color:#E4A11B;cursor:pointer;text-decoration:underline;margin-left:8px}
.tl-groups{width:100%;max-width:1200px;align-self:flex-start}
.tl-gbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px;color:#C9D6CF}
.tl-gbar .seg{border-color:#2A4238}.tl-gbar .seg-btn{background:transparent;color:#C9D6CF}.tl-gbar .seg-btn.on{background:#E4A11B;color:#16241F}
.tl-step{display:flex;align-items:center;gap:10px}
.tl-step button{font:inherit;font-size:20px;width:38px;height:38px;border-radius:50%;border:1px solid #2A4238;background:transparent;color:#EAF0EC;cursor:pointer}
.tl-step b{font-size:26px;min-width:30px;text-align:center}
.tl-gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.tl-gcard{background:#1F3329;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;font-size:17px}
.tl-gcard b{color:#E4A11B;font-size:15px;text-transform:uppercase;letter-spacing:.05em}
.tl-hint{color:#9FB2A8;text-align:center}
.tl-timer{position:relative;display:flex;flex-direction:column;align-items:center}
.tm-svg{width:min(70vmin,420px);height:auto}
.tm-disp{position:absolute;top:calc(min(70vmin,420px)/2);transform:translateY(-50%);font-size:clamp(48px,12vmin,110px);font-weight:800;font-family:var(--font-mono);letter-spacing:.02em}
.tm-ctrl{display:flex;gap:14px;align-items:center;margin-top:18px}
.tm-pre{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:18px}
.tm-pre button{font:inherit;font-size:15px;padding:8px 14px;border-radius:10px;border:1px solid #2A4238;background:transparent;color:#C9D6CF;cursor:pointer}
.tm-pre button.on{border-color:#E4A11B;color:#E4A11B}
.tools-mode.tm-end .tm-disp{color:#FF6B5E;animation:tmblink .8s steps(2) 6}
@keyframes tmblink{50%{opacity:.25}}
/* página de tarea */
#app.focus .top{padding-bottom:14px}
.te{max-width:860px;margin:0 auto}
.te-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
#app .te-title{font-size:24px}
.te-err{background:#FDF1F1;border:1px solid #E9B9BB;color:#B4232C;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-weight:600;font-size:15px}
.te-card{margin-bottom:12px;padding:16px}
#app .te-h{font-size:17px;margin:0 0 10px;display:inline-block}
.te-h small,.te-lbl small,.te-more summary small{font-family:var(--font-ui);font-weight:400;font-size:13px;color:var(--muted);letter-spacing:0;text-transform:none;margin-left:6px}
.te-lbl{display:block;font-size:13.5px;font-weight:600;color:var(--muted);margin-bottom:5px}
.te-name{font-size:19px;padding:11px 12px}
.te-help{color:var(--muted);font-size:14px;margin:10px 0 0}
.te-count{font-family:var(--font-ui);font-weight:400;font-size:13px;color:var(--accent);margin-left:8px}
.te-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.te-grid label,.te-new{display:block;min-width:0}
.te-new{margin-top:12px}
.te-chips{display:flex;flex-wrap:wrap;gap:8px}
.te-chip{font:inherit;font-size:14.5px;padding:8px 14px;border-radius:999px;border:1.5px solid var(--rule);background:#fff;color:var(--ink);cursor:pointer;min-height:40px}
.te-chip.mono{font-family:var(--font-mono);font-size:14px;padding:8px 12px;border-radius:9px;min-width:52px}
.te-chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.te-critlist{margin-top:12px}
.te-crit{display:flex;gap:10px;font-size:14.5px;padding:5px 0;border-top:1px solid #EEF1EE;line-height:1.35}
.te-crit b{font-family:var(--font-mono);color:var(--accent);flex:none;width:34px}
.te-types{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.te-kinds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.te-type{display:flex;flex-direction:column;gap:3px;text-align:left;font:inherit;padding:11px 12px;border:1.5px solid var(--rule);border-radius:11px;background:#fff;color:var(--ink);cursor:pointer;min-height:64px}
.te-type b{font-family:var(--font-display);font-size:15px}
.te-type span{font-size:12.5px;color:var(--muted);line-height:1.3}
.te-type.on{border-color:var(--accent);background:var(--accent-soft)}
.te-type.on b{color:var(--accent)}
.te-weight{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-top:14px}
.te-weight .w-pct{display:flex;align-items:center;gap:6px}

.te-weight .te-help{padding-bottom:10px}
.te .td-add .inp[type=date]{max-width:180px}.te .td-add .inp[type=time]{max-width:130px}
.te-more summary{cursor:pointer;list-style:none;display:flex;align-items:baseline;gap:4px;flex-wrap:wrap}
.te-more summary::-webkit-details-marker{display:none}
.te-more summary::before{content:'▸';color:var(--muted);margin-right:6px}
.te-more[open] summary::before{content:'▾'}
.te-more summary .te-h{margin:0;font-family:var(--font-display);font-weight:800;letter-spacing:-0.02em}
.te-more label{display:block;margin-top:12px}
.te-more textarea{min-height:64px;resize:vertical}
.te-foot{position:sticky;bottom:0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--paper);padding:12px 0 14px;border-top:1px solid var(--rule);margin-top:4px;z-index:5}
@media (max-width:820px){ .te-grid{grid-template-columns:repeat(2,minmax(0,1fr))} .te-types{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:560px){
  .te-kinds{grid-template-columns:1fr}
  .te-type{min-height:0}

  .te-foot .btn{flex:1;justify-content:center;text-align:center}

}

.w-pct{display:inline-flex;align-items:center;gap:3px;font-family:var(--font-mono);font-size:13px}

.w-bar.bad{background:#FDF1F1;border-color:#E9B9BB}

.tpl-foot{font-size:13.5px;color:var(--accent);background:var(--accent-soft);border-radius:10px;padding:10px 14px;margin:12px 0 0;font-weight:500}
.dua-list{list-style:none;margin:8px 0 0;padding:0}

td.mark.na{background:repeating-linear-gradient(45deg,#F4F6F3,#F4F6F3 6px,#EEF1EE 6px,#EEF1EE 12px);color:#B9C4BC;text-align:center;font-family:var(--font-mono)}
.pill.ACS-sig{background:#FCF1D8;color:#8A6206}
.rownum{font-family:var(--font-mono);font-size:12px;color:var(--muted);margin-right:7px;letter-spacing:.03em}

button.linklike{font-family:var(--font-ui);font-size:inherit;text-align:left;background:none;border:0;color:var(--ink);cursor:pointer;padding:0}

.score-inline{font-family:var(--font-mono);font-size:15px;font-weight:500}

/* evaluación inicial: diagnóstico */

button.diag-btn.on.d-ep{background:#E4A11B;border-color:#E4A11B;color:#16241F}

td.diag-cell{padding:0}

button.diag-cell-btn.d-ni{background:#F7EAE6;color:#B4472F;font-weight:600}
button.diag-cell-btn.d-ep{background:#FCF1D8;color:#8A6206;font-weight:600}
button.diag-cell-btn.d-co{background:#D8EAE0;color:#1F6B4F;font-weight:600}
input.diag-note{width:100%;border:0;background:transparent;font-family:var(--font-ui);font-size:13px;padding:8px 8px;color:var(--ink)}

.stack{display:flex;height:22px;border-radius:5px;overflow:hidden;background:#EEF1EE;margin:0 4px}

.stack i.d-ni{background:#D98B79}
.stack i.d-ep{background:#E4A11B}
.stack i.d-co{background:#4E9A76}

/* editor de rúbricas: tabla de ítems × grados */
table.rub{border-collapse:separate;border-spacing:0;width:100%;font-size:15.5px;background:#fff}
table.rub th,table.rub td{border-bottom:1px solid var(--rule);border-right:1px solid var(--rule);vertical-align:top;padding:8px}
table.rub th{background:#F0F3F0;font-family:var(--font-mono);font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:500;text-align:center}
table.rub th.stick,table.rub td.stick{position:sticky;left:0;z-index:2;background:#fff;min-width:190px;max-width:230px;box-shadow:1px 0 0 var(--rule);text-align:left}

table.rub textarea,table.rub input,table.rub select{font-family:var(--font-ui);color:var(--ink);background:#fff;border:1px solid var(--rule);border-radius:6px;padding:6px 7px;font-size:15px;width:100%;resize:vertical}

table.rub .lvl-label{text-align:center;font-family:var(--font-ui);text-transform:none;letter-spacing:0;font-weight:600;color:var(--ink);font-size:15px}

/* calificar con rúbrica */
.grade-item{border-top:1px solid var(--rule);padding-top:10px;margin-top:10px}

.level-opt[aria-pressed="true"] span{color:var(--ink)}
button.lvl-btn{font-family:var(--font-mono);font-size:14px;padding:5px 10px;border-radius:7px;border:1px solid var(--rule);background:#fff;color:var(--muted);cursor:pointer}
button.lvl-btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}

.adj{color:#8A6206!important}

.tl-val.adj{background:#FCF1D8;border-color:#EEDCA8}
.score.adj{color:#8A6206}
i.dot{display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--mark);vertical-align:super;margin-left:3px}
input.tl-val::placeholder{color:#B9C4BC}

/* ---------- fichas de alumno (móvil) ---------- */
.stu-card{border:1px solid var(--rule);border-radius:10px;background:#fff;margin-bottom:8px;overflow:hidden}
.stu-head{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#F7F9F7;border-bottom:1px solid var(--rule)}

.task-line{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--rule)}

  background:#fff;border:1px solid var(--rule);border-radius:7px;padding:7px 8px;width:100%;resize:vertical}

/* ---------- tutoría ---------- */
.tut-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--rule);cursor:pointer}

.count{font-family:var(--font-mono);font-size:13px;padding:3px 8px;border-radius:20px;border:1px solid transparent;white-space:nowrap}
.count.ok{background:var(--accent-soft);color:var(--accent);border-color:#B8D8C6}
.count.mid{background:#FCF1D8;color:#8A6206;border-color:#EEDCA8}
.count.no{background:#F7EAE6;color:var(--low);border-color:#E7CFC9}

.progress{height:8px;border-radius:4px;background:#EEF1EE;overflow:hidden;margin-top:8px;display:flex;gap:2px}

.gm-scroll{overflow:auto;max-height:74vh}

/* diversidad: tipología y actuaciones de la norma */

.dv-sec:first-of-type{border-top:0;margin-top:4px;padding-top:0}

/* ---------- código de color por grado (v3.8): rojo · ámbar · lima · verde · azul ---------- */
.tn0{--tf:#A8402A;--tb:#FBE9E4;--td:#EBC2B7;--ts:#C8553B}

/* rúbrica al calificar */
.gm-bar{position:sticky;top:-18px;z-index:5;background:#fff;display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding:8px 0 10px;margin-bottom:6px;border-bottom:1px solid var(--rule)}
.gm-score{display:flex;align-items:center;gap:9px;padding:4px 12px;border-radius:10px;background:var(--tb,#F0F2F0);color:var(--tf,var(--muted));border:1px solid var(--td,var(--rule))}

.gm-score small{font-size:12.5px;line-height:1.2}
.gm-dots{display:flex;gap:5px;align-items:center;flex-wrap:wrap}

.gm-left{font-size:13.5px;color:var(--muted)}
.grade-matrix thead th[class*="tn"]{background:var(--tb);color:var(--tf);border-color:var(--td);border-top:4px solid var(--ts)}
.gm-h{display:flex;flex-direction:column;align-items:center;gap:3px}
.gm-h b{font-size:13.5px;font-weight:600}

.grade-matrix td.gm-item .gm-meta .chip{margin-top:0}
.gm-picked{display:none;font-size:13px;line-height:1.35;color:var(--muted);margin-top:6px}
.gm-cell .gm-lvl{display:flex;align-items:center;gap:6px;color:var(--tf)}
.gm-cell .gm-name,.gm-cell .gm-short{display:none}
.gm-cell:hover{background:var(--tb)}
.gm-cell.on{background:var(--tb);border-color:var(--ts);box-shadow:inset 0 0 0 2px var(--ts)}
.gm-cell.on .gm-lvl{color:var(--tf)}
.gm-cell.on .gm-desc{color:var(--ink)}
.gm-cell.on .gm-lvl::after{content:"✓";margin-left:auto;font-size:15px}
.grade-matrix tr.has-sel .gm-cell:not(.on){opacity:.5}
.grade-matrix tr.has-sel .gm-cell:not(.on):hover{opacity:1}
.grade-matrix.compact .gm-desc,.grade-matrix.compact .gm-cell .lv-bars{display:none}
.grade-matrix.compact .gm-picked{display:block}
.grade-matrix.compact .gm-cell .gm-inner{min-height:0;align-items:center;justify-content:center;padding:10px 4px}
.grade-matrix.compact .gm-cell .gm-lvl{flex-direction:column;gap:2px;width:auto}
.grade-matrix.compact .gm-cell .gm-short{display:block;font-family:var(--font-ui);font-size:18px;font-weight:600;line-height:1.1}
.grade-matrix.compact .gm-cell.on .gm-lvl::after{display:none}

button.lvl-btn[class*="tn"]{color:var(--tf);border-color:var(--td)}

/* tablas de notas: mapa de calor con el mismo código de color */

.tone-legend{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:10px;font-size:13px;color:var(--muted)}

/* editor de instrumentos */

/* vista de la rúbrica en Plantillas */
.rv-wrap{overflow-x:auto;margin-top:12px}

table.rv th,table.rv td{border-radius:8px;padding:8px 10px;font-size:13.5px;line-height:1.35;vertical-align:top;text-align:left;font-family:var(--font-ui)}

/* ---------- tablas blandas (v3.10): filas separadas, esquinas redondeadas y un bisel suave ---------- */
:root{--bevel:inset 0 1px 0 rgba(255,255,255,.85),inset 0 -2px 0 rgba(22,36,31,.08),0 1px 2px rgba(22,36,31,.07)}

   Tipología de ACNEAE: Decreto 188/2017, arts. 21 a 26 bis, en la redacción del Decreto 164/2022,
   tal como figura en los modelos de informe de la Orden ECD/913/2023.
   Código de una etiqueta: 'CATEGORÍA' o 'CATEGORÍA.SUBTIPO' (p. ej. 'NEE.TEA', 'TAA.CIL'). */
const ACNEAE = [
  {code:'NEE', art:'art. 21', name:'Necesidades educativas especiales', subs:[
    ['DA','Discapacidad auditiva'], ['DV','Discapacidad visual'], ['DF','Discapacidad física: motora y orgánica'],

    ['CON','Incorporación tardía al sistema educativo con desconocimiento grave de la lengua de aprendizaje']]},

/* etiquetas de versiones anteriores → tipología de la norma */
const COND_OLD = {TEA:'NEE.TEA', TDAH:'TAA.TDAH', DEA:'TAA', TDL:'TDLC', INC:'IT'};
function condDef(code){
  const parts = String(code||'').split('.'), cat = ACNEAE.find(x=>x.code===parts[0]);
  if(!cat) return {code:code, name:code, cat:null, sub:null, catName:code};
  const sub = parts[1] ? cat.subs.find(x=>x[0]===parts[1]) : null;
  return {code: sub ? cat.code+'·'+sub[0] : cat.code, name: sub ? cat.name+': '+sub[1] : cat.name,
          cat:cat.code, sub: sub ? sub[0] : null, catName:cat.name, subName: sub ? sub[1] : ''};
}
/* quita la categoría genérica cuando ya hay un subtipo suyo marcado, y ordena como en la norma */
function normConds(list){
  const out = []; (list||[]).forEach(x=>{ const n = COND_OLD[x] || x; if(out.indexOf(n)<0) out.push(n); });
  const order = x=>{ const d = condDef(x), ci = ACNEAE.findIndex(k=>k.code===d.cat);
    return (ci<0?99:ci)*100 + (d.sub ? ACNEAE[ci].subs.findIndex(k=>k[0]===d.sub)+1 : 0); };
  return out.filter(x=>x.indexOf('.')>-1 || !out.some(y=>y.indexOf(x+'.')===0)).sort((a,b)=>order(a)-order(b));
}

function parseDate(iso){ const p=iso.split('-'); return new Date(Number(p[0]), Number(p[1])-1, Number(p[2])); }
function toISO(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDays(iso, n){ const d=parseDate(iso); d.setDate(d.getDate()+n); return toISO(d); }
function dowMon(iso){ const wd=parseDate(iso).getDay(); return (wd+6)%7; }   // 0=lunes
function weekStart(iso){ return addDays(iso, -dowMon(iso)); }
function weekDays(iso){ const s=weekStart(iso); return Array.from({length:7},(_,i)=>addDays(s,i)); }
function fmtDayLong(iso){ const d=parseDate(iso); return DAY_NAMES[dowMon(iso)]+' '+d.getDate()+' de '+MONTH_NAMES[d.getMonth()]; }

const LIST_VIEWS = ['alumnos','unidades','trimestre','diversidad','plantillas','tutorias'];
function rememberSel(){
  const c = course(); if(!c) return;
  if(!state.lastSel || typeof state.lastSel!=='object') state.lastSel = {};
  const prev = state.lastSel[c.id] || {};
  state.lastSel[c.id] = {area:state.activeArea || prev.area || null, period:state.activePeriod || prev.period || null,
    view: LIST_VIEWS.includes(state.view) ? state.view : (prev.view || 'alumnos')};
  state.lastCourse = c.id;
}
/* entrar en una clase. keep=true: cambio rápido desde la cabecera, se queda en la misma área, evaluación y pestaña */
function enterCourse(cid, keep){
  const from = course(), to = state.courses.find(x=>x.id===cid); if(!to) return;
  const fromArea = from ? areaId() : null, fromP = from ? period() : null;
  const fromIdx = (from && fromP) ? from.periods.findIndex(x=>x.id===fromP.id) : -1;
  const fromUnit = (from && state.activeUnit) ? (from.units||[]).find(u=>u.id===state.activeUnit) : null;
  const mem = (state.lastSel||{})[cid] || {};
  state.activeCourse = cid; state.editor = null;
  if(keep && from){
    state.activeArea = to.areas.includes(fromArea) ? fromArea : (to.areas.includes(mem.area) ? mem.area : null);
    const byName = fromP ? to.periods.find(x=>x.name===fromP.name) : null;
    const np = byName || (fromIdx>=0 ? to.periods[fromIdx] : null);
    state.activePeriod = np ? np.id : (mem.period || null);
    if(state.view==='unidad' || state.view==='editorInstr'){
      const twin = fromUnit ? (to.units||[]).find(u=>u.name===fromUnit.name && u.areaId===state.activeArea && u.periodId===state.activePeriod) : null;
      if(twin){ state.activeUnit = twin.id; state.view = 'unidad'; state.unitSub = state.unitSub || 'tareas'; }
      else { state.activeUnit = null; state.view = 'unidades'; }
    } else if(state.view==='alumno') state.view = 'alumnos';
    else if(state.view==='tutoriaAlumno') state.view = 'tutorias';
    else if(!views[state.view] || state.view==='clases') state.view = 'alumnos';
  } else {
    state.activeArea = to.areas.includes(mem.area) ? mem.area : null;
    state.activePeriod = to.periods.some(x=>x.id===mem.period) ? mem.period : null;
    state.activeUnit = null;
    state.view = mem.view && views[mem.view] ? mem.view : 'alumnos';
  }
  normalize(); leaveStale(); rememberSel();
}

function calif(v, scale){
  if(v==null) return null;
  let out = scale[0];

/* Funciona en dos entornos: dentro de Claude usa su almacenamiento;
   como archivo .html descargado, el del propio navegador. */
function localBox(){
  try{ const l = window.localStorage; l.setItem('__t','1'); l.removeItem('__t'); return l; }
  catch(e){ return null; }
}
const store = {
  async get(k){
    if(typeof window.storage!=='undefined' && window.storage && window.storage.get) return window.storage.get(k);
    const l = localBox();
    if(!l) throw new Error('sin almacenamiento');
    const v = l.getItem(k);
    if(v==null) throw new Error('sin datos');
    return {key:k, value:v};
  },
  async set(k,v){
    if(typeof window.storage!=='undefined' && window.storage && window.storage.set) return window.storage.set(k,v);
    const l = localBox();
    if(!l) throw new Error('sin almacenamiento');
    l.setItem(k,v);
    return {key:k, value:v};
  }
};

/* ---------------------------------------------------------------
   Archivo de datos sincronizado (File System Access API).
   Permite dejar el archivo .json en la carpeta de Drive/OneDrive:
   la app escribe en él sola y lo lee al abrir, sin importar ni exportar.
   --------------------------------------------------------------- */
const fsOK = (typeof window!=='undefined' && typeof window.showSaveFilePicker === 'function');
let fileHandle = null;
let fileState = 'off';        // off · ready · need-permission
let fileName = '';

function idb(){
  return new Promise((res,rej)=>{
    try{
      const r = window.indexedDB.open('cuaderno-fs', 1);
      r.onupgradeneeded = ()=>{ try{ r.result.createObjectStore('h'); }catch(e){} };
      r.onsuccess = ()=>res(r.result);
      r.onerror = ()=>rej(r.error);
    }catch(e){ rej(e); }
  });
}
function idbOp(mode, fn){
  return idb().then(db=>new Promise((res,rej)=>{
    const t = db.transaction('h', mode), st = t.objectStore('h');
    const q = fn(st);
    t.oncomplete = ()=>res(q && q.result);
    t.onerror = ()=>rej(t.error);
  }));
}
/* si el navegador no deja usar IndexedDB, la conexión sigue valiendo
   para esta sesión: solo se pierde el recordar el archivo al reabrir */
const idbSet = (k,v)=>idbOp('readwrite', st=>st.put(v,k)).catch(()=>null);
const idbGet = k=>idbOp('readonly', st=>st.get(k)).catch(()=>null);
const idbDel = k=>idbOp('readwrite', st=>st.delete(k)).catch(()=>null);

async function fileWrite(){
  if(!fileHandle || fileState!=='ready') return;
  try{
    const w = await fileHandle.createWritable();
    await w.write(JSON.stringify(state));
    await w.close();
  }catch(e){ fileState = 'need-permission'; }
}
async function fileRead(){
  if(!fileHandle) return null;
  try{
    const f = await fileHandle.getFile();
    const txt = await f.text();
    return txt ? JSON.parse(txt) : null;
  }catch(e){ return null; }
}
async function filePerm(request){
  if(!fileHandle) return 'off';
  try{
    let p = await fileHandle.queryPermission({mode:'readwrite'});
    if(p!=='granted' && request) p = await fileHandle.requestPermission({mode:'readwrite'});
    fileState = p==='granted' ? 'ready' : 'need-permission';
  }catch(e){ fileState = 'need-permission'; }
  return fileState;
}

   - Permiso drive.file: la app solo ve el archivo que ella misma crea.

   - Carga al conectar/abrir, subida automática tras cada cambio,
     comprobación periódica y aviso de conflicto si dos equipos editan
     a la vez. Sin conexión sigue guardando en local y sube al volver.
   ===================================================================== */
const GD_CLIENT_ID = '957137579068-rl46dkd3q3bovoqqtq26al2j2k85pqib.apps.googleusercontent.com';
const GD_SCOPE = 'https://www.googleapis.com/auth/drive.file';
const GD_FILE = 'cuaderno-datos.json';
const GD_LS = 'cuaderno-gdrive';
const GD_API = 'https://www.googleapis.com/drive/v3';
const GD_UP = 'https://www.googleapis.com/upload/drive/v3';
const GD_DATA_KEYS = ['courses','curriculo','schedule','sessions','teacherTT','templates','areaColors','colorBy','markDefs','upMethods','holidays','attFolderId'];
const GD_UI_KEYS = ['view','homeTab','planView','planDate','planSub','activeCourse','activeArea','activePeriod','activeUnit',
  'editor','viewStudent','tutStudent','tutFromHome','unitSub','triSub','divSub','alumSub','gridMode','editMode',
  'instrMode','rubCompact','upView','upOpen','sabOnly','sabCycle','editWeights','homeTutCourse','homeAjCourse','attDate','lastSel','lastCourse','taskEd'];

const gd = {
  status:'off',          // off · need · ok · sync · offline · error · conflict
  connected:false, token:null, exp:0, email:'',
  fileId:null, base:null, baseHash:null, lastSync:0,
  busy:false, again:false, timer:null, client:null, waiters:null, err:'', hadToken:false
};
function gdAvailable(){
  const h = location.hostname;
  return location.protocol==='https:' || h==='localhost' || h==='127.0.0.1';
}
function gdPersist(){
  try{ localStorage.setItem(GD_LS, JSON.stringify({connected:gd.connected, token:gd.token, exp:gd.exp, email:gd.email,
    fileId:gd.fileId, base:gd.base, baseHash:gd.baseHash, lastSync:gd.lastSync})); }catch(e){}
}
function gdRestore(){
  try{ const o = JSON.parse(localStorage.getItem(GD_LS)||'null'); if(o) Object.assign(gd, o); }catch(e){}
}
function gdTokenOk(){ return !!gd.token && Date.now() < gd.exp - 60000; }
function gdHash(){
  const o = {}; GD_DATA_KEYS.forEach(k=>{ o[k] = state[k]; });
  const s = JSON.stringify(o);
  let h = 5381; for(let i=0;i<s.length;i++) h = ((h<<5)+h + s.charCodeAt(i))|0;
  return String(h)+':'+s.length;
}
function gdDirty(){ return gdHash() !== gd.baseHash; }
function gdHasLocalData(){ return (state.courses||[]).length>0; }
function gdSet(st, err){ gd.status = st; gd.err = err||''; gdRender(); }

/* ---- Google Identity Services ---- */
function gdLoadGIS(){
  return new Promise((res, rej)=>{
    let n = 0;
    const tick = ()=>{
      if(window.google && google.accounts && google.accounts.oauth2) return res();
      if(++n > 100) return rej(new Error('No se ha podido cargar el acceso de Google. Revisa la conexión.'));
      setTimeout(tick, 100);
    };
    tick();
  });
}
async function gdGetToken(){
  await gdLoadGIS();
  if(!gd.client){
    gd.client = google.accounts.oauth2.initTokenClient({
      client_id: GD_CLIENT_ID, scope: GD_SCOPE,
      callback: resp=>{
        const w = gd.waiters; gd.waiters = null; if(!w) return;
        if(resp.error) return w.rej(new Error(resp.error));
        if(!google.accounts.oauth2.hasGrantedAllScopes(resp, GD_SCOPE))
          return w.rej(new Error('Falta el permiso de Drive. Vuelve a conectar y marca la casilla de Google Drive.'));
        gd.token = resp.access_token;
        gd.exp = Date.now() + (Number(resp.expires_in)||3600)*1000;
        gd.hadToken = true;
        w.res();
      },
      error_callback: err=>{
        const w = gd.waiters; gd.waiters = null; if(!w) return;
        w.rej(new Error(err && err.type==='popup_closed' ? 'Se cerró la ventana de Google antes de terminar.'
          : err && err.type==='popup_failed_to_open' ? 'El navegador ha bloqueado la ventana de Google. Permite las ventanas emergentes para esta página.'
          : 'No se ha podido iniciar sesión con Google.'));
      }
    });
  }
  return new Promise((res, rej)=>{
    gd.waiters = {res, rej};
    const opts = {prompt:''};
    if(gd.email) opts.login_hint = gd.email;
    gd.client.requestAccessToken(opts);
  });
}

/* ---- llamadas a Drive ---- */
async function gdFetch(url, opts){
  opts = opts || {};
  opts.headers = Object.assign({Authorization:'Bearer '+gd.token}, opts.headers||{});
  let r;
  try{ r = await fetch(url, opts); }
  catch(e){ const x = new Error('offline'); x.offline = true; throw x; }
  if(r.status===401){ gd.token = null; gd.exp = 0; gdPersist(); const x = new Error('auth'); x.auth = true; throw x; }
  if(!r.ok && r.status!==404){ let msg=''; try{ msg = (await r.json()).error.message; }catch(e){} throw new Error('Drive respondió '+r.status+(msg?': '+msg:'')); }
  return r;
}
function gdMetaOf(f){ return f ? {id:f.id, rev:(f.appProperties&&f.appProperties.rev)||('m'+f.modifiedTime)} : null; }
async function gdFindFile(){
  const fields = 'id,trashed,modifiedTime,appProperties';
  if(gd.fileId){
    const r = await gdFetch(GD_API+'/files/'+gd.fileId+'?fields='+fields);
    if(r.status!==404){ const f = await r.json(); if(!f.trashed) return gdMetaOf(f); }
    gd.fileId = null;
  }
  const q = encodeURIComponent("name='"+GD_FILE+"' and trashed=false");
  const r = await gdFetch(GD_API+'/files?q='+q+'&spaces=drive&orderBy=modifiedTime desc&pageSize=5&fields=files('+fields+')');
  const list = (await r.json()).files || [];
  if(!list.length) return null;
  gd.fileId = list[0].id;
  return gdMetaOf(list[0]);
}
async function gdDownload(id){
  const r = await gdFetch(GD_API+'/files/'+id+'?alt=media');
  return JSON.parse(await r.text());
}
async function gdUpload(){
  const snapshot = JSON.stringify(state);
  const hash = gdHash();
  const rev = Date.now()+'-'+Math.random().toString(36).slice(2,7);
  const meta = {appProperties:{rev:rev}};
  if(!gd.fileId){ meta.name = GD_FILE; meta.mimeType = 'application/json'; }
  const b = 'cuaderno'+Math.random().toString(36).slice(2);
  const body = '--'+b+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(meta)+
    '\r\n--'+b+'\r\nContent-Type: application/json\r\n\r\n'+snapshot+'\r\n--'+b+'--';
  const url = gd.fileId ? GD_UP+'/files/'+gd.fileId+'?uploadType=multipart&fields=id' : GD_UP+'/files?uploadType=multipart&fields=id';
  const r = await gdFetch(url, {method: gd.fileId?'PATCH':'POST', headers:{'Content-Type':'multipart/related; boundary='+b}, body:body});
  const f = await r.json();
  gd.fileId = f.id; gd.base = rev; gd.baseHash = hash; gd.lastSync = Date.now();
  gdPersist();
}
function gdApplyRemote(remote){
  const keep = {}; GD_UI_KEYS.forEach(k=>{ if(k in state) keep[k] = state[k]; });
  state = Object.assign(state, remote, keep);
  migrate(); normalize();
  try{ store.set(KEY, JSON.stringify(state)); }catch(e){}
  render();
}

/* ---- reconciliación ---- */
async function gdSync(){
  if(!gd.connected || !gdAvailable()) return;
  if(gd.busy){ gd.again = true; return; }
  if(!gdTokenOk()){ gdSet('need'); return; }
  if(!navigator.onLine){ gdSet('offline'); return; }
  gd.busy = true;
  try{
    const dirty = gdDirty();
    if(dirty) gdSet('sync');
    const meta = await gdFindFile();
    if(!meta){ await gdUpload(); gdSet('ok'); return; }
    if(meta.rev === gd.base){
      if(dirty){ gdSet('sync'); await gdUpload(); }
      gdSet('ok'); return;
    }
    /* Drive tiene una versión que este equipo no ha visto */
    if(document.querySelector('.backdrop') || state.view==='tarea'){ gd.again = true; return; }   // no pisar un formulario abierto
    const fresh = gd.base==null;
    if((!fresh && !dirty) || (fresh && !gdHasLocalData())){
      const remote = await gdDownload(meta.id);
      gdApplyRemote(remote);
      gd.base = meta.rev; gd.baseHash = gdHash(); gd.lastSync = Date.now(); gdPersist();
      gdSet('ok'); return;
    }
    gdSet('conflict');
    gdConflict(meta, fresh);
  }catch(e){
    if(e.auth) gdSet('need');
    else if(e.offline) gdSet('offline');
    else gdSet('error', e.message);
  }finally{
    gd.busy = false;
    if(gd.again){ gd.again = false; gdSchedule(800); }
  }
}
function gdSchedule(ms){
  if(!gd.connected) return;
  clearTimeout(gd.timer);
  gd.timer = setTimeout(gdSync, ms==null?1500:ms);
}
function gdConflict(meta, fresh){
  if(document.querySelector('.gd-conflict')) return;
  const wrap = openModal(`<div class="gd-conflict"></div><h3>Hay dos versiones distintas</h3>
    <p class="sub">${fresh
      ? 'Este equipo ya tenía datos y en tu Drive hay otra copia del cuaderno.'
      : 'Desde otro equipo se han guardado cambios en Drive, y en este también hay cambios que no se habían subido.'}
      Elige con cuál te quedas. Antes, si quieres, descarga una copia de lo de este equipo.</p>
    <div class="row" style="flex-wrap:wrap;gap:8px;margin-top:6px">
      <button class="btn" data-gdc="remote">Usar lo de Drive</button>
      <button class="btn ghost" data-gdc="local">Subir lo de este equipo</button>
      <button class="btn ghost" data-gdc="backup">Descargar copia de este equipo</button>
    </div>`, null);
  wrap.addEventListener('click', async e=>{
    const b = e.target.closest('[data-gdc]'); if(!b) return;
    e.preventDefault();
    if(b.dataset.gdc==='backup'){ gdLocalBackup(); return; }
    wrap.remove();
    gd.busy = true;
    try{
      if(b.dataset.gdc==='remote'){
        const remote = await gdDownload(meta.id);
        gdApplyRemote(remote);
        gd.base = meta.rev; gd.baseHash = gdHash(); gd.lastSync = Date.now(); gdPersist();
      } else {
        await gdUpload();
      }
      gdSet('ok');
    }catch(err){ gdSet(err.auth?'need':(err.offline?'offline':'error'), err.message); }
    finally{ gd.busy = false; }
  });
}
function gdLocalBackup(){
  try{
    const blob = new Blob([JSON.stringify(Object.assign({app:'cuaderno-lomloe', version:1, scope:'all', date:new Date().toISOString()}, state))], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'cuaderno_este_equipo_'+today()+'.json'; a.click();
  }catch(e){}
}

/* ---- conexión ---- */
async function gdConnect(){
  if(!gdAvailable()){ alertBox('La sincronización con Drive funciona abriendo la app desde su dirección web, no como archivo suelto.'); return; }
  try{
    gdSet('sync');
    await gdGetToken();
    gd.connected = true;
    gdListen();
    if(!gd.email){
      try{ const r = await gdFetch(GD_API+'/about?fields=user(emailAddress)'); gd.email = ((await r.json()).user||{}).emailAddress||''; }catch(e){}
    }
    gdPersist();
    await gdSync();
  }catch(e){
    gdSet(gd.connected?'need':'off', e.message);
    if(e.message) alertBox(e.message);
  }
}
function gdDisconnect(){
  confirmDo('¿Desconectar Google Drive?','Los datos siguen en este equipo y en tu Drive, pero este equipo deja de sincronizarse.', ()=>{
    try{ if(gd.token && window.google && google.accounts) google.accounts.oauth2.revoke(gd.token, ()=>{}); }catch(e){}
    Object.assign(gd, {connected:false, token:null, exp:0, fileId:null, base:null, baseHash:null, lastSync:0, email:''});
    gdPersist(); gdSet('off');
  });
}
function gdInit(){
  if(!gdAvailable()){ gdRender(); return; }
  gdRestore();
  if(!gd.connected){ gdSet('off'); return; }
  if(gdTokenOk()){ gd.hadToken = true; gdSync(); }
  else gdSet('need');
  gdLoadGIS().catch(()=>{});
  gdListen();
}
let gdListening = false;
function gdListen(){
  if(gdListening) return; gdListening = true;
  setInterval(()=>{ if(document.visibilityState==='visible' && gdTokenOk()) gdSync(); }, 60000);
  document.addEventListener('visibilitychange', ()=>{ if(gdTokenOk()) gdSync(); });
  window.addEventListener('online', ()=>{ if(gd.status==='offline') gdSync(); });
  window.addEventListener('offline', ()=>{ if(gd.connected) gdSet('offline'); });
  window.addEventListener('beforeunload', e=>{
    if(gd.connected && gdTokenOk() && navigator.onLine && gdDirty()){ gdSync(); e.preventDefault(); e.returnValue=''; }
  });
  /* token caducado a mitad de sesión: se renueva con el siguiente clic */
  document.addEventListener('click', ()=>{
    if(gd.connected && gd.hadToken && !gdTokenOk() && navigator.onLine && !gd.waiters)
      gdGetToken().then(()=>{ gdPersist(); gdSync(); }).catch(()=>gdSet('need'));
  }, true);
}

let saveTimer=null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    state.savedAt = Date.now();
    fileWrite();
    gdSchedule();
    setTimeout(attUploadPending, 1500);
    if(memoryOnly) return;
    try{
      await store.set(KEY, JSON.stringify(state));
      const s = el('saved'); s.classList.add('on'); setTimeout(()=>s.classList.remove('on'),1200);
    }catch(e){ memoryOnly = true; }

async function load(){
  try{
    const r = await store.get(KEY);
    if(r && r.value) state = Object.assign(state, JSON.parse(r.value));
  }catch(e){}
  if(fsOK){
    try{
      const h = await idbGet('handle');
      if(h){
        fileHandle = h; fileName = h.name || 'archivo de datos';
        await filePerm(false);
        if(fileState==='ready'){
          const remote = await fileRead();
          if(remote && (Number(remote.savedAt||0) > Number(state.savedAt||0))) state = Object.assign(state, remote);
        }
      }
    }catch(e){}
  }
  if(!state.curriculo) state.curriculo = JSON.parse(JSON.stringify(CURRICULO));
  Object.keys(CURRICULO).forEach(k=>{
    if(!state.curriculo[k]){ state.curriculo[k] = JSON.parse(JSON.stringify(CURRICULO[k])); return; }
    /* si un área quedó sin criterios en una versión anterior, se cargan ahora */
    const src = CURRICULO[k], dst = state.curriculo[k];
    if(!dst.crit) dst.crit = {1:{},2:{},3:{}};
    [1,2,3].forEach(cy=>{
      if(!dst.crit[cy] || !Object.keys(dst.crit[cy]).length)
        dst.crit[cy] = JSON.parse(JSON.stringify(src.crit[cy]||{}));
    });
    if(!dst.ce || !Object.keys(dst.ce).length) dst.ce = JSON.parse(JSON.stringify(src.ce||{}));
    if(!dst.name) dst.name = src.name;
    if(!dst.short) dst.short = src.short;
  });
  state.attDate = today();
  if(!Array.isArray(state.schedule) || !state.schedule.length) state.schedule = defaultSchedule();
  if(!state.sessions || typeof state.sessions!=='object') state.sessions = {};
  if(!state.teacherTT || typeof state.teacherTT!=='object') state.teacherTT = {};
  if(!state.homeTab) state.homeTab = 'clases';
  if(!state.planView) state.planView = isNarrow() ? 'day' : 'week';
  if(!state.planDate) state.planDate = today();
  state.view = 'clases';   // la app siempre abre en el panel de inicio
  state.taskEd = null;
  /* si los datos estaban al día con Drive, las conversiones automáticas de una versión nueva
     no cuentan como cambios hechos en este equipo (evita un falso aviso de «dos versiones») */
  gdRestore();
  const wasClean = !!gd.baseHash && gdHash()===gd.baseHash;
  migrate();
  normalize();
  if(wasClean && gdHash()!==gd.baseHash){ gd.baseHash = gdHash(); gdPersist(); }
  render();
  gdInit();
}
function normalize(){
  if(!state.courses) state.courses = [];
  allInstrs(toPct);
  migrateDiv();
  if(!state.activeCourse && state.courses[0]) state.activeCourse = state.courses[0].id;
  const c = course();
  if(c){
    if(!state.activePeriod || !c.periods.some(p=>p.id===state.activePeriod)){
      const firstReal = c.periods.find(p=>!p.initial) || c.periods[0];
      state.activePeriod = firstReal ? firstReal.id : null;
    }
    if(!c.areas.includes(state.activeArea)) state.activeArea = c.areas[0] || null;
  }
}

/* =====================================================================
   MODELO
   Una tarea evaluable es la unidad de trabajo: lleva sus objetivos, sus
   actividades, sus criterios de evaluación y SU PROPIO instrumento.
   Las plantillas son solo modelos de partida reutilizables; editarlas
   nunca toca las tareas ya creadas.
   ===================================================================== */
function mkItem(name, crits, cells){
  return {id:uid(), name:name||'', crits: crits? (Array.isArray(crits)?crits.slice():[crits]).filter(Boolean) : [], weight:1, cells:cells||[]};
}
function itemCrits(it){
  if(Array.isArray(it.crits)) return it.crits;
  return it.critCode ? [it.critCode] : [];
}
function lv(label, value){ return {label:label, value:value}; }

const LEVEL_PRESETS = {
  calif:   [lv('Insuficiente',3.5), lv('Suficiente',5.5), lv('Bien',6.5), lv('Notable',8), lv('Sobresaliente',9.5)],
  dominio: [lv('Iniciado',3), lv('En desarrollo',5.5), lv('Adquirido',7.5), lv('Plenamente adquirido',9.5)]
};
function numericLevels(n){
  const out=[];
  for(let i=1;i<=n;i++) out.push(lv(String(i), Math.round((i*10/n)*10)/10));
  return out;
}
/* ---------- código de color de un grado: depende de la nota que da (IN·SU·BI·NT·SB) ---------- */
function toneOf(v){ v = Number(v); return !(v>=5) ? 0 : v<6 ? 1 : v<7 ? 2 : v<9 ? 3 : 4; }
function tn(l){ return 'tn'+toneOf(l ? l.value : null); }
function lvlRank(levels, j){ const v = levels[j].value; return levels.filter(l=>l.value<v).length; }
/* barritas tipo «cobertura»: cuantas más llenas, más alto el grado */
function lvlBars(levels, j){
  const n = levels.length, r = lvlRank(levels, j);
  return `<span class="lv-bars" aria-hidden="true">${levels.map((_,k)=>`<i class="${k<=r?'f':''}" style="height:${Math.round(5+9*(k+1)/n)}px"></i>`).join('')}</span>`;
}
/* etiqueta corta de un grado para la vista compacta: carita, número inicial, IN/SU/BI/NT/SB o su posición */
function lvlShort(levels, j){
  const l = levels[j];
  if(l.face) return l.face;
  const m = /^\s*(\d+)/.exec(l.label||''); if(m) return m[1];
  const k = DEFAULT_SCALE.find(s=>s.name.toLowerCase()===String(l.label||'').trim().toLowerCase());
  return k ? k.code : String(lvlRank(levels, j)+1);
}
function tnv(v){ return v==null ? '' : ' tn'+toneOf(v); }
function toneLegend(c){
  return `<div class="tone-legend">${c.scale.map((k,i)=>`<span>${pill(k.min, c.scale)} ${fmt2(k.min)}–${c.scale[i+1]?fmt2(c.scale[i+1].min-0.1):'10'}</span>`).join('')}
    <span><i style="display:inline-block;width:22px;height:14px;border:1px dashed #C9D2CB;border-radius:5px"></i> sin calificar</span></div>`;
}
function blankInstr(type){
  const i = {type:type||'rubric', max:10, levels:[], items:[]};
  if(i.type==='rubric'){ i.levels = LEVEL_PRESETS.calif.slice(); i.items = [mkItem('','')]; }
  if(i.type==='scale'){ i.levels = numericLevels(4); i.items = [mkItem('','')]; }

/* caritas: tres grados fijos; el valor sobre 10 solo se usa si la tarea cuenta para la nota */
const FACE_LEVELS = [{label:'Bien', value:9, face:'😊'}, {label:'Regular', value:6, face:'😐'}, {label:'Mejorable', value:3, face:'☹️'}];
function levelFace(l){ return l && l.face ? l.face : ''; }
/* carita que representa la nota de una tarea de caritas (la del grado más cercano) */
function faceOf(ins, raw, v){
  const lv = ins.levels||[];
  if(Array.isArray(raw) && (ins.items||[]).length===1 && raw[0]!=null && lv[raw[0]]) return levelFace(lv[raw[0]]);
  if(v==null || !lv.length) return '';
  let best = lv[0]; lv.forEach(l=>{ if(Math.abs(l.value-v) < Math.abs(best.value-v)) best = l; });
  return levelFace(best);
}

function markDefs(){ return Array.isArray(state.markDefs) ? state.markDefs : MARKS; }
function markDef(id){ return markDefs().find(m=>m.id===id) || null; }
/* lista de ids (con repeticiones si es acumulable), solo de marcas que siguen existiendo */
function marksOf(c, sid, tid){ return ((c.marks||{})[gkey(sid, tid)] || []).filter(id=>markDef(id)); }
function marksCount(c, sid, tid){
  const cnt = {}; marksOf(c, sid, tid).forEach(id=>{ cnt[id] = (cnt[id]||0)+1; });

function setMarks(c, sid, tid, cur){
  if(!c.marks || typeof c.marks!=='object') c.marks = {};
  const k = gkey(sid, tid);

function toggleMark(c, sid, tid, id){
  const cur = ((c.marks||{})[gkey(sid, tid)]||[]).slice();
  const d = markDef(id);
  if(d && d.count) cur.push(id);
  else { const i = cur.indexOf(id); if(i>-1) cur.splice(i,1); else cur.push(id); }

}

  const cur = ((c.marks||{})[gkey(sid, tid)]||[]).slice();

/* diana (gráfico de araña) de un instrumento con ítems: radios = ítems, anillos = grados */
function dianaSvg(ins, sel, size){
  const items = ins.items||[], lv = ins.levels||[];
  const n = items.length; if(n<3 || !lv.length) return '';
  const S = size||260, cx = S/2, cy = S/2, R = S/2-46, rings = lv.length;
  const vals = items.map((it,i)=>{ const j = Array.isArray(sel)?sel[i]:null; return j==null?0:(lv[j]?lv[j].value:0); });
  const maxV = Math.max(10, ...lv.map(l=>l.value));
  const pt = (i, r)=>{ const a = -Math.PI/2 + i*2*Math.PI/n; return [cx + r*Math.cos(a), cy + r*Math.sin(a)]; };
  let g = '';
  for(let k=rings;k>=1;k--){ const r = R*k/rings;
    g += `<circle cx="${cx}" cy="${cy}" r="${r.toFixed(1)}" fill="${k%2?'#F1F5F2':'#FFFFFF'}" stroke="#DDE3DD" stroke-width="1"/>`; }
  items.forEach((it,i)=>{ const [x,y] = pt(i,R); g += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#DDE3DD" stroke-width="1"/>`;
    const [lx,ly] = pt(i, R+16); const anchor = Math.abs(lx-cx)<8?'middle':(lx>cx?'start':'end');
    const name = (it.name||('Ítem '+(i+1))); g += `<text x="${lx.toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="#4A5A52">${esc(name.length>22?name.slice(0,21)+'…':name)}</text>`; });
  const poly = vals.map((v,i)=>pt(i, R*v/maxV).map(z=>z.toFixed(1)).join(',')).join(' ');
  if(vals.some(v=>v>0)){
    g += `<polygon points="${poly}" fill="rgba(31,107,79,.18)" stroke="#1F6B4F" stroke-width="2" stroke-linejoin="round"/>`;
    vals.forEach((v,i)=>{ if(!v) return; const [x,y] = pt(i, R*v/maxV); const j = sel[i];
      g += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.5" fill="#1F6B4F" stroke="#fff" stroke-width="2"><title>${esc((items[i].name||'')+': '+(lv[j]?lv[j].label:''))}</title></circle>`; });
  }
  return `<svg class="diana" viewBox="0 0 ${S} ${S}" width="100%" style="max-width:${S}px" role="img" aria-label="Diana de evaluación">${g}</svg>`;
}
/* modo alumno: pantalla grande para que el propio alumno rellene (autoevaluación / coevaluación) */
function studentMode(title, who, ins, sel, onDone){

  const root = document.createElement('div'); root.className = 'kid-mode';
  const draw = ()=>{ root.innerHTML = `<div class="kid-top"><div><div class="kid-who">${esc(who)}</div><div class="kid-t">${esc(title)}</div></div>

      <div class="kid-opts">${lv.map((l,j)=>`<button class="kid-opt ${sel[i]===j?'on':''}" data-ki="${i}" data-kj="${j}">${l.face?`<span class="kid-face">${l.face}</span>`:(ins.type==='scale' && /^\d+$/.test(l.label)?`<span class="kid-face">${'⭐'.repeat(Number(l.label))}</span>`:'')}<span>${esc(l.label)}</span></button>`).join('')}</div></div>`).join('')}</div>
    ${items.length>=3?`<div class="kid-diana">${dianaSvg(ins, sel, 300)}</div>`:''}
    <p class="kid-foot">Cuando termines, pulsa «¡Hecho!» y devuelve el dispositivo.</p>`; };
  draw();
  root.addEventListener('click', e=>{

  });
  document.body.appendChild(root);
}
