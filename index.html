  const set = {}; ((u.plan||{}).crits||[]).forEach(k=>{ set[k]=1; }); critsWorkedUnit(c, u.id).forEach(k=>{ set[k]=1; });
  return Object.keys(set).sort(cmpCode);
}
function upCritTasks(c, u, code){ return tasksOfUnit(c, u.id).filter(t=>(t.criteria||[]).indexOf(code)>-1 || Object.keys(t.adaptations||{}).some(sid=>((t.adaptations[sid]||{}).criteria||[]).indexOf(code)>-1)); }
/* descriptores que tocan los criterios de la unidad, agrupados por competencia clave */
function upDescr(c, u, aid){
  const d = DESCR[aid] || {}, set = {};
  upCrits(c, u).map(k=>k.split('.')[0]).forEach(ce=>(d[ce]||[]).forEach(x=>{ set[x]=1; }));
  const out = {}; Object.keys(set).sort().forEach(x=>{ const k = x.replace(/\d+$/,''); (out[k]=out[k]||[]).push(x); });
  return out;
}
function critPicker(c, u, aid){
  const pl = u.plan || {}, crits = critList(aid, c.cycle), ces = areaDef(aid).ce || {}, mine = pl.crits || [];
  if(!crits.length) return `<p class="hint" style="margin:0">No hay criterios cargados para esta área y ciclo.</p>`;
  const byCE = {}; crits.forEach(k=>{ const ce = k.code.split('.')[0]; (byCE[ce]=byCE[ce]||[]).push(k); });
  const all = upCrits(c, u);
  return `<div class="sab" id="critBox">
    <div class="sab-bar"><span class="sab-tot" id="critTot">${all.length} elegidos de ${crits.length}</span></div>
    ${Object.keys(byCE).sort((a,b)=>a-b).map(ce=>{ const n = byCE[ce].filter(k=>all.indexOf(k.code)>-1).length;
      return `<details class="sab-sub ${n?'has':''}" ${n && !isNarrow()?'open':''}>
        <summary><span class="sab-code">CE ${esc(ce)}</span><span class="sab-name sab-ce">${esc(ces[ce]||'Competencia específica '+ce)}</span>
          <span class="sab-n" data-sabn>${n}/${byCE[ce].length}</span><span class="up-caret" aria-hidden="true">▾</span></summary>
        <div class="sab-items">${byCE[ce].map(k=>{ const ts = upCritTasks(c, u, k.code), on = ts.length>0 || mine.indexOf(k.code)>-1;
          return `<button type="button" class="sab-it ${on?'on':''} ${ts.length?'lock':''}" data-act="critToggle" data-code="${esc(k.code)}" aria-pressed="${on}" ${ts.length?'title="Lo evalúa una tarea de la unidad: se quita desde la tarea"':''}><i aria-hidden="true"></i>
            <span><b class="sab-cc">${esc(k.code)}</b> ${esc(k.text)}${ts.length?`<em class="sab-in">${ts.map(t=>`<u>${esc(t.name)}</u>`).join('')}</em>`:''}</span></button>`; }).join('')}</div>
      </details>`; }).join('')}
  </div>`;
}
function kcPicker(c, u, aid){
  const pl = u.plan || {}, d = upDescr(c, u, aid), mine = pl.kc || [];
  return `<div class="kc-list">${KC.map(([k,n])=>{ const auto = d[k], on = !!auto || mine.indexOf(k)>-1;
    return `<button type="button" class="kc ${on?'on':''} ${auto?'lock':''}" data-act="kcToggle" data-k="${k}" aria-pressed="${on}" ${auto?'title="Vinculada por la Orden a las competencias específicas de tus criterios"':''}>
      <b>${k}</b><span>${esc(n)}</span>${auto?`<small>${auto.join(' · ')}</small>`:''}</button>`; }).join('')}</div>`;
}
/* sesiones de la agenda de esta clase y área entre las fechas de la unidad */
function upSessions(c, u, aid){
  const pl = u.plan || {}; if(!pl.from || !pl.to) return null;
  const ord = {}; (state.schedule||[]).forEach((sl,i)=>{ ord[sl.id] = i; });
  return Object.keys(state.sessions||{}).map(k=>{ const p = k.split('|'); return {iso:p[0], slot:p[1], s:state.sessions[k]}; })
    .filter(x=>x.s && x.s.courseId===c.id && x.s.areaId===aid && x.iso>=pl.from && x.iso<=pl.to)
    .sort((a,b)=> a.iso<b.iso ? -1 : a.iso>b.iso ? 1 : (ord[a.slot]||0)-(ord[b.slot]||0));
}
function seqLinesHtml(pl){
  const ls = upLines(pl.sequence);
  return ls.length ? `<div class="field"><span>Sesiones previstas sin fecha <i class="up-auto">pásalas a la agenda cuando sepas el día</i></span>
    <div class="up-tasks">${ls.map((x,i)=>`<div class="up-task"><b>${esc(x)}</b><button type="button" class="btn ghost small" data-act="seqToAgenda" data-i="${i}">▦ A la agenda</button></div>`).join('')}</div></div>` : '';
}
/* resultados de la unidad para la valoración: media de la clase, aprobados y criterios de menor a mayor */
function upResults(c, u){
  const vals = c.students.map(st=>unitScore(c, st.id, u.id)).filter(v=>v!=null);
  if(!vals.length) return null;
  const mean = vals.reduce((a,b)=>a+b,0)/vals.length, pass = vals.filter(v=>v>=c.pass).length;
  const by = {};
  tasksOfUnit(c, u.id).forEach(t=>{ if(t.isInitial || t.informative) return;
    const tv = c.students.map(st=>taskApplies(c, t, st.id) ? taskFinal(c, t, st.id) : null).filter(v=>v!=null); if(!tv.length) return;
    const m = tv.reduce((a,b)=>a+b,0)/tv.length;
    (t.criteria||[]).forEach(k=>{ (by[k] = by[k] || []).push(m); }); });
  const crits = Object.keys(by).map(k=>({code:k, v:by[k].reduce((a,b)=>a+b,0)/by[k].length})).sort((a,b)=>a.v-b.v);
  return {mean:mean, n:vals.length, pass:pass, crits:crits};
}
/* autoevaluación docente de la unidad: una diana con ocho aspectos y cuatro grados */
const SELF_ITEMS = ['Planificación y tiempos','Objetivos y saberes','Metodología','Recursos y materiales','Atención a la diversidad','Evaluación','Clima y participación','Producto final'];
const SELF_INS = {type:'scale', items:SELF_ITEMS.map(n=>({name:n})), levels:[{label:'Mejorable',value:2.5},{label:'Aceptable',value:5},{label:'Bien',value:7.5},{label:'Muy bien',value:10}]};
function upSelf(pl){ const a = Array.isArray(pl.self) ? pl.self : []; return SELF_ITEMS.map((_,i)=>a[i]==null ? null : a[i]); }
/* alumnado de la clase con alguna necesidad registrada en esta área o en su ficha */
function upDivStudents(c, aid){
  return c.students.map(st=>{ const dv = (c.diversity||{})[dvkey(st.id, aid)] || {}, sd = (c.sdiv||{})[st.id] || {};
    const has = dv.med || (dv.cond||[]).length || (dv.measures||[]).length || (sd.cond||[]).length || (sd.acts||[]).length;
    return has ? {st:st, med:dv.med ? medDef(dv.med).code : '', measures:(dv.measures||[]).slice()} : null; }).filter(Boolean);
}
function upDivPicker(c, u, aid){
  const pl = u.plan || {}, sel = pl.divStu || {}, list = upDivStudents(c, aid);
  if(!list.length) return `<p class="hint" style="margin:0">No hay alumnado con necesidades registradas en esta área. Se registran en la pestaña Diversidad.</p>`;
  return `<div class="dvs">${list.map(x=>{ const mine = (sel[x.st.id]||{}).m || [], extra = mine.filter(m=>x.measures.indexOf(m)<0);
    return `<div class="dv-st" data-sid="${x.st.id}">
      <div class="dv-head"><b>${esc(x.st.name)}</b>${x.med?`<span class="tag warn" style="font-size:11px">${esc(x.med)}</span>`:''}<span class="sab-n">${mine.length} medida(s)</span></div>
      <div class="up-chips">${x.measures.concat(extra).map(m=>`<button type="button" class="up-chip dv-m ${mine.indexOf(m)>-1?'on':''}" data-act="divM" data-sid="${x.st.id}" data-m="${esc(m)}">${esc(m)}</button>`).join('')}
        ${x.measures.length?'':'<span class="hint" style="margin:0">Sin medidas escritas en Diversidad.</span>'}</div>
      <div class="dv-add"><input class="inp" placeholder="Otra medida para esta unidad" data-divnew="${x.st.id}"><button type="button" class="btn ghost small" data-act="divAdd" data-sid="${x.st.id}">Añadir</button></div>
    </div>`; }).join('')}</div>`;
}
/* resumen sin nombres de lo registrado en Diversidad y de las tareas adaptadas de la unidad */
function upDivAuto(c, u, aid){
  const by = {}, lines = []; let nm = 0;
  c.students.forEach(st=>{ const dv = (c.diversity||{})[dvkey(st.id, aid)]; if(!dv) return;
    if(dv.med){ const m = medDef(dv.med), k = m.name && m.name!==m.code ? m.name+' ('+m.code+')' : m.code; by[k] = (by[k]||0)+1; }
    if((dv.measures||[]).length) nm++; });
  Object.keys(by).forEach(k=>lines.push(by[k]+' alumno(s) con '+k));
  if(nm) lines.push(nm+' alumno(s) con actuaciones registradas en Diversidad');
  tasksOfUnit(c, u.id).forEach(t=>{ const n = Object.keys(t.adaptations||{}).length; if(n) lines.push('«'+t.name+'»: evaluación adaptada para '+n+' alumno(s)'); });
  return lines;
}
function sabBlocks(aid, cycle){ const a = SABERES[aid]; if(!a) return []; return a[cycle] || a[Object.keys(a)[0]] || []; }
function sabCycles(aid){ return Object.keys(SABERES[aid]||{}).map(Number).sort(); }
/* el ciclo de la clase guarda «A.2|0»; los de otro ciclo, «c2:A.2|0» */
function sabId(sub, i, cy, base){ return (cy && cy!==base ? 'c'+cy+':' : '') + sub.c+'|'+i; }
/* saberes elegidos en la unidad, agrupados como en la norma: [{code, name, items:[texto], cycle}] */
function sabChosen(aid, cycle, pl){
  const set = pl.sab || [], out = [], cys = sabCycles(aid), base = cys.indexOf(Number(cycle))>-1 ? Number(cycle) : cys[0];
  cys.forEach(cy=>(SABERES[aid][cy]||[]).forEach(b=>b.s.forEach(sub=>{
    const its = sub.i.filter((_,i)=>set.indexOf(sabId(sub,i,cy,base))>-1);
    if(its.length) out.push({code:sub.c, name:(sub.n || b.n) + (cy!==base ? ' · '+CYCLE_NAMES[cy] : ''), items:its});
  })));
  return out;
}
function sabPicker(aid, cycle, pl){

  if(!cys.length) return `<p class="hint" style="margin:0 0 10px">Esta área todavía no tiene cargados los saberes básicos del currículo. Mientras tanto puedes escribirlos a mano aquí abajo.</p>`;
  const base = cys.indexOf(Number(cycle))>-1 ? Number(cycle) : cys[0];
  const cy = cys.indexOf(Number(state.sabCycle))>-1 ? Number(state.sabCycle) : base;
  const blocks = SABERES[aid][cy] || [];
  const nOf = k=> k===base ? set.filter(x=>x.charAt(0)!=='c' || x.indexOf(':')<0).length : set.filter(x=>x.indexOf('c'+k+':')===0).length;
  return `<div class="sab ${state.sabOnly?'only':''}" id="sabBox">
    <div class="sab-bar">${cys.length>1 ? `<div class="seg-toggle">${cys.map(k=>`<button type="button" data-act="sabCycle" data-m="${k}" aria-pressed="${k===cy}" title="${k===base?'Ciclo de la clase':'Para alumnado con adaptación o para repasar'}">${k}.º ciclo${nOf(k)?' · '+nOf(k):''}</button>`).join('')}</div>` : ''}
      <span class="sab-tot" id="sabTot">${set.length} elegidos</span><div class="spacer"></div>
      <button type="button" class="btn ghost small" data-act="sabOnly">${state.sabOnly?'Ver todos':'Ver solo los elegidos'}</button></div>
    ${cy!==base ? `<p class="hint" style="margin:0 0 8px">Estás viendo ${CYCLE_NAMES[cy]}. La clase es de ${CYCLE_NAMES[base]}.</p>` : ''}
    ${blocks.map(b=>`<div class="sab-blk">${b.s.length===1 && !b.s[0].n ? '' : `<h4><b>${esc(b.c)}</b>${esc(b.n)}</h4>`}
      ${b.s.map(sub=>{ const n = sub.i.filter((_,i)=>set.indexOf(sabId(sub,i,cy,base))>-1).length;
        return `<details class="sab-sub ${n?'has':''}" data-sub="${esc(sub.c)}" ${n && !isNarrow()?'open':''}>
          <summary><span class="sab-code">${esc(sub.c)}</span><span class="sab-name">${esc(sub.n || b.n)}</span>
            <span class="sab-n" data-sabn>${n}/${sub.i.length}</span><span class="up-caret" aria-hidden="true">▾</span></summary>
          <div class="sab-items">
            ${sub.i.map((x,i)=>{ const id = sabId(sub,i,cy,base), on = set.indexOf(id)>-1;
              return `<button type="button" class="sab-it ${on?'on':''}" data-act="sabToggle" data-id="${esc(id)}" aria-pressed="${on}"><i aria-hidden="true"></i><span>${esc(x)}</span></button>`; }).join('')}
            <div class="row" style="gap:6px;margin-top:4px"><button type="button" class="btn ghost small" data-act="sabAll" data-sub="${esc(sub.c)}" data-m="1">Añadir todos</button>
              <button type="button" class="btn ghost small" data-act="sabAll" data-sub="${esc(sub.c)}" data-m="0">Quitar todos</button></div>
          </div></details>`; }).join('')}</div>`).join('')}
  </div>`;
}
function sabRefresh(u){
  const box = document.getElementById('sabBox'); if(!box) return;
  const set = (u.plan||{}).sab || [];
  box.querySelectorAll('.sab-it').forEach(x=>{ const on = set.indexOf(x.dataset.id)>-1; x.classList.toggle('on', on); x.setAttribute('aria-pressed', on); });
  box.querySelectorAll('.sab-sub').forEach(d=>{ const all = d.querySelectorAll('.sab-it').length, n = d.querySelectorAll('.sab-it.on').length;
    d.querySelector('[data-sabn]').textContent = n+'/'+all; d.classList.toggle('has', n>0); });
  const t = document.getElementById('sabTot'); if(t) t.textContent = set.length+' elegidos';
  const tab = box.querySelector('[data-act="sabCycle"][aria-pressed="true"]');
  if(tab){ const n = box.querySelectorAll('.sab-it.on').length; tab.textContent = tab.dataset.m+'.º ciclo'+(n?' · '+n:''); }
  upRefresh(u);
}

/* documento completo de la unidad: sirve para «Ver completa» y para el PDF */
function planDocHtml(c, u, aid, p, showEmpty, lvl){
  lvl = lvl || 0;   // 0 texto completo · 1 competencias específicas solo con su número · 2 criterios también solo con su código
  const pl = u.plan || {};
  const codes = upCrits(c, u);
  const critMap = areaDef(aid).crit[c.cycle] || {}, ces = areaDef(aid).ce || {};
  const ceList = codes.map(k=>k.split('.')[0]).filter((x,i,a)=>a.indexOf(x)===i);
  const tasks = tasksOfUnit(c, u.id);
  const none = '<p class="upd-none">Sin rellenar</p>';
  const txt = k=> upHas(pl,k) ? `<p>${esc(pl[k]).replace(/\n/g,'<br>')}</p>` : '';
  const sec = (title, html, cls)=> (html || showEmpty) ? `<section class="${cls||''}"><h2>${title}</h2>${html||none}</section>` : '';
  const sub = (label, html)=> html ? `<div class="upd-sub"><h3>${label}</h3>${html}</div>` : '';
  const tags = k=> upHas(pl,k) ? `<p class="upd-tags">${pl[k].map(x=>`<i>${esc(x)}</i>`).join('')}</p>` : '';
  const meta = [areaDef(aid).name, c.name+' · '+CYCLE_NAMES[c.cycle], p.name,
    upHas(pl,'sessions') ? pl.sessions+' sesiones' : '', upDates(pl)].filter(Boolean);
  const ctx = sub('Justificación', txt('justif')) + sub('Situación de aprendizaje', txt('situation')) + sub('Producto final', txt('product'));
  const lst = k=> upHas(pl,k) ? `<ul>${upLines(pl[k]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>` : '';
  const curr0 = codes.length ? (lvl>0 ? `<div class="upd-sub"><h3>Competencias específicas</h3><p class="upd-tags">${ceList.map(k=>`<i>CE ${esc(k)}</i>`).join('')}</p></div>`
      : ceList.some(k=>ces[k]) ? `<div class="upd-sub"><h3>Competencias específicas</h3>${ceList.map(k=>`<p class="upd-cr"><b>CE ${esc(k)}</b> ${esc(ces[k]||'')}</p>`).join('')}</div>` : '')
      + (lvl>1 ? `<div class="upd-sub"><h3>Criterios de evaluación</h3><p class="upd-tags">${codes.map(k=>`<i>${esc(k)}</i>`).join('')}</p></div>`
        : `<div class="upd-sub"><h3>Criterios de evaluación</h3>${codes.map(k=>`<p class="upd-cr"><b>${esc(k)}</b> ${esc(critMap[k]||'')}</p>`).join('')}</div>`) : '';
  const chosen = sabChosen(aid, c.cycle, pl);
  const sabHtml = chosen.map(g=>`<p class="upd-cr"><b>${esc(g.code)}</b> <em>${esc(g.name)}</em></p><ul>${g.items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`).join('') + lst('saberes');
  const dsc = upDescr(c, u, aid), kcs = KC.filter(([k])=>dsc[k] || (pl.kc||[]).indexOf(k)>-1);
  const kcHtml = kcs.length ? `<p class="upd-tags">${kcs.map(([k])=>`<i>${k}${dsc[k]?' ('+dsc[k].map(x=>x.replace(k,'')).join(', ')+')':''}</i>`).join('')}</p>` : '';
  const curr = curr0 + sub('Saberes básicos', sabHtml) + sub('Competencias clave y descriptores', kcHtml) + sub('Otras concreciones', txt('currNotes'));
  const obj = lst('objectives');
  const ags = upSessions(c, u, aid) || [];
  const ini0 = tasksOfUnit(c, u.id).filter(t=>t.isInitial).map(t=>'Evaluación inicial: '+t.name);
  const seqAll = ini0.concat(ags.map(x=>fmtDate(x.iso).slice(0,5)+' · '+(x.s.title||'(sin título)')+((x.s.files||[]).length?' (📎 '+x.s.files.length+')':''))).concat(upLines(pl.sequence));
  const mats = (pl.files||[]).length ? `<p class="upd-cr"><b>Materiales</b> ${pl.files.map(a=>esc(a.name)).join(' · ')}</p>` : '';
  const seq = seqAll.length || mats ? `<ol start="${ini0.length?0:1}">${seqAll.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>${mats}` : '';
  const dAuto = upDivAuto(c, u, aid);
  const dSel = upDivStudents(c, aid).map(x=>({x:x, m:((pl.divStu||{})[x.st.id]||{}).m||[]})).filter(o=>o.m.length);
  const dStu = dSel.length ? `<div class="upd-sub"><h3>Medidas por alumno o alumna</h3>${dSel.map((o,i)=>`<p class="upd-cr"><b>${String.fromCharCode(65+i%26)}${o.x.med?' · '+esc(o.x.med):''}</b> ${o.m.map(esc).join(' · ')}</p>`).join('')}</div>` : '';
  const dvs = dStu + (dAuto.length ? `<ul>${dAuto.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>` : '') + sub('Medidas generales', txt('divGeneral')) + sub('Medidas específicas y adaptaciones', txt('divSpecific'));
  const sv = upSelf(pl);
  const selfHtml = sv.some(x=>x!=null) ? `<div class="upd-self"><div>${dianaSvg(SELF_INS, sv, 220)}</div><p>${SELF_ITEMS.map((n,i)=>sv[i]==null?'':esc(n)+': <b>'+(sv[i]+1)+'</b>').filter(Boolean).join(' · ')}</p></div>` : '';
  const rs = upResults(c, u);
  const resHtml = rs ? `<p>Media de la clase: <b>${fmt(rs.mean)}</b> · aprueban ${rs.pass} de ${rs.n}${rs.crits.length?' · criterios más bajos: '+rs.crits.slice(0,3).map(k=>k.code+' ('+fmt2(k.v)+')').join(', '):''}</p>` : '';
  const val = resHtml + selfHtml + sub('Qué ha funcionado', txt('valWorked')) + sub('Qué cambiaría', txt('valChange'));
  const met = sub('Metodologías', tags('methods')) + sub('Agrupamientos', tags('groups')) + sub('Recursos y materiales', txt('resources')) + sub('Espacios', txt('spaces'));
  const ev = tasks.length ? `<table><thead><tr><th>Tarea evaluable</th><th>Instrumento</th><th>Criterios</th><th class="r">Peso</th></tr></thead><tbody>
      ${tasks.map(t=>`<tr><td>${esc(t.name)}</td><td>${esc(TYPE_NAMES[(t.instr||{}).type]||'')}</td><td>${taskCriteria(c, t).map(esc).join(' · ')}</td>
        <td class="r">${t.isInitial?'inicial':(t.informative?'informativa':(Number(t.weight)||0)+'%')}</td></tr>`).join('')}</tbody></table>` : '';
  const evAll = ev + sub('Procedimientos y observaciones', txt('evalNotes'));
  return `<header class="upd-head" style="--c:${areaColor(aid)}"><h1>${esc(u.name)}</h1>
      <p>${meta.map(esc).join(' · ')}</p>${u.desc?`<p class="upd-desc">${esc(u.desc)}</p>`:''}</header>
    <div class="upd-grid">
      <div>${sec('Justificación y contexto', ctx)}</div>
      <div>${sec('Objetivos didácticos', obj)}${sec('Metodología', met)}</div>
    </div>
    ${sec('Concreción curricular', curr, 'upd-wide')}
    ${sec('Secuencia de sesiones', seq, 'upd-wide upd-seq')}
    ${sec('Evaluación', evAll, 'upd-wide')}
    ${(dvs||val||showEmpty) ? `<div class="upd-grid"><div>${sec('Atención a la diversidad', dvs)}</div><div>${sec('Valoración de la unidad', val)}</div></div>` : ''}`;
}

/* PDF: dos caras de A4 como máximo. Se reduce el cuerpo de letra hasta que quepa. */
function planPdf(){
  const c = course(), aid = areaId(), p = period(), u = c && unitById(c, state.activeUnit); if(!u) return;
  const base = reportDoc(c, [], aid, p.id, {}).css;
  const css = base + UPD_CSS + `
    @page{size:A4;margin:12mm}
    #reportRoot .rep.up-rep{max-width:none;width:186mm;padding:0;background:transparent;box-shadow:none;margin:0 auto}
    #reportRoot .up-rep .upd-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
    #reportRoot .up-fit{max-width:186mm;margin:0 auto 10px;font-size:12.5px;color:#6B7A72}
    @media print{ #reportRoot .up-fit{display:none} #reportRoot .rep.up-rep{width:auto} }`;
  const pack = {css:css, n:1, title:'Programación · '+u.name,
    body:`<p class="up-fit" id="upFit"></p><div class="rep up-rep"><div class="upd">${planDocHtml(c, u, aid, p, false)}</div></div>`};
  showReport(pack, ('programacion_'+u.name).replace(/[^\wáéíóúñÁÉÍÓÚÑ]+/g,'_')+'.html');
  const root = document.getElementById('reportRoot'), doc = root.querySelector('.upd');
  const info = root.querySelector('.rbar span'); if(info) info.textContent = 'Programación de la unidad';
  const maxPx = 2 * 262 * 96 / 25.4;   // dos páginas A4 con 12 mm de margen (con un poco de holgura)
  let pt = 10.5, lvl = 0;
  const fit = min=>{ pt = 10.5; doc.style.fontSize = pt+'pt';
    while(doc.scrollHeight > maxPx && pt > min){ pt = Math.round((pt-0.25)*100)/100; doc.style.fontSize = pt+'pt'; }
    return doc.scrollHeight <= maxPx; };
  /* primero se intenta con todo el texto a 8 pt o más; si no cabe, se abrevia la concreción curricular; solo al final se baja de 8 pt */
  let ok = fit(8);
  while(!ok && lvl < 2){ lvl++; doc.innerHTML = planDocHtml(c, u, aid, p, false, lvl); ok = fit(8); }
  if(!ok) ok = fit(7);
  const pages = Math.max(1, Math.ceil(doc.scrollHeight / (maxPx/2)));
  doc.dataset.pt = pt; doc.dataset.pages = pages; doc.dataset.lvl = lvl;
  root.querySelector('#upFit').textContent = !ok
    ? 'El contenido no cabe en dos caras ni con la letra al mínimo: ocupará más de una hoja. Acorta algún apartado.'
    : (pages===1 ? 'Cabe en una cara.' : 'Cabe en una hoja por las dos caras.')
      + (lvl===1 ? ' Para que quepa, las competencias específicas salen solo con su número.' : lvl===2 ? ' Para que quepa, las competencias específicas y los criterios salen solo con su código.' : '')
      + (pt<10.5 ? ' Letra a '+String(pt).replace('.',',')+' pt.' : '');
}
document.addEventListener('input', e=>{
  const t = e.target; if(!t.dataset || t.dataset.act!=='planF') return;
  const c = course(), u = c && unitById(c, state.activeUnit); if(!u) return;
  if(!u.plan || typeof u.plan!=='object') u.plan = {};
  if(String(t.value).trim()) u.plan[t.dataset.k] = t.value; else delete u.plan[t.dataset.k];
  if(t.tagName==='TEXTAREA') autoGrow(t);
  if(t.dataset.k==='sequence'){ const sl = document.getElementById('seqLines'); if(sl) sl.innerHTML = seqLinesHtml(u.plan); }
  upRefresh(u); save();
});
function upRefresh(u){
  const pl = u.plan || {}; let n = 0;
  UP_BLOCKS.forEach(b=>{ const d = document.querySelector('[data-upb="'+b.id+'"] .up-dot'); if(!d) return;

  const pr = document.getElementById('upProg'); if(pr) pr.textContent = upCountTxt(n);
}

  const hasAdapted = list.some(t=>t.adapted);
  const adaptBy = hasAdapted ? adaptedWeightByStudent(c, aid, p.id) : {};
  const crits = critList(aid, c.cycle);

  return `<div class="row" style="margin-bottom:4px">

      ${!isInitialP(c,p.id)? `<span class="tag ${tw===100?'':'grey'}" style="align-self:center">Ordinarias: ${tw}%${hasAdapted?' · adaptadas: '+aw+'%':''}</span>`:''}
      <button class="btn small" data-act="addTask">Nueva tarea</button></div>
    <p class="hint">${esc(areaDef(aid).name)} · ${esc(p.name)}. Cada tarea lleva sus criterios y su propio instrumento de evaluación.</p>
    ${isInitialP(c,p.id)
      ? `<div class="card" style="margin-bottom:12px;border-left:3px solid var(--mark)">
          <p class="hint" style="margin:0"><b>Evaluación inicial.</b> Diagnóstico de principio de curso; no computa en la nota final. Para valorar por niveles usa la plantilla <b>Diagnóstico NI · EP · CO</b> al crear la tarea.</p></div>`
      : ''}
    ${!crits.length? `<div class="card" style="margin-bottom:12px"><p class="hint" style="margin:0">No hay criterios cargados para esta área y ciclo. Cárgalos en la pestaña Criterios para poder asociarlos a las tareas.</p></div>`:''}
    ${list.length? list.map(t=>taskCard(c, aid, t)).join('')
    : `<div class="empty"><p>Empieza creando una tarea: nombre, objetivos, actividades y criterios. Después construyes su rúbrica.</p>
        <button class="btn" data-act="addTask">Nueva tarea</button></div>`}`;
};

function taskCard(c, aid, t){
  const ins = t.instr||{type:'num'};
  const n = (ins.items||[]).length;
  const tcritMap = areaDef(aid).crit[c.cycle] || {};
  const adaptCount = Object.keys(t.adaptations||{}).length;
  const adaptNames = Object.keys(t.adaptations||{}).map(sid=>{ const st=c.students.find(x=>x.id===sid); return st?st.name.split(',')[0]:null; }).filter(Boolean);
  return `<div class="item">
    <div class="item-head">
      <strong>${esc(t.name)}</strong>
      ${t.skill? `<span class="tag" style="background:#EEF2F6;color:#2D6A9F">${esc(skillName(t.skill).replace(/ \(.*/,''))}</span>`:''}
      ${taskDates(t).length? `<span class="tag" style="background:#FCF6E8;color:#7A5A10" title="En la agenda: ${esc(taskDates(t).map(fmtDate).join(' · '))}">◆ ${esc(datesLabel(t))}</span>`:''}
      <span class="tag grey">${Number(t.weight)||0}%</span>
      ${adaptCount? `<span class="tag warn" title="Adaptada para: ${esc(adaptNames.join(', '))}">${adaptCount===1?'1 adaptación':adaptCount+' adaptaciones'}</span>`:''}
      <div class="spacer"></div>
      <button class="icon" data-act="dupTask" data-id="${t.id}" title="Duplicar en esta clase">⧉</button>
      ${state.courses.length>1?`<button class="btn ghost small" data-act="dupTaskTo" data-id="${t.id}" title="Duplicar en otra clase">⇉ Otra clase</button>`:''}
      <button class="icon" data-act="delTask" data-id="${t.id}" title="Eliminar">✕</button>
    </div>
    ${t.desc? `<p class="desc">${esc(t.desc)}</p>`:''}
    ${t.goals? `<p class="desc"><b style="color:var(--ink)">Objetivos:</b> ${esc(t.goals)}</p>`:''}
    ${t.activities? `<p class="desc"><b style="color:var(--ink)">Actividades:</b> ${esc(t.activities)}</p>`:''}
    <div class="crit-chips">${taskCriteria(c,t).length
      ? taskCriteria(c,t).map(code=>`<span class="chip on" title="${esc(tcritMap[code]||'')}">${esc(code)}</span>`).join('')
      : '<span class="chip">sin criterios asociados</span>'}</div>
    <div class="row" style="margin-top:10px">
      <span class="tag">${TYPE_NAMES[ins.type]||ins.type}${ins.type!=='num'? ' · '+n+' ítem(s)':''}</span>
      <div class="spacer"></div>
      <button class="btn ghost small" data-act="adaptTask" data-id="${t.id}">Adaptar</button>
      <button class="btn ghost small" data-act="editTask" data-id="${t.id}">Editar tarea</button>
      ${ins.type!=='num'? `<button class="btn small" data-act="editInstr" data-id="${t.id}">Abrir instrumento</button>`
        : `<button class="btn ghost small" data-act="editInstr" data-id="${t.id}">Instrumento</button>`}
    </div>
  </div>`;
}

/* ---------- editor de instrumento (tarea o plantilla) ---------- */
function editedInstr(){
  const c = course();
  if(!state.editor) return null;
  if(state.editor.mode==='task'){ const t = c? taskById(c, state.editor.id):null; return t? t.instr : null; }
  if(state.editor.mode==='adapt'){ const t=c?taskById(c,state.editor.taskId):null; const a=t&&t.adaptations?t.adaptations[state.editor.sid]:null; return a?a.instr:null; }
  return (state.templates||[]).find(x=>x.id===state.editor.id) || null;
}
function editedTitle(){
  const c = course();
  if(!state.editor) return '';
  if(state.editor.mode==='task'){ const t = c? taskById(c, state.editor.id):null; return t? t.name : ''; }
  if(state.editor.mode==='adapt'){ const t=c?taskById(c,state.editor.taskId):null; const s=c.students.find(x=>x.id===state.editor.sid); return (t?t.name:'')+' · '+(s?s.name:'')+' (adaptada)'; }
  const tp = (state.templates||[]).find(x=>x.id===state.editor.id);
  return tp? tp.name : '';
}

views.editorInstr = function(){
  if(state.editor && state.editor.mode==='task'){
    const c0 = course(), t0 = c0 ? taskById(c0, state.editor.id) : null, p0 = period();
    if(!t0 || t0.areaId!==areaId() || !p0 || t0.periodId!==p0.id){ state.view='unidades'; state.editor=null; return views.unidades(); }
  }
  const c = course(); if(!c) return noCourse();
  const ins = editedInstr();
  if(!ins){ state.view='unidades'; return views.unidades(); }
  const isTask = state.editor.mode==='task';
  const isAdapt = state.editor.mode==='adapt';
  const task = isTask ? taskById(c, state.editor.id) : (isAdapt ? taskById(c, state.editor.taskId) : null);
  const adapt = isAdapt ? (task.adaptations||{})[state.editor.sid] : null;
  const tpl  = (!isTask && !isAdapt) ? (state.templates||[]).find(x=>x.id===state.editor.id) : null;
  const isMatrix = ins.type==='rubric' || ins.type==='scale' || ins.type==='faces';
  const tcyc = isAdapt ? (adapt.refCycle||c.cycle) : (isTask ? taskCycle(c, task) : c.cycle);
  const critMap = areaDef(areaId()).crit[tcyc] || {};
  const linkTask = (isTask||isAdapt);
  const avail = isAdapt ? (adapt.criteria||[]).slice().sort(cmpCode) : (isTask ? taskCriteria(c, task) : []);

  const critPicker = (it,i) => !linkTask ? '' : (avail.length
    ? `<div class="crit-pick" title="Criterios que valora este ítem">
        ${avail.map(k=>`<button class="chip ${itemCrits(it).indexOf(k)>-1?'on':''}" data-act="itemCrit" data-i="${i}" data-code="${k}">${k}</button>`).join('')}
       </div>`
    : '<span class="chip">sin criterios en la tarea</span>');

  const head = `<tr>
    <th class="stick">ÍTEM${linkTask?' · CRITERIO · PESO':''}</th>
    ${isMatrix ? (ins.levels||[]).map((l,j)=>`<th class="lvl ${tn(l)}" data-tj="${j}">${l.face?`<div class="lvl-face">${l.face}</div>`:''}
        <input class="lvl-label" value="${esc(l.label)}" data-act="levelLabel" data-j="${j}" aria-label="Nombre del grado">
        <div class="row" style="gap:4px;justify-content:center;margin-top:4px">
          <input class="lvl-val" type="number" step="0.1" min="0" max="10" value="${l.value}" data-act="levelValue" data-j="${j}" aria-label="Valor sobre 10">
          <button class="icon" data-act="delLevel" data-j="${j}" title="Quitar grado">✕</button>
        </div></th>`).join('') : ''}
    ${isMatrix ? `<th class="lvl" style="min-width:60px"><button class="btn ghost small" data-act="addLevel">+ grado</button></th>` : ''}
    ${ins.type==='check' ? `<th class="lvl">Conseguido / no conseguido</th>` : ''}
    ${ins.type==='points' ? `<th class="lvl">Nota sobre ${ins.max||10}</th>` : ''}
  </tr>`;

  const body = (ins.items||[]).map((it,i)=>`<tr>
    <td class="stick item-cell">
      <textarea class="it-name" data-act="itemName" data-i="${i}" rows="2" placeholder="Qué se evalúa en este ítem">${esc(it.name)}</textarea>
      <div class="row" style="gap:6px;margin-top:6px">
        ${critPicker(it, i)}
        <span class="w-pct" title="Cuánto pesa este ítem en la nota de la tarea"><input class="mini" type="number" min="0" max="100" step="5" value="${wRound(it.weight)}" data-act="itemWeight" data-i="${i}" aria-label="Peso del ítem en %"><i>%</i></span>
        <div class="spacer"></div>
        <button class="icon" data-act="delItem" data-i="${i}" title="Quitar ítem">✕</button>
      </div>
    </td>
    ${isMatrix ? (ins.levels||[]).map((l,j)=>`<td class="cell-desc ${tn(l)}" data-tj="${j}">
        <textarea data-act="cellText" data-i="${i}" data-j="${j}" rows="4"
          placeholder="${ins.type==='rubric'?'Qué tiene que hacer para alcanzar este grado':'Descripción opcional'}">${esc((it.cells||[])[j]||'')}</textarea></td>`).join('') : ''}
    ${isMatrix ? '<td class="cell-desc"></td>' : ''}
    ${ins.type==='check' ? '<td class="cell-desc" style="text-align:center;color:var(--muted);font-size:14px">se marca al calificar</td>' : ''}
    ${ins.type==='points' ? '<td class="cell-desc" style="text-align:center;color:var(--muted);font-size:14px">la nota se escribe al calificar</td>' : ''}
  </tr>`).join('');

  const mode = instrMode();

  /* modo lista: cada ítem como ficha, pensado para móvil */
  const listBody = (ins.items||[]).map((it,i)=>`
    <div class="item-edit">
      <textarea class="it-title" data-act="itemName" data-i="${i}" rows="2" placeholder="Qué se evalúa en este ítem">${esc(it.name)}</textarea>
      <div class="row" style="gap:6px;margin-top:8px">
        ${linkTask? `<select data-act="itemCrit" data-i="${i}" style="width:auto;font-size:14px">
            <option value="">criterio –</option>
            ${avail.map(k=>`<option value="${k}" ${k===it.critCode?'selected':''}>${k}</option>`).join('')}
          </select>`:''}
        <span class="w-pct" title="Cuánto pesa este ítem en la nota de la tarea"><input type="number" min="0" max="100" step="5" value="${wRound(it.weight)}" data-act="itemWeight" data-i="${i}" aria-label="Peso del ítem en %" style="width:66px;text-align:center"><i>%</i></span>
        <div class="spacer"></div>
        <button class="icon" data-act="delItem" data-i="${i}">✕</button>
      </div>
      ${isMatrix ? (ins.levels||[]).map((l,j)=>`
        <div class="lv-row">
          <span class="lv-tag ${tn(l)}" data-tj="${j}">${esc(l.label)}<br>${fmt2(l.value)}</span>
          <textarea data-act="cellText" data-i="${i}" data-j="${j}" rows="3"
            placeholder="${ins.type==='rubric'?'Qué tiene que hacer para este grado':'Descripción opcional'}">${esc((it.cells||[])[j]||'')}</textarea>
        </div>`).join('') : ''}
      ${ins.type==='check' ? '<p class="hint" style="margin:8px 0 0">Se marca conseguido o no al calificar.</p>' : ''}
      ${ins.type==='points' ? '<p class="hint" style="margin:8px 0 0">La nota de este apartado se escribe al calificar.</p>' : ''}
    </div>`).join('');

  const levelsEditor = !isMatrix ? '' : `<div class="card">
      <div class="row"><strong style="font-size:16.5px">Grados de logro</strong><div class="spacer"></div>
        <button class="btn ghost small" data-act="addLevel">+ grado</button></div>
      ${(ins.levels||[]).map((l,j)=>`<div class="lv-edit">
        <input type="text" class="inp" value="${esc(l.label)}" data-act="levelLabel" data-j="${j}">
        <input type="number" class="inp" step="0.1" min="0" max="10" value="${l.value}" data-act="levelValue" data-j="${j}">
        <button class="icon" data-act="delLevel" data-j="${j}">✕</button>
      </div>`).join('')}
    </div>`;

  return `
    <div class="row" style="margin-bottom:12px">
      <button class="btn ghost small" data-act="${linkTask?'backToUnit':'tab'}" ${linkTask?`data-id="${task.unitId}"`:'data-id="plantillas"'}>← ${linkTask?(task.unitId?'Unidad':(isInitialP(course(), task.periodId)?'Evaluación inicial':'Tareas')):'Plantillas'}</button>
      <div class="spacer"></div>
      ${ins.type!=='num'? `<div class="seg-toggle">
        <button data-act="setInstrMode" data-m="list" aria-pressed="${mode==='list'}">Lista</button>
        <button data-act="setInstrMode" data-m="table" aria-pressed="${mode==='table'}">Tabla</button></div>`:''}
      <span class="tag grey">${TYPE_NAMES[ins.type]||ins.type}</span>
    </div>

    <div class="card">
      <h2 class="sec-title">${esc(editedTitle()||'Instrumento')}</h2>
      ${isTask
        ? `<p class="hint">Instrumento propio de esta tarea. Editarlo no afecta a ninguna otra.</p>
           <div class="crit-chips">${avail.length? avail.map(k=>`<span class="chip on" title="${esc(critMap[k]||'')}">${esc(k)}</span>`).join('')
             : '<span class="chip">esta tarea no tiene criterios; añádelos en Datos y criterios</span>'}
             <button class="chip" data-act="editTask" data-id="${task.id}">✎ editar criterios</button></div>`
        : isAdapt
        ? `<p class="hint">Rúbrica adaptada para este alumno. Criterios de ${CYCLE_NAMES[tcyc]}. Solo afecta a su calificación en esta tarea.</p>
           <div class="crit-chips">${avail.length? avail.map(k=>`<span class="chip on" title="${esc(critMap[k]||'')}">${esc(k)}</span>`).join('')
             : '<span class="chip">esta adaptación no tiene criterios; márcalos con el botón Adaptar de la tarea</span>'}</div>`
        : `<label class="field" style="margin-top:10px"><span>Nombre de la plantilla</span>
             <input class="inp" value="${esc(tpl.name)}" data-act="instrName"></label>
           <label class="field"><span>Descripción</span>
             <input class="inp" value="${esc(tpl.desc||'')}" data-act="instrDesc"></label>
           <p class="hint">Las plantillas no llevan criterios: los criterios se asignan en cada tarea.</p>`}
      <div class="row" style="margin-top:10px">
        <label class="field" style="margin:0;flex:1;min-width:200px"><span>Tipo de instrumento</span>
          <select class="inp" data-act="instrType">
            ${TYPE_OPTS.map(o=>`<option value="${o.value}" ${o.value===ins.type?'selected':''}>${esc(o.label)}</option>`).join('')}
          </select></label>
        ${ins.type==='num'||ins.type==='points'? `<label class="field" style="margin:0"><span>${ins.type==='points'?'Cada apartado, sobre':'Máximo'}</span>
          <input class="inp" type="number" style="width:100px" value="${ins.max||10}" data-act="instrMax"></label>`:''}
      </div>
    </div>

    ${ins.type==='num' ? `<div class="card"><p class="hint" style="margin:0">Con puntuación directa escribes la nota en la tabla de evaluación global. No hay ítems que definir.</p></div>` : `

    ${isMatrix ? `<div class="card">
      <div class="row" style="gap:6px"><strong style="font-size:16.5px">Grados</strong><div class="spacer"></div>
        <button class="btn ghost small" data-act="preset" data-p="calif">IN · SU · BI · NT · SB</button>
        <button class="btn ghost small" data-act="preset" data-p="dominio">4 grados de dominio</button>
        <button class="btn ghost small" data-act="preset" data-p="n4">1 a 4</button>
        <button class="btn ghost small" data-act="preset" data-p="n5">1 a 5</button>
      </div>
      <p class="hint" style="margin:8px 0 0">La cifra bajo cada grado es su equivalencia sobre 10: eso es lo que convierte la rúbrica en nota.</p>
    </div>`:''}

    ${weightBar(ins)}
    ${mode==='table'
      ? `<div class="scroll" style="margin-top:12px"><table class="rub"><thead>${head}</thead><tbody>${body}</tbody></table></div>`
      : `<div style="margin-top:12px">${levelsEditor}${listBody}</div>`}
    <div class="row" style="margin-top:10px">
      <button class="btn small" data-act="addItem">+ Añadir ítem</button>
      ${linkTask? `<button class="btn ghost small" data-act="applyTpl">Partir de una plantilla</button>
                 <button class="btn ghost small" data-act="saveTpl">Guardar como plantilla</button>`:''}
      ${ins.type==='scale'||ins.type==='faces'||ins.type==='rubric' ? `<label class="chk-row" style="margin-left:6px" title="Al calificar y en la ficha del alumno se dibuja una diana con un radio por ítem"><input type="checkbox" data-act="toggleDiana" ${ins.diana?'checked':''}> <span>Mostrar como diana</span></label>`:''}
      <div class="spacer"></div>
      <span class="weight-total" style="margin:0">${(ins.items||[]).length} ítem(s)</span>
    </div>
    ${ins.diana && (ins.items||[]).length>=3 ? `<div class="card" style="margin-top:10px;text-align:center"><p class="hint" style="margin:0 0 6px">Vista previa de la diana (con un ejemplo de valoración)</p>${dianaSvg(ins, (ins.items||[]).map((_,i)=>(i % Math.max(1,(ins.levels||[]).length))), 260)}</div>`
      : (ins.diana ? '<p class="hint">La diana necesita al menos 3 ítems.</p>' : '')}
    <p class="hint" style="margin-top:10px">Escribe en cada ítem el porcentaje que pesa en la nota de la tarea; entre todos tienen que sumar 100 %.${linkTask?' Los códigos de cada ítem son los criterios que ese ítem valora: puedes marcar varios. El logro de cada criterio se calcula con los ítems que lo llevan marcado, no con la nota global.':''}</p>
    `}`;
};

/* ---------- evaluación global ---------- */
function gradeTable(c, aid, p, opts){
  opts = opts || {};
  const unit = opts.unit || null;
  if(!p || !c.students.length) return `<div class="empty"><h3>Falta el alumnado</h3><p>Añade a la clase antes de calificar.</p><button class="btn" data-act="tab" data-id="alumnos">Ir a Alumnado</button></div>`;
  const rawList = unit ? tasksOfUnit(c, unit.id) : tasksOf(c, aid, p.id);
  if(!rawList.length) return `<div class="empty"><h3>Sin tareas evaluables</h3><p>Crea tareas y aparecerán aquí.</p></div>`;
  // las de evaluación inicial van primero (columna izquierda, marcadas)
  const list = rawList.slice().sort((a,b)=> (b.isInitial?1:0)-(a.isInitial?1:0));
  const hasInit = list.some(t=>t.isInitial);
  const mode = gridMode();
  const edit = !!state.editMode;
  const nAdj = countAdj(c, aid, p.id);
  const unitFinal = (sid)=>unitScore(c, sid, unit.id);   // nota media de la unidad (informativa)
  const showArea = !isInitialP(c, p.id);

  const header = `<div class="row" style="margin-bottom:12px">
      <h2 class="sec-title">${unit?'Evaluación de la unidad':'Evaluación'}</h2><div class="spacer"></div>
      <div class="seg-toggle">
        <button data-act="setGrid" data-m="cards" aria-pressed="${mode==='cards'}">Fichas</button>
        <button data-act="setGrid" data-m="table" aria-pressed="${mode==='table'}">Tabla</button>
      </div>
      <button class="btn ghost small" data-act="informes">Informes</button>
      <button class="btn ghost small" data-act="csv">CSV</button></div>
    <div class="mode-bar">
      <button class="mode-btn cal ${!edit?'on':''}" data-act="setEdit" data-m="0">
        <span class="mb-t">Calificar</span><span class="mb-s">Abrir la rúbrica de cada casilla</span></button>
      <button class="mode-btn adj ${edit?'on':''}" data-act="setEdit" data-m="1">
        <span class="mb-t">Ajustar notas</span><span class="mb-s">Escribir una nota a mano</span></button>
    </div>
    ${nAdj? `<div class="row" style="margin:2px 0 10px"><span class="count mid">${nAdj} nota(s) ajustada(s) a mano</span>${edit?` <button class="btn ghost small" data-act="clearAdj">Quitar todos los ajustes</button>`:''}</div>`:''}
    <p class="hint">${esc(areaDef(aid).name)} · ${esc(p.name)}${unit?' · '+esc(unit.name):''}. ${edit
      ? 'Escribe la nota que quieras en cualquier casilla. El campo vacío recupera la nota calculada, en gris.'
      : 'Toca una casilla para abrir su rúbrica. La columna «Media unidad» es informativa; la nota final del trimestre se calcula por criterios.'}</p>`;

  function ctrl(t, sid, cls){
    const ins = effInstr(c, t, sid) || {type:'num'};
    const adaptedHere = isAdaptedFor(c, t, sid);
    const raw = c.grades[gkey(sid, t.id)];
    const calc = taskScore(c, t, sid);
    const eff = taskFinal(c, t, sid);
    const adj = isAdjTask(c, sid, t.id);
    const low = eff!=null && eff < c.pass;
    const aMark = adaptedHere? '<i class="ad-badge" title="Evaluación adaptada para este alumno">A</i>' : '';
    if(!edit && !t.isInitial && !t.informative) cls += tnv(eff);
    const mk = edit ? '' : marksIcons(c, sid, t.id);
    const cm = edit ? '' : commentOf(c, sid, t.id);
    const mkHtml = (mk ? `<span class="cmarks" title="${esc(marksNames(c, sid, t.id))}">${mk}</span>` : '')
      + (cm ? `<i class="cm-dot" title="${esc(cm)}"></i>` : '');
    if(ins.type==='num' && !edit)
      return `<span class="cell-wrap" data-mks="${sid}" data-mkt="${t.id}">${mkHtml}${aMark}<input class="${cls} ${low?'low':''} ${adaptedHere?'is-adapted':''}" inputmode="decimal" data-act="grade" data-s="${sid}" data-t="${t.id}" value="${raw==null?'':esc(raw)}"></span>`;
    if(edit)
      return `<input class="${cls} ${adj?'adj':''} ${low?'low':''}" inputmode="decimal" data-act="ovTask" data-s="${sid}" data-t="${t.id}"
        value="${adj? esc(c.overrides[gkey(sid,t.id)]) : ''}" placeholder="${calc==null?'–':fmt2(calc)}" title="Nota calculada: ${calc==null?'sin calificar':fmt2(calc)}">`;
    return `<button class="${cls} ${eff==null?'empty-cell':''} ${adj?'adj':''} ${low?'low':''} ${adaptedHere?'is-adapted':''}" data-act="openCell" data-s="${sid}" data-t="${t.id}"
      title="${adaptedHere?'Evaluación adaptada. ':''}${adj?'Nota ajustada a mano; calculada '+(calc==null?'–':fmt2(calc)):''}" data-mks="${sid}" data-mkt="${t.id}">${mkHtml}${aMark}${eff==null?'+':(ins.type==='faces'?`<span class="face-v">${faceOf(ins, raw, eff)||fmt2(eff)}</span>`:fmt2(eff))}${adj?'<i class="dot"></i>':''}</button>`;
  }

  if(mode==='cards'){
    const cards = c.students.map((s,idx)=>{
      const um = unitFinal(s.id);
      return `<div class="stu-card" data-student="${s.id}">
        <div class="stu-head">
          <span class="rownum">${String(idx+1).padStart(2,'0')}</span>
          <strong>${esc(s.name)}</strong>
          <span class="score${tnv(um)}" title="Media de la unidad (informativa)">${fmt(um)}</span>${um==null?'':pill(um, c.scale)}
        </div>
        ${list.map(t=>`<div class="task-line${t.isInitial?' tl-init':''}">
            <span class="tl-name">${t.isInitial?'<span class="init-tag">Ev. inicial</span> ':''}${esc(t.name)}${isAdaptedFor(c,t,s.id)?' <span class="tag warn" style="font-size:9px">adaptada</span>':''}<small>${TYPE_NAMES[(effInstr(c,t,s.id)||{}).type]}${t.isInitial?' · no computa':(t.informative?' · informativa':' · '+(Number(t.weight)||0)+'%')}</small></span>
            ${ctrl(t, s.id, 'tl-val')}</div>`).join('')}
      </div>`;
    }).join('');
    return header + cards + MARKS_HINT_F();
  }

  const head = `<tr><th class="stick">Alumno/a</th>
    ${list.map(t=>`<th class="task${t.isInitial?' th-init':''}">${t.isInitial?'<span class="init-tag">Ev. inicial</span><br>':''}${esc(t.name)}<small>${TYPE_NAMES[(t.instr||{}).type]||''}${t.isInitial?' · no computa':(t.informative?' · informativa':' · '+(Number(t.weight)||0)+'%')}</small></th>`).join('')}
    <th class="task th-sep">Media<small>unidad</small></th>${showArea?'<th class="task">Nota<small>área · trimestre</small></th>':''}</tr>`;
  const body = c.students.map((s,idx)=>{
    const um = unitFinal(s.id);
    const dv = c.diversity[dvkey(s.id, aid)]; const med = dv&&dv.med?medDef(dv.med):null;
    let tr = `<tr data-student="${s.id}"><td class="stick"><span class="rownum">${String(idx+1).padStart(2,'0')}</span>${esc(s.name)}${med?` <span class="tag warn" style="font-size:9px">${med.code}</span>`:''}</td>`;
    list.forEach(t=>{
      tr += `<td class="mark${t.isInitial?' td-init':''}">${ctrl(t, s.id, ctrlClass(t))}</td>`;
    });
    tr += `<td class="final td-sep${tnv(um)}" title="Media de la unidad (informativa)">${fmt(um)}${um==null?'':pill(um, c.scale)}</td>`;
    if(showArea){ const af = areaFinal(c, s.id, aid, p.id);
      tr += `<td class="final${tnv(af)}" title="Nota del área en ${esc(p.name)}, calculada por criterios">${fmt(af)}${af==null?'':pill(af, c.scale)}</td>`; }
    return tr + '</tr>';
  }).join('');
  return header + `<div class="scroll"><table class="grid"><thead>${head}</thead><tbody>${body}</tbody></table></div>` + toneLegend(c) + (state.editMode ? '' : MARKS_HINT_F())
    + (hasInit? `<p class="hint" style="margin-top:8px"><span class="init-tag">Ev. inicial</span> Columna de diagnóstico: muestra la nota de la evaluación inicial, pero no cuenta para la media de la unidad ni para la nota trimestral.</p>`:'');
}

function tutoriasOf(c, studentId){
  return (c.tutorias||[]).filter(t=>t.studentId===studentId)
    .sort((a,b)=> (a.date||'').localeCompare(b.date||''));
}
function fmtDate(d){
  if(!d) return '';

}

views.trimestre = function(){
  const c = course(); if(!c) return noCourse();
  if(period() && isInitialP(c, period().id)){ state.view='unidades'; return views.unidades(); }
  const sub = state.triSub || 'notas';
  const nav = subnav('triSub', sub, [['notas','Evaluación por criterios','▦'],['stats','Estadísticas','▥'],['otras','Otras áreas','✎'],['progreso','Punto de partida y progreso','↗'],['referencia','Criterios del currículo','▤']]);
  if(sub==='progreso') return nav + viewProgreso();
  if(sub==='otras') return nav + viewOtras();
  if(sub==='stats') return nav + viewEstadisticas();
  return nav + (sub==='referencia' ? viewCriterios() : viewTrimestreNotas());
};

function statBar(v, max, col){ const w = max ? Math.max(0, Math.min(100, v/max*100)) : 0;
  return `<span class="st-bar"><i style="width:${w.toFixed(1)}%;background:${col||'var(--accent)'}"></i></span>`; }
function viewEstadisticas(){
  const c = course(), aid = areaId(), p = period();
  if(!c.students.length) return `<div class="empty"><h3>Falta el alumnado</h3></div>`;
  const fin = c.students.map(s=>({s:s, v:areaFinal(c, s.id, aid, p.id)}));
  const graded = fin.filter(x=>x.v!=null);
  if(!graded.length) return `<div class="empty"><h3>Aún no hay notas</h3><p>Cuando califiques tareas de ${esc(areaDef(aid).short||areaDef(aid).name)} en ${esc(p.name)}, aquí verás las estadísticas de la clase.</p></div>`;
  const mean = graded.reduce((a,x)=>a+x.v,0)/graded.length;
  const pass = graded.filter(x=>x.v>=c.pass).length;
  /* evaluación anterior, para comparar */
  const reals = c.periods.filter(x=>!x.initial); const pi = reals.findIndex(x=>x.id===p.id);
  const prev = pi>0 ? reals[pi-1] : null;
  const prevF = prev ? c.students.map(s=>({s:s, v:areaFinal(c, s.id, aid, prev.id)})) : [];
  const prevG = prevF.filter(x=>x.v!=null);
  const prevMean = prevG.length ? prevG.reduce((a,x)=>a+x.v,0)/prevG.length : null;
  const diff = prevMean!=null ? mean-prevMean : null;
  /* distribución */
  const dist = c.scale.map(k=>({k:k, n:graded.filter(x=>calif(x.v, c.scale).code===k.code).length}));
  const dmax = Math.max(...dist.map(d=>d.n), 1);
  /* criterios */
  const codes = critsWorked(c, aid, p.id, null);
  const crit = codes.map(code=>{ const vs = c.students.map(s=>critScore(c, s.id, aid, p.id, code)).filter(v=>v!=null);
    return {code:code, n:vs.length, m: vs.length ? vs.reduce((a,b)=>a+b,0)/vs.length : null, low: vs.filter(v=>v<c.pass).length}; })
    .filter(x=>x.m!=null).sort((a,b)=>a.m-b.m);
  const critText = code=>(areaDef(aid).crit[c.cycle]||{})[code]||'';
  /* tareas */
  const tasks = tasksOf(c, aid, p.id).filter(t=>!t.isInitial).map(t=>{ const vs = c.students.map(s=>taskFinal(c, t, s.id)).filter(v=>v!=null);
    return {t:t, n:vs.length, m: vs.length ? vs.reduce((a,b)=>a+b,0)/vs.length : null}; }).filter(x=>x.n)
    .sort((a,b)=>taskWhen(c,a.t).localeCompare(taskWhen(c,b.t)));
  /* alumnado que necesita atención */
  const watch = fin.map(x=>{ const pv = prevF.find(y=>y.s.id===x.s.id); const pvv = pv ? pv.v : null;
      const drop = (x.v!=null && pvv!=null) ? x.v - pvv : null;
      const why = [];
      if(x.v!=null && x.v<c.pass) why.push('suspende ('+fmt(x.v)+')');
      if(drop!=null && drop<=-1) why.push('baja '+fmt(Math.abs(drop))+' respecto a '+prev.name);
      const nTasks = tasksOf(c, aid, p.id).filter(t=>!t.isInitial && !t.informative).length;
      const nDone = tasksOf(c, aid, p.id).filter(t=>!t.isInitial && !t.informative && taskFinal(c, t, x.s.id)!=null).length;
      if(nTasks && nDone < nTasks/2) why.push('sin nota en '+(nTasks-nDone)+' de '+nTasks+' tareas');
      return {s:x.s, v:x.v, why:why}; }).filter(x=>x.why.length);
  const tile = (n, l, extra)=>`<div class="st-tile"><span class="st-n">${n}</span><span class="st-l">${l}</span>${extra||''}</div>`;
  return `<p class="hint">${esc(areaDef(aid).name)} · ${esc(p.name)} · nota final de cada alumno calculada por criterios.</p>
    <div class="st-tiles">
      ${tile(fmt(mean), 'Media de la clase', diff!=null?`<span class="st-d ${diff>=0?'up':'down'}">${diff>=0?'▲':'▼'} ${fmt(Math.abs(diff))} vs ${esc(prev.name)}</span>`:'')}
      ${tile(Math.round(pass/graded.length*100)+'%', 'Aprueban', `<span class="st-d">${pass} de ${graded.length}</span>`)}
      ${tile(graded.length-pass, 'Suspenden', '')}
      ${tile(c.students.length-graded.length, 'Sin nota todavía', '')}
    </div>
    <div class="st-grid">
      <div class="card"><h2 class="sec-title">Distribución de calificaciones</h2>
        ${dist.map(d=>`<div class="st-row"><span class="pill ${d.k.code}">${d.k.code}</span><span class="st-name">${esc(d.k.name)}</span>${statBar(d.n, dmax)}<b class="st-v">${d.n}</b></div>`).join('')}
      </div>
      <div class="card"><h2 class="sec-title">Criterios, del más flojo al más fuerte</h2>
        ${crit.length? crit.map(k=>`<div class="st-row" title="${esc(critText(k.code))}"><b class="st-code">${esc(k.code)}</b><span class="st-name">${esc(critText(k.code).slice(0,60))}${critText(k.code).length>60?'…':''}</span>${statBar(k.m, 10, k.m<c.pass?'#B4232C':undefined)}<b class="st-v">${fmt(k.m)}</b>${k.low?`<span class="st-low">${k.low} susp.</span>`:''}</div>`).join('') : '<p class="hint">Sin criterios calificados.</p>'}
      </div>
      <div class="card"><h2 class="sec-title">Media por tarea</h2>
        ${tasks.length? tasks.map(x=>`<div class="st-row"><span class="st-name" style="flex:1.4">${esc(x.t.name)}${x.t.informative?' <span class="tag grey">informativa</span>':''}</span>${statBar(x.m, 10, x.m<c.pass?'#B4232C':areaColor(aid))}<b class="st-v">${fmt2(x.m)}</b><span class="st-low">${x.n}/${c.students.length}</span></div>`).join('') : '<p class="hint">Sin tareas calificadas.</p>'}
      </div>
      <div class="card"><h2 class="sec-title">Alumnado que necesita atención</h2>

const toolsMem = {picked:{}, timer:{total:300, left:300, run:false, t0:0, iv:null}, groups:null};
function classTools(start){
  const c = course(); if(!c) return;
  let tab = start || toolsMem.tab || 'pick';
  const absent = ()=>{ const a = (c.attendance||{})[today()] || {}; return c.students.filter(s=>a[s.id]==='A').map(s=>s.id); };
  let skipAbs = true, noRepeat = true, size = 4, byCount = false, balance = false;
  const pool = ()=>c.students.filter(s=>!(skipAbs && absent().includes(s.id)));
  const picked = ()=>{ if(!toolsMem.picked[c.id]) toolsMem.picked[c.id] = []; return toolsMem.picked[c.id]; };
  const root = document.createElement('div'); root.className = 'tools-mode';
  const fmtT = sec=>{ sec = Math.max(0, Math.ceil(sec)); return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0'); };
  const T = toolsMem.timer;
  const beep = ()=>{ try{ const ac = new (window.AudioContext||window.webkitAudioContext)();
      [0,0.35,0.7].forEach(d=>{ const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = 880; o.connect(g); g.connect(ac.destination);
        g.gain.setValueAtTime(0.0001, ac.currentTime+d); g.gain.exponentialRampToValueAtTime(0.3, ac.currentTime+d+0.02); g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+d+0.28);
        o.start(ac.currentTime+d); o.stop(ac.currentTime+d+0.3); }); }catch(e){} };
  const tick = ()=>{
    if(!T.run) return;
    T.left = Math.max(0, T.leftAtStart - (Date.now()-T.t0)/1000);
    const el = root.querySelector('#tmDisp'); if(el) el.textContent = fmtT(T.left);
    const ring = root.querySelector('#tmRing'); if(ring) ring.style.strokeDashoffset = (1 - T.left/T.total) * 942;
    if(T.left<=0){ T.run = false; clearInterval(T.iv); beep(); root.classList.add('tm-end'); draw(); }
  };
  const draw = ()=>{
    const P = pool(), done = picked().filter(id=>P.some(s=>s.id===id));
    let body = '';
    if(tab==='pick'){
      const last = done.length ? c.students.find(s=>s.id===done[done.length-1]) : null;
      body = `<div class="tl-pick"><div class="tl-name" id="pkName">${last?esc(last.name):'¿Quién será?'}</div>
        <button class="tl-go" data-tl="pick">🎲 Sacar alumno</button>
        <div class="tl-opts"><label><input type="checkbox" data-tlo="norep" ${noRepeat?'checked':''}> Sin repetir hasta que salgan todos</label>
          <label><input type="checkbox" data-tlo="abs" ${skipAbs?'checked':''}> Quitar a quien falta hoy${absent().length?' ('+absent().length+')':''}</label></div>
        ${done.length?`<div class="tl-hist"><span>Ya han salido (${done.length}/${P.length}):</span> ${done.map(id=>{ const s = c.students.find(x=>x.id===id); return s?`<em>${esc(s.name.split(',').reverse().join(' ').trim())}</em>`:''; }).join('')}
          <button class="tl-link" data-tl="reset">Empezar de nuevo</button></div>`:''}</div>`;
    }
    if(tab==='groups'){
      const G = toolsMem.groups && toolsMem.groups.cid===c.id ? toolsMem.groups.list : null;
      body = `<div class="tl-groups">
        <div class="tl-gbar">
          <div class="seg"><button class="seg-btn ${!byCount?'on':''}" data-tl="mode-size">Personas por grupo</button><button class="seg-btn ${byCount?'on':''}" data-tl="mode-count">Número de grupos</button></div>
          <div class="tl-step"><button data-tl="minus">−</button><b>${size}</b><button data-tl="plus">+</button></div>
          <label><input type="checkbox" data-tlo="bal" ${balance?'checked':''}> Equilibrar por nota de ${esc(areaDef(areaId()).short||areaDef(areaId()).name)}</label>
          <label><input type="checkbox" data-tlo="abs" ${skipAbs?'checked':''}> Sin quien falta hoy</label>
          <button class="tl-go small" data-tl="groups">👥 Hacer grupos</button>
        </div>
        ${G?`<div class="tl-gcards">${G.map((g,i)=>`<div class="tl-gcard"><b>Grupo ${i+1}</b>${g.map(id=>{ const s = c.students.find(x=>x.id===id); return s?`<span>${esc(s.name)}</span>`:''; }).join('')}</div>`).join('')}</div>`
          : `<p class="tl-hint">${P.length} alumnos. Elige cuántos por grupo (o cuántos grupos) y pulsa «Hacer grupos».</p>`}
      </div>`;
    }
    if(tab==='timer'){
      body = `<div class="tl-timer ${T.left<=0?'end':''}">
        <svg viewBox="0 0 320 320" class="tm-svg"><circle cx="160" cy="160" r="150" fill="none" stroke="#2A4238" stroke-width="12"/>
          <circle id="tmRing" cx="160" cy="160" r="150" fill="none" stroke="#E4A11B" stroke-width="12" stroke-linecap="round"
            stroke-dasharray="942" style="stroke-dashoffset:${(1 - T.left/T.total)*942}" transform="rotate(-90 160 160)"/></svg>
        <div class="tm-disp" id="tmDisp">${fmtT(T.left)}</div>
        <div class="tm-ctrl">
          ${T.run?`<button class="tl-go" data-tl="pause">⏸ Pausa</button>`:`<button class="tl-go" data-tl="start">${T.left>0&&T.left<T.total?'▶ Seguir':'▶ Empezar'}</button>`}
          <button class="tl-link" data-tl="treset">↺ Reiniciar</button></div>
        <div class="tm-pre">${[1,2,3,5,10,15,20].map(m=>`<button data-tlm="${m}" class="${T.total===m*60?'on':''}">${m} min</button>`).join('')}
          <button data-tladj="-30">−30 s</button><button data-tladj="30">+30 s</button></div>
      </div>`;
    }
    root.innerHTML = `<div class="tl-top"><div class="tl-tabs">
        ${[['pick','🎲 Sorteo'],['groups','👥 Grupos'],['timer','⏱ Temporizador']].map(([id,l])=>`<button class="${tab===id?'on':''}" data-tltab="${id}">${l}</button>`).join('')}</div>
        <span class="tl-class">${esc(c.name)}</span><button class="tl-close" data-tl="close" title="Cerrar">✕</button></div>
      <div class="tl-body">${body}</div>`;
  };
  const makeGroups = ()=>{
    let ids = pool().map(s=>s.id);
    if(!ids.length) return;
    const nG = byCount ? Math.max(1, Math.min(size, ids.length)) : Math.max(1, Math.round(ids.length/size));
    const shuffle = a=>{ for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; };
    ids = shuffle(ids);
    if(balance){ const aid = areaId(), p = period();
      ids.sort((a,b)=>(areaFinal(c, b, aid, p.id) ?? 5) - (areaFinal(c, a, aid, p.id) ?? 5)); }
    const G = Array.from({length:nG}, ()=>[]);
    /* reparto en serpiente: 1..n, n..1 — con «equilibrar», cada grupo recibe alumnos de todos los niveles */
    ids.forEach((id,i)=>{ const r = Math.floor(i/nG), k = i%nG; G[r%2 ? nG-1-k : k].push(id); });
    toolsMem.groups = {cid:c.id, list:G.map(g=>shuffle(g))};
  };
  const pick = ()=>{
    const P = pool(); if(!P.length) return;
    let cand = noRepeat ? P.filter(s=>!picked().includes(s.id)) : P;
    if(!cand.length){ toolsMem.picked[c.id] = []; cand = P; }
    const win = cand[Math.floor(Math.random()*cand.length)];
    const el = root.querySelector('#pkName'); let n = 0;
    root.classList.add('spinning');
    const spin = setInterval(()=>{ el.textContent = P[Math.floor(Math.random()*P.length)].name; if(++n>=14){ clearInterval(spin);
      if(noRepeat) picked().push(win.id); else { picked().push(win.id); }
      root.classList.remove('spinning'); draw(); const el2 = root.querySelector('#pkName'); el2.classList.add('pop'); } }, 70);
  };
  root.addEventListener('click', e=>{
    const tb = e.target.closest('[data-tltab]'); if(tb){ tab = toolsMem.tab = tb.dataset.tltab; root.classList.remove('tm-end'); draw(); return; }
    const m = e.target.closest('[data-tlm]'); if(m){ T.run=false; clearInterval(T.iv); T.total = T.left = Number(m.dataset.tlm)*60; root.classList.remove('tm-end'); draw(); return; }
    const adj = e.target.closest('[data-tladj]'); if(adj){ const d = Number(adj.dataset.tladj);
      if(T.run){ T.leftAtStart += d; T.total = Math.max(T.total, T.leftAtStart); } else { T.left = Math.max(0, T.left + d); T.total = Math.max(T.left, d>0 ? T.total + d : T.total); if(T.left===0) T.total = 60; }
      draw(); return; }
    const b = e.target.closest('[data-tl]'); if(!b) return;
    const a = b.dataset.tl;
    if(a==='close'){ root.remove(); return; }
    if(a==='pick') return pick();
    if(a==='reset'){ toolsMem.picked[c.id] = []; draw(); return; }
    if(a==='mode-size'){ byCount=false; size=4; draw(); return; }
    if(a==='mode-count'){ byCount=true; size=Math.max(2, Math.round(pool().length/4)); draw(); return; }
    if(a==='minus'){ size = Math.max(byCount?1:2, size-1); draw(); return; }
    if(a==='plus'){ size = Math.min(Math.max(2,pool().length), size+1); draw(); return; }
    if(a==='groups'){ makeGroups(); draw(); return; }
    if(a==='start'){ if(T.left<=0) T.left = T.total; T.run = true; T.t0 = Date.now(); T.leftAtStart = T.left; clearInterval(T.iv); T.iv = setInterval(tick, 200); root.classList.remove('tm-end'); draw(); return; }
    if(a==='pause'){ T.run = false; clearInterval(T.iv); draw(); return; }
    if(a==='treset'){ T.run = false; clearInterval(T.iv); T.left = T.total; root.classList.remove('tm-end'); draw(); return; }
  });
  root.addEventListener('change', e=>{
    const o = e.target.dataset.tlo; if(!o) return;
    if(o==='norep') noRepeat = e.target.checked;
    if(o==='abs') skipAbs = e.target.checked;
    if(o==='bal') balance = e.target.checked;
    draw();
  });
  document.addEventListener('keydown', function esc2(e){ if(e.key==='Escape' && document.body.contains(root)){ root.remove(); document.removeEventListener('keydown', esc2); } });
  draw();
  document.body.appendChild(root);
  if(T.run){ clearInterval(T.iv); T.iv = setInterval(tick, 200); }
}
function viewTrimestreNotas(){
  const c = course(), aid = areaId(), p = period();
  if(!p) return `<div class="empty"><h3>Sin periodos</h3></div>`;
  if(!c.students.length) return `<div class="empty"><h3>Falta el alumnado</h3><button class="btn" data-act="tab" data-id="alumnos">Ir a Alumnado</button></div>`;
  // criterios trabajados en el trimestre (unión de todas las unidades del periodo)
  const codes = critsWorked(c, aid, p.id, null);
  const units = unitsOf(c, aid, p.id);
  if(!codes.length) return `<div class="empty"><h3>Todavía no hay nada que consolidar</h3><p>Crea unidades y tareas; aquí verás la nota media de cada criterio y la nota final del trimestre.</p><button class="btn" data-act="tab" data-id="unidades">Ir a Unidades</button></div>`;

  const critMap = areaDef(aid).crit[c.cycle] || {};
  // peso total configurado
  let wsum = 0, wset = 0;
  codes.forEach(cd=>{ const w=critWeight(c,aid,p.id,cd); if(w!=null){ wsum+=w; wset++; } });
  const pesosOk = wset===0 || wsum===100;

  const editW = !!state.editWeights;
  const custom = hasCustomWeights(c, aid, p.id);
  const header = `<div class="row" style="margin-bottom:6px">
      <h2 class="sec-title">Evaluación trimestral</h2></div>
    <p class="tpl-intro" style="margin-bottom:12px">${esc(areaDef(aid).name)} · ${esc(p.name)}. Cada criterio es la media de sus tareas; la nota final los pondera con el % que ves en su columna.
      ${custom? (pesosOk?'':` <span style="color:var(--low)">Tus pesos suman ${wsum}%, deberían sumar 100%.</span>`):' Ahora se reparten a partes iguales.'}</p>
    <div class="mode-bar" style="max-width:none">
      <button class="mode-btn ${editW?'adj on':'cal'}" data-act="setEditW" data-m="${editW?0:1}">
        <span class="mb-t">${editW?'Terminar de editar %':'Modificar % criterios'}</span>
        <span class="mb-s">${editW?'Guardar los pesos y volver':'Dar más peso a unos criterios que a otros'}</span></button>
      <button class="mode-btn cal" data-act="informes">
        <span class="mb-t">Informes</span><span class="mb-s">Boletín imprimible por alumno</span></button>
    </div>`;

  const unitTag = codes.reduce((m,cd)=>{ m[cd]=units.filter(u=>critsWorkedUnit(c,u.id).indexOf(cd)>-1).length; return m; },{});

  const thCrit = codes.map(cd=>{
    const pct = critWeightPct(c, aid, p.id, cd);
    const wRaw = critWeight(c, aid, p.id, cd);
    return `<th class="task" style="min-width:58px" title="${esc(critMap[cd]||'')}">${esc(cd)}<small>${editW? '' : pct+'%'}</small>
      ${editW? `<div style="padding:2px 3px"><input class="w-inp" inputmode="numeric" data-act="critW" data-code="${cd}" value="${wRaw==null?'':wRaw}" placeholder="${pct}" style="width:44px;font-size:12px;text-align:center"></div>`:''}</th>`;
  }).join('');

  const rows = c.students.map((s,idx)=>{
    const f = areaFinal(c, s.id, aid, p.id);
    const dv = c.diversity[dvkey(s.id, aid)]; const med = dv&&dv.med?medDef(dv.med):null;
    let tr = `<tr data-student="${s.id}"><td class="stick"><span class="rownum">${String(idx+1).padStart(2,'0')}</span>${esc(s.name)}${med?` <span class="tag warn" style="font-size:9px">${med.code}</span>`:''}</td>`;
    codes.forEach(cd=>{
      const own = critsWorked(c, aid, p.id, s.id).indexOf(cd)>-1;
      if(!own){ tr += `<td class="mark na" title="No forma parte de su adaptación">·</td>`; return; }
      const v = critScore(c, s.id, aid, p.id, cd);
      tr += `<td class="calif ${v!=null&&v<c.pass?'low':''}${tnv(v)}">${v==null?'<span style="color:#B9C4BC">–</span>':fmt2(v)}</td>`;
    });
    units.forEach((u,ui)=>{ const uv = unitScore(c, s.id, u.id);
      tr += `<td class="calif${ui?'':' td-sep'}${tnv(uv)}" title="${esc(u.name)}">${uv==null?'<span style="color:#B9C4BC">–</span>':fmt(uv)}</td>`; });
    tr += `<td class="final td-sep ${f!=null&&f<c.pass?'low':''}${tnv(f)}" data-final>${fmt(f)}</td><td class="calif">${pill(f, c.scale)}</td></tr>`;
    return tr;
  }).join('');

  return header + `<div class="scroll"><table class="grid"><thead>
      <tr><th class="stick">Alumno/a</th>${thCrit}${units.map((u,ui)=>`<th class="task${ui?'':' th-sep'}" style="min-width:58px" title="${esc(u.name)}">U${ui+1}<small>unidad</small></th>`).join('')}<th class="task th-sep">Nota<small>área</small></th><th class="task">Calif.</th></tr>
    </thead><tbody>${rows}</tbody></table></div>${toneLegend(c)}
    <div class="row" style="margin-top:14px;align-items:center">
      <p class="hint" style="margin:0;flex:1">${editW? 'Escribe el % de cada criterio; en blanco toma el valor gris de referencia. Deberían sumar 100%.' : 'El % de cada columna es su peso en la nota final. Para cambiarlo, usa «Modificar % criterios».'}</p>
      <button class="btn ghost small" data-act="csv">Exportar CSV</button>
    </div>`;
}

function viewCriterios(){

        </tbody></table></div>

  return `<div class="row" style="margin-bottom:10px">

    <div class="tpl-list">
      ${Object.keys(byCE).sort((a,b)=>a-b).map(ce=>{
        const nCrit = byCE[ce].length;
        const worked = byCE[ce].filter(k=>cov(k.code)>0).length;
        return `<details class="tpl-card">
          <summary class="tpl-sum">
            <span class="tpl-caret" aria-hidden="true">▸</span>
            <span class="tpl-name">Competencia específica ${ce}</span>
            <span class="tpl-type">${nCrit} criterio${nCrit>1?'s':''}</span>
          </summary>
          <div class="tpl-body">
            ${ces[ce]? `<p class="tpl-desc">${esc(ces[ce])}</p>`:''}
            ${byCE[ce].map(k=>`<div class="crit-row">
              <span class="crit-code">${esc(k.code)}</span>
              <span class="crit-text">${esc(k.text)}</span>
              <span class="tag ${cov(k.code)?'':'warn'}" title="Se evalúa en ${cov(k.code)} tarea(s)">${cov(k.code)}</span>
            </div>`).join('')}
          </div>

      }).join('')}

        <div class="tpl-body">
          <ul class="dua-list">${b.items.map((it,i)=>`<li><span class="grow">${esc(it)}</span>
            <button class="icon" data-act="duaDel" data-b="${bk}" data-i="${i}" title="Eliminar">✕</button></li>`).join('')}</ul>
        </div>
      </details>`;
    }).join('')}
    </div>
    ${custom?`<div class="row" style="margin-top:12px"><button class="btn danger small" data-act="duaReset">Volver al catálogo predeterminado</button></div>`:''}`;
}

function divByStudent(c, aid){
  const rows = c.students.map((s,i)=>{
    const d = c.diversity[dvkey(s.id,aid)];
    const has = hasDiv(c, s.id, aid);
    const med = d && d.med ? medDef(d.med) : null;
    const conds = stuConds(c, s.id);
    return `<div class="tut-row" data-act="openStudent" data-id="${s.id}">
      <span class="num">${String(i+1).padStart(2,'0')}</span>
      <span class="grow">${esc(s.name)}
        ${conds.length||stuActs(c, s.id).length? `<small style="display:block;color:var(--muted);font-size:11.5px">${conds.map(x=>`<span title="${esc(condDef(x).name)}">${esc(condDef(x).code)}</span>`).concat(stuActs(c, s.id).map(x=>`<span title="${esc(actDef(x).name)}">${esc(actDef(x).name.split(' ').slice(0,2).join(' ').replace(/ en$/,''))}</span>`)).join(' · ')}</small>`:''}</span>
      ${extMedsOf(c, s.id).map(x=>`<span class="tag ${x.m.sig?'warn':'grey'}" title="${esc(x.m.name)} · ${esc(x.e.name)} (otro docente)">${esc(x.e.name.slice(0,12))} · ${esc(x.m.code)}</span>`).join('')}
      ${med? `<span class="pill ${med.sig?'ACS-sig':''}" style="background:${med.cri?'#FCF1D8':'var(--accent-soft)'};color:${med.cri?'#8A6206':'var(--accent)'};border:1px solid ${med.cri?'#EEDCA8':'#B8D8C6'}">${med.code}</span>`
        : (has?'<span class="tag grey">medidas</span>':'')}
      <button class="btn small div-add" data-act="editDiv" data-id="${s.id}">${has||extMedsOf(c, s.id).length?'✎ Editar':'＋ Adaptación'}</button>
    </div>`;
  }).join('');
  const withMed = c.students.filter(s=>{ const d=c.diversity[dvkey(s.id,aid)]; return d&&d.med; }).length;
  return `<p class="tpl-intro">Perfil de cada alumno en ${esc(areaDef(aid).short||areaDef(aid).name)}. Usa el botón verde para añadir o cambiar sus adaptaciones, también las de áreas que no das tú. Toca el nombre para abrir su ficha. ${withMed} con medida específica.</p>
    <div class="card">${rows}</div>`;
}

  state.courses = [];                     // deja solo la clase de ejemplo

    {code:'SB', name:'Sobresaliente', min:9, ref:9.5}

  /* --- alumnado --- */
  const names = [
    'Aguilar Nieto, Lucía',      // 1
